name: base-images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/base-images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/base-images.yml"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      promote:
        description: "Dated base-spa tag to promote now, skipping the 7-day cooldown. Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  spa-check:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      dated: ${{ steps.check.outputs.dated }}
    env:
      IMAGE: ghcr.io/cujarrett/base-spa
      TAG: nginx1.31-alpine
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Nightly, a build happens only when the newest dated build has Alpine upgrades waiting.
      # Each build is a new digest, so building on a quiet night would restart the cooldown for nothing.
      - name: Decide whether to build
        id: check
        env:
          PROMOTE: ${{ inputs.promote }}
        run: |
          echo "dated=$TAG-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          newest=""
          for n in $(seq 0 60); do
            tag="$TAG-$(date -u -d "-$n days" +%F)"
            if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then newest="$tag"; break; fi
          done
          if [ -n "$PROMOTE" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ -z "$newest" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upgrades=$(docker run --rm --entrypoint sh "$IMAGE:$newest" -c 'apk update -q && apk list -u')
          echo "$upgrades"
          if [ -n "$upgrades" ]; then echo "build=true"; else echo "build=false"; fi >> "$GITHUB_OUTPUT"

  spa-build:
    needs: spa-check
    if: needs.spa-check.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Build from scratch each time, so it picks up the latest Alpine security fixes.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/cujarrett/base-spa
      tags: ghcr.io/cujarrett/base-spa:${{ needs.spa-check.outputs.dated }}
      context: images/base-spa
      fresh: true
      check-only: ${{ github.event_name == 'pull_request' }}

  # Apps follow the main tag, so a build reaches them only after 7 days.
  # Retagging keeps the digest, so the provenance still applies.
  spa-promote:
    needs: [spa-check, spa-build]
    if: ${{ always() && github.event_name != 'pull_request' && needs.spa-check.result == 'success' && needs.spa-build.result != 'failure' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cujarrett/base-spa
      TAG: nginx1.31-alpine
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote the newest build that is 7 days old
        env:
          PROMOTE: ${{ inputs.promote }}
        run: |
          # A manual promote skips the cooldown. The run log records who did it and which tag.
          if [ -n "$PROMOTE" ]; then
            if ! [[ "$PROMOTE" =~ ^$TAG-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "promote must look like $TAG-YYYY-MM-DD, got $PROMOTE"
              exit 1
            fi
            echo "$GITHUB_ACTOR promoted $PROMOTE without the cooldown"
            docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$PROMOTE"
            exit 0
          fi
          for n in $(seq 7 60); do
            src="$IMAGE:$TAG-$(date -u -d "-$n days" +%F)"
            if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE:$TAG" "$src"
              exit 0
            fi
          done
          echo "No build is 7 days old yet."

  go:
    # The distroless base changes only when Renovate bumps its FROM, which already waited 7 days.
    if: github.event_name != 'schedule' && inputs.promote == ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # amd64 too, because temporal-controller's e2e test builds its image on an amd64 runner.
    # The Dockerfile has no RUN step, so no emulation is needed.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/cujarrett/base-go
      tags: ghcr.io/cujarrett/base-go:static-debian13
      context: images/base-go
      platforms: linux/arm64,linux/amd64
      fresh: true
      check-only: ${{ github.event_name == 'pull_request' }}
