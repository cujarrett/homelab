name: base-images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/base-images.yml", ".github/workflows/base-nginx.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/base-images.yml", ".github/workflows/base-nginx.yml"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: "Image the promote applies to."
        type: choice
        options: [base-nginx, base-nginx-unprivileged]
        default: base-nginx
      promote:
        description: "Dated tag to promote now, skipping the 7-day cooldown. Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # base-nginx: built on nginx. Spas run it as their own non-root user.
  # base-nginx-unprivileged: built on nginx-unprivileged, which runs as uid 101.
  #   For charts that run the image as is, such as SPIRE's OIDC nginx.
  nginx:
    if: inputs.promote == '' || inputs.image == 'base-nginx'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/base-nginx.yml
    with:
      image: ghcr.io/cujarrett/base-nginx
      context: images/base-nginx
      promote: ${{ inputs.promote }}

  nginx-unprivileged:
    if: inputs.promote == '' || inputs.image == 'base-nginx-unprivileged'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/base-nginx.yml
    with:
      image: ghcr.io/cujarrett/base-nginx-unprivileged
      context: images/base-nginx-unprivileged
      promote: ${{ inputs.promote }}

  distroless:
    # The distroless base changes only when Renovate bumps its FROM, which already waited 7 days.
    if: github.event_name != 'schedule' && inputs.promote == ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # amd64 too, because temporal-controller's e2e test builds its image on an amd64 runner.
    # The Dockerfile has no RUN step, so no emulation is needed.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/cujarrett/base-distroless
      tags: ghcr.io/cujarrett/base-distroless:static-debian13
      context: images/base-distroless
      platforms: linux/arm64,linux/amd64
      fresh: true
      check-only: ${{ github.event_name == 'pull_request' }}

  rover:
    # Renovate bumps the Dockerfile. Each merge rebuilds rover:main.
    # PR routers pick up the new build the next time they start.
    if: github.event_name != 'schedule' && inputs.promote == ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/cujarrett/rover
      tags: ghcr.io/cujarrett/rover:main
      context: images/rover
      check-only: ${{ github.event_name == 'pull_request' }}
