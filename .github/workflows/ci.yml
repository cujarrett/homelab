name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=crossplane/cli
      CROSSPLANE_VERSION: v2.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cujarrett/homelab-workspaces
          path: workspaces
      - name: Install crossplane CLI
        run: |
          curl -sSfL -o crossplane https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane
          sudo install crossplane /usr/local/bin/crossplane
      - run: WORKSPACES="$GITHUB_WORKSPACE/workspaces" ./platform/test/render-check.sh

  kubeconform:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar xz
          sudo install kubeconform /usr/local/bin/kubeconform
      # The catalog supplies schemas for CRDs (Argo CD, Crossplane, Istio); kinds in neither source are skipped.
      - run: >
          kubeconform -summary -ignore-missing-schemas -ignore-filename-pattern '\.json$'
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          cluster platform
