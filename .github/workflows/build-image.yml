# Builds and pushes an image for any app repo, with signed provenance and an SBOM (SLSA Build L3).
# App repos call this workflow at @main.
# Every image is signed by this workflow, so the cluster has one signer to trust.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name with no tag, such as ghcr.io/cujarrett/foo
        type: string
        required: true
      tags:
        description: Tags to push, one per line, each a full image reference
        type: string
        required: true
      context:
        type: string
        default: .
      file:
        description: Dockerfile path. Empty means context/Dockerfile.
        type: string
        default: ""
      platforms:
        type: string
        default: linux/arm64
      build-args:
        type: string
        default: ""
      cache-scope:
        description: GitHub Actions cache scope. Empty turns the cache off.
        type: string
        default: ""
      check-only:
        description: True builds the image and stops there. Use it on pull requests.
        type: boolean
        default: false
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # This checks out the app repo that called the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ !inputs.check-only }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The attest steps below add the provenance and SBOM.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ inputs.tags }}
          push: ${{ !inputs.check-only }}
          provenance: false
          sbom: false
          cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
          cache-to: ${{ inputs.cache-scope != '' && format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}

      # With no sbom-path, actions/attest makes SLSA build provenance.
      # Storage records are off, so app repos need one less permission.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.check-only }}
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: ${{ !inputs.check-only }}
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !inputs.check-only }}
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
