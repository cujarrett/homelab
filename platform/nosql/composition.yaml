apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: nosql
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: NoSql
  mode: Pipeline
  pipeline:
    - step: render-aws-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: table
            base:
              apiVersion: dynamodb.aws.m.upbound.io/v1beta1
              kind: Table
              spec:
                forProvider:
                  region: "us-east-1"
                  billingMode: PAY_PER_REQUEST
                  hashKey: ""
                  attribute:
                    - name: ""
                      type: S
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dataRetention
                toFieldPath: spec.deletionPolicy
                transforms:
                  - type: map
                    map:
                      delete: Delete
                      retain: Orphan
              # External name = table name; deterministic so IAM inline policy
              # can scope to the exact table ARN without wildcards.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.partitionKey
                toFieldPath: spec.forProvider.hashKey
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.partitionKey
                toFieldPath: spec.forProvider.attribute[0].name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.partitionKeyType
                toFieldPath: spec.forProvider.attribute[0].type
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.tags.Table
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.tags.App
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.tags.Namespace
