apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xsqls.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XSql
    plural: xsqls
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [namespace]
                  properties:
                    region:
                      type: string
                      default: us-east-1
                      description: "Cloud region for the RDS instance (cloud only)."
                    size:
                      type: string
                      default: small
                      enum: [small, medium, large]
                      description: "Size for the RDS instance (cloud only). small=db.t4g.micro, medium=db.t4g.small, large=db.t4g.medium."
                    environment:
                      type: string
                      default: cluster
                      enum: [cluster, cloud]
                      description: "Runtime environment. cloud provisions AWS RDS Postgres; cluster provisions in-cluster Postgres."
                    namespace:
                      type: string
                      description: "Namespace to write the binding Secret into. Passed automatically by XApi."
