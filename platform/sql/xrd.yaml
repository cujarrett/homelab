apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xsqls.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XSql
    plural: xsqls
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [namespace]
                  properties:
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      description: "Size for the RDS instance (cloud only). xs=db.t4g.micro, sm=db.t4g.small, md=db.t4g.medium, lg=db.t4g.large."
                    backend:
                      type: string
                      default: private-cloud
                      enum: [private-cloud, public-cloud]
                      description: "Backend to provision. public-cloud provisions AWS RDS Postgres; private-cloud provisions in-cluster Postgres."
                    namespace:
                      type: string
                      description: "Namespace to write the binding Secret into. Passed automatically by XApi."
                    dataRetention:
                      type: string
                      default: delete
                      enum: [retain, delete]
                      description: "PVC reclaim behavior when the XR is deleted. retain=longhorn-retain (PVC survives XR deletion, data recoverable); delete=longhorn-delete (PVC wiped on XR deletion, data is unrecoverable). Intentionally destructive when set to delete."
