apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcache
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: XCache
  mode: Pipeline
  pipeline:
    - step: render-cache
      # environment: cluster → in-cluster Redis; cloud → AWS ElastiCache
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $env := $xr.spec.parameters.backend | default "private-cloud" }}
            {{- $ns := $xr.spec.parameters.namespace }}
            {{- $region := "us-east-1" }}
            {{- $size := $xr.spec.parameters.size | default "sm" }}
            {{- $nodeTypeMap := dict "xs" "cache.t4g.micro" "sm" "cache.t4g.small" "md" "cache.t4g.medium" "lg" "cache.t4g.medium" }}
            {{- $nodeType := get $nodeTypeMap $size | default "cache.t4g.micro" }}
            {{- $rgReady := "False" }}
            {{- $rgConn := dict }}
            {{- with index (.observed.resources | default dict) "replication-group" }}
              {{- $rgConn = .connectionDetails | default dict }}
              {{- range (.resource.status.conditions | default list) }}
                {{- if and (eq .type "Ready") (eq .status "True") }}
                  {{- $rgReady = "True" }}
                {{- end }}
              {{- end }}
            {{- end }}
            {{- $cacheRoleObs := index (.observed.resources | default dict) "cache-role" | default dict }}
            {{- $cacheRoleArn := "" }}
            {{- if $cacheRoleObs.resource }}{{- $cacheRoleArn = $cacheRoleObs.resource.status.atProvider.arn | default "" }}{{- end }}
            {{- $cacheProfileObs := index (.observed.resources | default dict) "cache-profile" | default dict }}
            {{- $cacheProfileArn := "" }}
            {{- if $cacheProfileObs.resource }}{{- $cacheProfileArn = $cacheProfileObs.resource.status.atProvider.arn | default "" }}{{- end }}
            {{- if eq $env "private-cloud" }}
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}-redis
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: redis-deployment
                # required for native k8s resources — no Crossplane Ready condition
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: {{ $name }}-redis
              template:
                metadata:
                  labels:
                    app: {{ $name }}-redis
                spec:
                  containers:
                    - name: redis
                      image: redis:7-alpine
                      ports:
                        - containerPort: 6379
                      resources:
                        requests:
                          cpu: "50m"
                          memory: "32Mi"
                        limits:
                          cpu: "200m"
                          memory: "64Mi"
                      readinessProbe:
                        tcpSocket:
                          port: 6379
                        initialDelaySeconds: 5
                        periodSeconds: 10
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}-redis
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: redis-service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app: {{ $name }}-redis
              ports:
                - port: 6379
                  targetPort: 6379
            ---
            # Same secret shape as cloud so XApi mounts it identically in both environments
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache-secret
                gotemplating.fn.crossplane.io/ready: "True"
            type: servicebinding.io/redis
            stringData:
              type: redis
              provider: in-cluster
              host: {{ $name }}-redis.{{ $ns }}.svc.cluster.local
              port: "6379"
            {{- else }}
            {{- /* Trust policy scoped to the XCache namespace (wildcard on SA). XCache does not  */}}
            {{- /* know which XApi SA will reference it; namespace isolation still applies.        */}}
            {{- $cacheTrustPolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "Service" "rolesanywhere.amazonaws.com") "Action" (list "sts:AssumeRole" "sts:TagSession" "sts:SetSourceIdentity") "Condition" (dict "StringLike" (dict "aws:PrincipalTag/x509SAN/URI" (printf "spiffe://homelab.local/ns/%s/sa/*" $ns))))) | toJson }}
            {{- $userId := printf "%s-user" $name }}
            {{- $userGroupId := $name }}
            {{- $cacheInlinePolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Action" "elasticache:Connect" "Resource" (list (printf "arn:aws:elasticache:%s:*:replicationgroup:%s" $region $name) (printf "arn:aws:elasticache:%s:*:user:%s" $region $userId)))) | toJson }}
            ---
            # IAM Role for ElastiCache IAM auth. Trust scoped to all SAs in the XCache namespace.
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              name: {{ $name }}-cache
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache-role
                gotemplating.fn.crossplane.io/ready: "True"
                crossplane.io/external-name: crossplane-{{ $ns }}-{{ $name }}-cache
            spec:
              deletionPolicy: Delete
              forProvider:
                path: /crossplane/
                tags:
                  App: {{ $name }}
                  Namespace: {{ $ns }}
                assumeRolePolicy: {{ $cacheTrustPolicy | quote }}
                inlinePolicy:
                  - name: platform-cache-{{ $ns }}-{{ $name }}
                    policy: {{ $cacheInlinePolicy | quote }}
            {{- if $cacheRoleArn }}
            {{- $cacheProfileExternalName := "00000000-0000-0000-0000-000000000000" }}
            {{- if $cacheProfileObs.resource }}
              {{- $cacheObservedExternalName := index ($cacheProfileObs.resource.metadata.annotations | default dict) "crossplane.io/external-name" | default "" }}
              {{- if $cacheObservedExternalName }}{{- $cacheProfileExternalName = $cacheObservedExternalName }}{{- end }}
            {{- end }}
            ---
            # RolesAnywhere Profile for ElastiCache. Deferred until role ARN is known.
            apiVersion: rolesanywhere.aws.upbound.io/v1beta1
            kind: Profile
            metadata:
              name: {{ $name }}-cache
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache-profile
                gotemplating.fn.crossplane.io/ready: "True"
                crossplane.io/external-name: {{ $cacheProfileExternalName }}
            spec:
              deletionPolicy: Delete
              forProvider:
                name: crossplane-{{ $ns }}-{{ $name }}-cache
                enabled: true
                durationSeconds: 3600
                roleArns:
                  - {{ $cacheRoleArn }}
                tags:
                  App: {{ $name }}
                  Namespace: {{ $ns }}
            {{- end }}
            ---
            # Provider writes connection details to {name}-rg-conn once ElastiCache is up
            apiVersion: elasticache.aws.upbound.io/v1beta2
            kind: ReplicationGroup
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: replication-group
                gotemplating.fn.crossplane.io/ready: {{ $rgReady | quote }}
            spec:
              forProvider:
                region: {{ $region }}
                description: "{{ $name }}"
                nodeType: {{ $nodeType }}
                engine: redis
                numCacheClusters: 1
                # TLS enabled for security; sidecar will provision credentials via RolesAnywhere
                transitEncryptionEnabled: true
                # Use default user with password auth for simplicity; IAM auth via STS credentials in sidecar
                authToken: "{{ printf \"%s-auth\" $name }}"
              writeConnectionSecretToRef:
                name: {{ $name }}-rg-conn
                namespace: {{ $ns }}
            {{- if and $rgConn $cacheRoleArn $cacheProfileArn }}
            ---
            # Binding Secret for ElastiCache. Written once the cluster is ready and IAM credentials
            # are known. No password — the app calls elasticache generate-auth-token via the sidecar.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache-secret
                gotemplating.fn.crossplane.io/ready: "True"
            type: servicebinding.io/redis
            stringData:
              type: redis
              provider: aws
              host: {{ index $rgConn "host" | default "" }}
              port: {{ index $rgConn "port" | default "6379" }}
              auth: "{{ printf \"%s-auth\" $name }}"
              role-arn: {{ $cacheRoleArn }}
              profile-arn: {{ $cacheProfileArn }}
            {{- end }}
            {{- end }}
