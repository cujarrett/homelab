apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: caches.platform.local.lab
spec:
  group: platform.local.lab
  scope: Namespaced
  names:
    kind: Cache
    plural: caches
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      description: "Size for the cache cluster (cloud only). xs=cache.t4g.micro, sm=cache.t4g.small, md=cache.t4g.medium, lg=cache.t4g.medium."
                    backend:
                      type: string
                      default: private-cloud
                      enum: [private-cloud, public-cloud]
                      description: "Backend to provision. public-cloud provisions AWS ElastiCache; private-cloud provisions in-cluster Redis."
                    consumerServiceAccount:
                      type: string
                      description: "Name of the Api service account that owns this cache. Used to scope the IAM trust policy to the exact SPIFFE identity instead of a namespace wildcard. Set automatically by the Api composition."
