apiVersion: platform.local.lab/v1alpha1
kind: XSpa
metadata:
  name: js-pollock
spec:
  parameters:
    image: ghcr.io/cujarrett/jspollock:latest
    host: jspollock.mattjarrett.dev
    tlsIssuer: letsencrypt-prod
    imagePullSecret: ghcr-pull-secret
    contentSecurityPolicy: "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"
    healthCheckPath: /healthz
    replicas: 1
    cpuRequest: "50m"
    cpuLimit: "200m"
    memoryRequest: "64Mi"
    memoryLimit: "128Mi"
