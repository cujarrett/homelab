apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xapis.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XApi
    plural: xapis
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    objectStorageRef:
                      type: object
                      description: "Reference to an existing XObjectStorage instance to bind. The platform mounts its Secret at /bindings/object-storage/."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the XObjectStorage instance."
                    sqlRef:
                      type: object
                      description: "Reference to an existing XSql instance to bind. The platform mounts its Secret at /bindings/sql/."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the XSql instance."
                    nosqlRef:
                      type: object
                      description: "Reference to an existing XNoSql instance to bind. The platform mounts its Secret at /bindings/nosql/."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the XNoSql instance."
                    cache:
                      type: object
                      description: "Cache options. Lifecycle tied to this XApi. If omitted, no cache is created."
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        environment:
                          type: string
                          default: cluster
                          enum: [cluster, cloud]
                          description: "Cache backend: cluster=in-cluster Redis, cloud=AWS ElastiCache."
                    image:
                      type: string
                      description: "Container image for the API (e.g. ghcr.io/owner/api:sha-abc123). CI builds and pushes this on merge to main, then commits the new tag back here to trigger an ArgoCD sync."
                    port:
                      type: integer
                      default: 8080
                      description: "Port the container listens on. Service always exposes port 80 → this targetPort."
                    metricsPort:
                      type: integer
                      default: 9090
                      description: "Port the container exposes Prometheus metrics on. Defaults to 9090. Set to match port if the app serves metrics on the same port as the app (e.g. 8080)."
                    scrapeInterval:
                      type: string
                      default: "60s"
                      description: "Prometheus scrape interval for the ServiceMonitor. Defaults to 60s. Reduce for apps that emit short-lived state changes (e.g. 10s for sump-pump-consumer)."
                    host:
                      type: string
                      description: "Hostname for the Ingress. If omitted, no Ingress is created."
                    tlsIssuer:
                      type: string
                      default: local-lab-ca-issuer
                      description: "cert-manager ClusterIssuer for TLS."
                    secretRef:
                      type: object
                      description: "Optional reference to a pre-existing Secret in the app namespace to inject into the API container via envFrom."
                      properties:
                        name:
                          type: string
                          description: "Name of the Secret."
                    topicRef:
                      type: object
                      description: "Optional reference to an XTopic instance this API publishes to. When set, the platform wires the connection automatically."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the XTopic instance (e.g. foo-events)."
                        streamName:
                          type: string
                          description: "NATS stream name as defined in the XTopic's spec.parameters.streamName. Defaults to topicRef.name uppercased when omitted. Set explicitly when the XTopic's streamName differs from its metadata.name."
                    namespace:
                      type: string
                      description: "Namespace to deploy into. Must already exist (created by the tenant's namespace.yaml)."
                    subscriptionRef:
                      type: object
                      description: "Optional reference to an XSubscription instance this API consumes from. When set, the platform wires the consumer binding automatically."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the XSubscription instance (e.g. nms-metrics-consumer)."
                    replicas:
                      type: integer
                      default: 1
                      description: "Number of API replicas."
                    healthCheckPath:
                      type: string
                      default: "/healthz"
                      description: "Path the container serves for readiness probes. Returns HTTP 200."
                    cpuRequest:
                      type: string
                      default: "50m"
                      description: "CPU request for the API container."
                    cpuLimit:
                      type: string
                      default: "200m"
                      description: "CPU limit for the API container."
                    memoryRequest:
                      type: string
                      default: "32Mi"
                      description: "Memory request for the API container."
                    memoryLimit:
                      type: string
                      default: "64Mi"
                      description: "Memory limit for the API container."
                  required: [image, namespace]
              required:
                - parameters
