apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: apis.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: Api
    plural: apis
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    objectStorageRefs:
                      type: array
                      description: "References to ObjectStorage instances to bind. Each ref creates an IAM role and binding Secret. The first ref mounts at /bindings/object-storage/, subsequent refs at /bindings/object-storage-1/, /bindings/object-storage-2/, and so on."
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: "metadata.name of the ObjectStorage instance."
                    sqlRef:
                      type: object
                      description: "Reference to an existing Sql instance to bind. The platform mounts its Secret at /bindings/sql/."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the Sql instance."
                        backend:
                          type: string
                          default: private-cloud
                          enum: [private-cloud, public-cloud]
                          description: "Must match the Sql instance's spec.parameters.backend. When public-cloud, the sidecar exchanges the SVID for STS credentials so the app can generate an RDS auth token."
                    nosqlRef:
                      type: object
                      description: "Reference to an existing NoSql instance to bind. The platform mounts its Secret at /bindings/nosql/."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the NoSql instance."
                    cache:
                      type: object
                      description: "Cache options. Lifecycle tied to this Api. If omitted, no cache is created."
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        backend:
                          type: string
                          default: private-cloud
                          enum: [private-cloud, public-cloud]
                          description: "Cache backend: private-cloud=in-cluster Redis, public-cloud=AWS ElastiCache."
                    image:
                      type: string
                      description: >-
                        Container image (e.g. ghcr.io/owner/api:sha-abc123). Managed by CI —
                        set on first create, then updated automatically on each merge to main.
                    repo:
                      type: string
                      description: "GitHub repository URL for this app's source code (e.g. https://github.com/owner/api)."
                    port:
                      type: integer
                      default: 8080
                      minimum: 1
                      description: "Port the container listens on. Service always exposes port 80 → this targetPort."
                    metricsPort:
                      type: integer
                      default: 9090
                      minimum: 1
                      description: "Port the container exposes Prometheus metrics on. Defaults to 9090. Set to match port if the app serves metrics on the same port as the app (e.g. 8080)."
                    scrapeInterval:
                      type: string
                      default: "60s"
                      description: "Prometheus scrape interval for the ServiceMonitor. Defaults to 60s. Reduce for apps that emit short-lived state changes (e.g. 10s for sump-pump-consumer)."
                      pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
                    host:
                      type: string
                      description: "Hostname for the Ingress. If omitted, no Ingress is created."
                    tlsIssuer:
                      type: string
                      default: local-lab-ca-issuer
                      enum:
                        - local-lab-ca-issuer
                        - letsencrypt-prod
                      description: "Certificate issuer. Internal for services only on the homelab network. External for services exposed via Cloudflare Tunnel to the public internet."
                    tlsSecret:
                      type: string
                      description: "Name of a pre-existing TLS Secret in the app namespace. When set, the Ingress references it directly and cert-manager issuance is skipped."
                    secretRef:
                      type: object
                      description: "Optional reference to a pre-existing Secret in the app namespace to inject into the API container via envFrom."
                      properties:
                        name:
                          type: string
                          description: "Name of the Secret."
                    topicRef:
                      type: object
                      description: "Optional reference to a Topic instance this API publishes to. When set, the platform wires the connection automatically."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the Topic instance (e.g. foo-events)."
                        streamName:
                          type: string
                          description: "NATS stream name as defined in the Topic's spec.parameters.streamName. Defaults to topicRef.name uppercased when omitted. Set explicitly when the Topic's streamName differs from its metadata.name."
                    namespace:
                      type: string
                      description: "Namespace to deploy into. Must already exist (created by the tenant's namespace.yaml)."
                    subscriptionRef:
                      type: object
                      description: "Optional reference to a Subscription instance this API consumes from. When set, the platform wires the consumer binding automatically."
                      required: [name]
                      properties:
                        name:
                          type: string
                          description: "metadata.name of the Subscription instance (e.g. nms-metrics-consumer)."
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                      description: "Number of API replicas."
                    readinessCheckPath:
                      type: string
                      default: /healthz
                      description: "HTTP path the readiness probe hits. Defaults to /healthz. Set to /readyz for apps that gate readiness on external dependencies (e.g. service bindings)."
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      description: "Compute tier for the container. Choose based on expected traffic — Extra Small suits low-traffic or background services; Large suits high-throughput workloads."
                    connectionPosture:
                      type: string
                      default: "off"
                      enum: ["off", "enforce"]
                      description: "Connection policy for this workload. off renders nothing. enforce means calls in are denied unless this API declared the caller in provides, and calls out are blocked unless the destination is same-namespace or declared in consumes."
                    provides:
                      type: array
                      description: "Named interfaces this API exposes to other workloads. Anything not listed here cannot call this API once connectionPosture is enforce."
                      items:
                        type: object
                        required: [name, allowedCallers]
                        properties:
                          name:
                            type: string
                            description: "Interface name (e.g. collection). Groups a set of routes under one grant."
                          methods:
                            type: array
                            description: "HTTP methods this interface allows. Omit for all methods — the coarsest, lowest-upkeep default. Narrow only if this API genuinely has more than one trust boundary."
                            items:
                              type: string
                          paths:
                            type: array
                            description: "URL path globs this interface allows (e.g. /api/v1/collection/*). Omit for all paths — see methods."
                            items:
                              type: string
                          allowedCallers:
                            type: array
                            description: "Workloads granted this interface. Everything else is denied."
                            items:
                              type: object
                              required: [namespace, app]
                              properties:
                                namespace:
                                  type: string
                                  description: "Namespace the calling workload runs in."
                                app:
                                  type: string
                                  description: "The calling Api/Spa's metadata.name — also its ServiceAccount name."
                    consumes:
                      type: array
                      description: "Destinations this workload calls that no other field already states. Same-namespace destinations and anything this XR creates itself (e.g. its own cache) are allowed automatically — do not list them. Set either host (off-platform) or app+namespace (another namespace on the platform)."
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                            description: "Off-platform hostname (e.g. api.discogs.com). Anything not listed is blocked at this workload's own sidecar."
                          port:
                            type: integer
                            description: "Port for host. Defaults to 443 when omitted."
                          protocol:
                            type: string
                            enum: [TLS, HTTP]
                            description: "Wire protocol for host. TLS for any https:// destination — the app terminates its own TLS. HTTP only for plaintext destinations."
                          app:
                            type: string
                            description: "metadata.name of an Api in another namespace this calls. Use with namespace."
                          namespace:
                            type: string
                            description: "Namespace of app. Required when app is set."
                  required: [image, namespace]
              required:
                - parameters
