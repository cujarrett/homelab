apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: api
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: Api
  mode: Pipeline
  pipeline:
    - step: load-environment-configs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: aws-platform-config
    - step: render-all-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: | # yaml
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $cacheBackend := ($xr.spec.parameters.cache | default dict).backend | default "private-cloud" }}
            {{- /* Refs point to standalone resources created outside this Api. */ -}}
            {{- /* The binding Secret already exists in $ns - just mount it.    */ -}}
            {{- $objectStorageRefs := $xr.spec.parameters.objectStorageRefs | default list }}
            {{- $envCtx := index .context "apiextensions.crossplane.io/environment" | default dict }}
            {{- $awsAccountId := index $envCtx "awsAccountId" | default "" }}
            {{- /* Public issuer, so it is hardcoded next to the trust domain rather than */ -}}
            {{- /* injected. Must match the IAM OIDC provider registered in AWS.          */ -}}
            {{- $oidcIssuerHost := "oidc.mattjarrett.dev" }}
            {{- $oidcProviderArn := printf "arn:aws:iam::%s:oidc-provider/%s" $awsAccountId $oidcIssuerHost }}
            {{- /* Every AWS role this Api gets trusts the same one subject: this pod's SPIFFE  */ -}}
            {{- /* ID. Built once here rather than per binding, because a second copy is a   */ -}}
            {{- /* second thing to keep in step.                                            */ -}}
            {{- $trustPolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "Federated" $oidcProviderArn) "Action" "sts:AssumeRoleWithWebIdentity" "Condition" (dict "StringEquals" (dict (printf "%s:aud" $oidcIssuerHost) "sts.amazonaws.com" (printf "%s:sub" $oidcIssuerHost) (printf "spiffe://homelab.local/ns/%s/sa/%s" $ns $name))))) | toJson }}
            {{- $provides := $xr.spec.parameters.provides | default list }}
            {{- /* Interfaces carry their own auth mode, so the two claim types split here */ -}}
            {{- /* once and every Entra object below reads one of these lists.            */ -}}
            {{- $appRoles := list }}
            {{- $delegatedScopes := list }}
            {{- range $iface := $provides }}
            {{- $mode := $iface.auth }}
            {{- if eq $mode "user" }}
            {{- $delegatedScopes = append $delegatedScopes $iface }}
            {{- else if eq $mode "workload" }}
            {{- $appRoles = append $appRoles $iface }}
            {{- end }}
            {{- end }}
            {{- /* Declared once here, read by both the mesh rules far below and the      */ -}}
            {{- /* Entra scope env vars above them.                                       */ -}}
            {{- $consumes := $xr.spec.parameters.consumes | default list }}
            {{- /* An app that offers an interface, or calls one, needs an identity.       */ -}}
            {{- /* Nothing declares it, because the declaration already exists.            */ -}}
            {{- /* A mesh-only interface needs no Entra object, so offering one is not     */ -}}
            {{- /* enough. An identity appears when a token is actually in play.           */ -}}
            {{- $entraNeeded := or (gt (len $appRoles) 0) (gt (len $delegatedScopes) 0) }}
            {{- range $c := $consumes }}
            {{- if or $c.app $c.entraApp }}{{- $entraNeeded = true }}{{- end }}
            {{- end }}
            {{- /* crossplane-entra's own service principal object ID - set as owner on   */ -}}
            {{- /* everything it creates, or it can create but never delete/update again.  */ -}}
            {{- /* See cluster/crossplane/azuread-permissions.md.                          */ -}}
            {{- $crossplaneEntraSpId := index $envCtx "crossplaneEntraServicePrincipalId" | default "" }}
            {{- $entraTenantId := index $envCtx "entraTenantId" | default "" }}
            {{- $observedResources := .observed.resources | default dict }}
            {{- $entraAppObs := index $observedResources "entra-application" | default dict }}
            {{- $entraClientId := "" }}
            {{- if $entraAppObs.resource }}{{- $entraClientId = $entraAppObs.resource.status.atProvider.clientId | default "" }}{{- end }}
            {{- $sqlRefName := "" }}
            {{- if $xr.spec.parameters.sqlRef }}{{- $sqlRefName = $xr.spec.parameters.sqlRef.name }}{{- end }}
            {{- $nosqlRefName := "" }}
            {{- if $xr.spec.parameters.nosqlRef }}{{- $nosqlRefName = $xr.spec.parameters.nosqlRef.name }}{{- end }}
            {{- $sqlBackend := "private-cloud" }}
            {{- if $xr.spec.parameters.sqlRef }}{{- $sqlBackend = $xr.spec.parameters.sqlRef.backend | default "private-cloud" }}{{- end }}
            {{- $cacheEnabled := and $xr.spec.parameters.cache $xr.spec.parameters.cache.enabled }}
            {{- $host := $xr.spec.parameters.host | default "" }}
            {{- $tlsIssuer := $xr.spec.parameters.tlsIssuer | default "local-lab-ca-issuer" }}
            {{- $tlsSecret := $xr.spec.parameters.tlsSecret | default "" }}
            {{- $metricsPort := $xr.spec.parameters.metricsPort | default 9090 }}
            {{- $scrapeInterval := $xr.spec.parameters.scrapeInterval | default "60s" }}
            {{- $replicas := $xr.spec.parameters.replicas | default 1 }}
            {{- $healthCheckPath := $xr.spec.parameters.readinessCheckPath | default "/healthz" }}
            {{- $sizeResourceMap := dict "xs" (dict "cpuReq" "25m" "cpuLim" "100m" "memReq" "32Mi" "memLim" "64Mi") "sm" (dict "cpuReq" "50m" "cpuLim" "200m" "memReq" "64Mi" "memLim" "128Mi") "md" (dict "cpuReq" "100m" "cpuLim" "500m" "memReq" "128Mi" "memLim" "256Mi") "lg" (dict "cpuReq" "250m" "cpuLim" "1000m" "memReq" "256Mi" "memLim" "512Mi") }}
            {{- $sizeKey := $xr.spec.parameters.size | default "sm" }}
            {{- $sizeResources := get $sizeResourceMap $sizeKey | default (get $sizeResourceMap "sm") }}
            {{- $secretsFrom := $xr.spec.parameters.secretsFrom | default list }}
            {{- $configFrom := $xr.spec.parameters.configFrom | default list }}
            {{- $topicRefName := "" }}
            {{- $topicStreamName := "" }}
            {{- if $xr.spec.parameters.topicRef }}
            {{- $topicRefName = $xr.spec.parameters.topicRef.name }}
            {{- $topicStreamName = ($xr.spec.parameters.topicRef.streamName | default ($xr.spec.parameters.topicRef.name | upper)) }}
            {{- end }}
            {{- $subscriptionRefName := "" }}
            {{- if $xr.spec.parameters.subscriptionRef }}{{- $subscriptionRefName = $xr.spec.parameters.subscriptionRef.name }}{{- end }}
            {{- /* AWS workload identity: build binding lists for sidecar + app container injection. */ -}}
            {{- /* volumeName:mountPath:profile triples (used for volume mounts in sidecar)      */ -}}
            {{- $awsBindings := list }}
            {{- /* mountPath:profile pairs (used for AWS_BINDINGS env var in sidecar)            */ -}}
            {{- $sidecarBindingParts := list }}
            {{- range $i, $ref := $objectStorageRefs }}
              {{- $osMountName := "object-storage" }}{{- if gt $i 0 }}{{- $osMountName = printf "object-storage-%d" $i }}{{- end }}
              {{- $awsBindings = append $awsBindings (printf "object-storage-%s-binding:/bindings/%s:%s" $ref.name $osMountName $osMountName) }}
              {{- $sidecarBindingParts = append $sidecarBindingParts (printf "/bindings/%s:%s" $osMountName $osMountName) }}
            {{- end }}
            {{- if $nosqlRefName }}
              {{- $awsBindings = append $awsBindings "nosql-binding:/bindings/nosql:nosql" }}
              {{- $sidecarBindingParts = append $sidecarBindingParts "/bindings/nosql:nosql" }}
            {{- end }}
            {{- if and $sqlRefName (eq $sqlBackend "public-cloud") }}
              {{- $awsBindings = append $awsBindings "sql-binding:/bindings/sql:sql" }}
              {{- $sidecarBindingParts = append $sidecarBindingParts "/bindings/sql:sql" }}
            {{- end }}
            {{- if and $cacheEnabled (eq $cacheBackend "public-cloud") }}
              {{- $awsBindings = append $awsBindings (printf "cache-binding:/bindings/cache:cache") }}
              {{- $sidecarBindingParts = append $sidecarBindingParts "/bindings/cache:cache" }}
            {{- end }}
            {{- /* Endpoints this pod must reach because of what it bound, not because    */ -}}
            {{- /* it asked. The mesh has no idea these exist otherwise, so under         */ -}}
            {{- /* REGISTRY_ONLY every one of them is a blackhole. Add to this list in    */ -}}
            {{- /* this block only - it is read further down and never rebuilt.           */ -}}
            {{- $derivedHosts := list }}
            {{- if gt (len $awsBindings) 0 }}
              {{- /* The credential sidecar calls this to turn its SVID into AWS keys.    */ -}}
              {{- /* Without it nothing else here works - no credentials, no calls.       */ -}}
              {{- $derivedHosts = append $derivedHosts "sts.us-east-1.amazonaws.com" }}
            {{- end }}
            {{- range $ref := $objectStorageRefs }}
              {{- /* Virtual-hosted style is the AWS SDK default, so SNI carries the      */ -}}
              {{- /* bucket name - one host per bucket, not one regional endpoint.        */ -}}
              {{- $derivedHosts = append $derivedHosts (printf "platform-%s-%s.s3.us-east-1.amazonaws.com" $ns $ref.name) }}
            {{- end }}
            {{- if $nosqlRefName }}
              {{- /* Every table in a region shares this endpoint - the table name is in */ -}}
              {{- /* the request body, not the hostname, so IAM is what scopes access.   */ -}}
              {{- $derivedHosts = append $derivedHosts "dynamodb.us-east-1.amazonaws.com" }}
            {{- end }}
            {{- if $entraNeeded }}
              {{- /* Where an SVID is traded for an Entra token. Same reasoning as STS   */ -}}
              {{- /* above - opting into Entra is what declares this, so the app never   */ -}}
              {{- /* restates it and cannot forget to.                                   */ -}}
              {{- $derivedHosts = append $derivedHosts "login.microsoftonline.com" }}
            {{- end }}
            {{- /* Nothing for public-cloud Sql or Cache - RDS and ElastiCache are VPC   */ -}}
            {{- /* only, so unreachable from this cluster. If that changes, the call     */ -}}
            {{- /* fails loudly here and the host goes in consumes.                      */ -}}
            # --- Service ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app: api
                app.kubernetes.io/instance: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/instance: {{ $name }}
              ports:
                - name: http
                  port: 80
                  targetPort: {{ $xr.spec.parameters.port | default 8080 }}
                - name: metrics
                  port: {{ $metricsPort }}
                  targetPort: {{ $metricsPort }}
            ---
            # --- ServiceAccount ---
            # Dedicated SA per Api instance - pods do not use the namespace default SA.
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: serviceaccount
                gotemplating.fn.crossplane.io/ready: "True"
            {{- $boundSecrets := list }}
            {{- range $objectStorageRefs }}{{- $boundSecrets = append $boundSecrets (printf "%s-%s" $name .name) }}{{- end }}
            {{- if $sqlRefName }}
              {{- if eq $sqlBackend "public-cloud" }}
                {{- $boundSecrets = append $boundSecrets (printf "%s-sql" $name) }}
              {{- else }}
                {{- $boundSecrets = append $boundSecrets $sqlRefName }}
              {{- end }}
            {{- end }}
            {{- if $nosqlRefName }}{{- $boundSecrets = append $boundSecrets (printf "%s-nosql" $name) }}{{- end }}
            {{- if $cacheEnabled }}{{- $boundSecrets = append $boundSecrets (printf "%s-cache" $name) }}{{- end }}
            {{- range $s := $secretsFrom }}{{- $boundSecrets = append $boundSecrets $s }}{{- end }}
            {{- if $boundSecrets }}
            ---
            # --- Role ---
            # Grants get only on the exact Secrets this instance mounts or injects.
            # Prevents a compromised container from reading other Secrets in the namespace.
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role
                gotemplating.fn.crossplane.io/ready: "True"
            rules:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get"]
                resourceNames:
                  {{- range $boundSecrets }}
                  - {{ . | quote }}
                  {{- end }}
            ---
            # --- RoleBinding ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: rolebinding
                gotemplating.fn.crossplane.io/ready: "True"
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: {{ $name }}
            subjects:
              - kind: ServiceAccount
                name: {{ $name }}
                namespace: {{ $ns }}
            {{- end }}
            ---
            # --- Deployment ---
            # Init containers poll for each binding's "type" file - last key written,
            # confirming all binding keys are available before the app starts.
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app: api
                app.kubernetes.io/instance: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              replicas: {{ $replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/instance: {{ $name }}
              template:
                metadata:
                  labels:
                    app: api
                    app.kubernetes.io/instance: {{ $name }}
                spec:
                  serviceAccountName: {{ $name }}
                  # runAsUser overrides the image's own USER, which several app images
                  # give as a name - and the kubelet refuses runAsNonRoot for a name it
                  # cannot resolve. 65532 suits every image because the binaries are
                  # root-owned 0755, so none needs to own the uid it runs as.
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  {{- if or (gt (len $objectStorageRefs) 0) $sqlRefName $nosqlRefName $cacheEnabled }}
                  initContainers:
                    {{- range $i, $ref := $objectStorageRefs }}
                    {{- $osMountName := "object-storage" }}{{- if gt $i 0 }}{{- $osMountName = printf "object-storage-%d" $i }}{{- end }}
                    - name: wait-for-object-storage-{{ $ref.name }}-binding
                      image: busybox:1.36
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/{{ $osMountName }}/type ]; do echo waiting for {{ $ref.name }} binding; sleep 5; done"
                      volumeMounts:
                        - name: object-storage-{{ $ref.name }}-binding
                          mountPath: /bindings/{{ $osMountName }}
                          readOnly: true
                    {{- end }}
                    {{- if $sqlRefName }}
                    - name: wait-for-sql-binding
                      image: busybox:1.36
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/sql/type ]; do echo waiting for sql binding; sleep 5; done"
                      volumeMounts:
                        - name: sql-binding
                          mountPath: /bindings/sql
                          readOnly: true
                    {{- end }}
                    {{- if $nosqlRefName }}
                    - name: wait-for-nosql-binding
                      image: busybox:1.36
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/nosql/type ]; do echo waiting for nosql binding; sleep 5; done"
                      volumeMounts:
                        - name: nosql-binding
                          mountPath: /bindings/nosql
                          readOnly: true
                    {{- end }}
                    {{- if $cacheEnabled }}
                    - name: wait-for-cache-binding
                      image: busybox:1.36
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/cache/type ]; do echo waiting for cache binding; sleep 5; done"
                      volumeMounts:
                        - name: cache-binding
                          mountPath: /bindings/cache
                          readOnly: true
                    {{- end }}
                  {{- end }}
                  containers:
                    - name: api
                      image: {{ $xr.spec.parameters.image }}
                      imagePullPolicy: Always
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      ports:
                        - containerPort: {{ $xr.spec.parameters.port | default 8080 }}
                      resources:
                        requests:
                          cpu: {{ get $sizeResources "cpuReq" }}
                          memory: {{ get $sizeResources "memReq" }}
                        limits:
                          cpu: {{ get $sizeResources "cpuLim" }}
                          memory: {{ get $sizeResources "memLim" }}
                      readinessProbe:
                        httpGet:
                          path: {{ $healthCheckPath }}
                          port: {{ $xr.spec.parameters.port | default 8080 }}
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      env:
                        # servicebinding.io convention: $SERVICE_BINDING_ROOT/<binding>/<key>
                        - name: SERVICE_BINDING_ROOT
                          value: /bindings
                      {{- if gt (len $awsBindings) 0 }}
                        - name: AWS_SHARED_CREDENTIALS_FILE
                          value: /aws-credentials/credentials
                        {{- range $i, $ref := $objectStorageRefs }}
                        {{- $osMountNameEnv := "object-storage" }}{{- if gt $i 0 }}{{- $osMountNameEnv = printf "object-storage-%d" $i }}{{- end }}
                        - name: AWS_PROFILE_{{ $ref.name | upper | replace "-" "_" }}
                          value: {{ $osMountNameEnv }}
                        {{- end }}
                        {{- if $nosqlRefName }}
                        - name: AWS_PROFILE_NOSQL
                          value: nosql
                        {{- end }}
                        {{- if and $sqlRefName (eq $sqlBackend "public-cloud") }}
                        - name: AWS_PROFILE_SQL
                          value: sql
                        {{- end }}
                        {{- if and $cacheEnabled (eq $cacheBackend "public-cloud") }}
                        - name: AWS_PROFILE_CACHE
                          value: cache
                        {{- end }}
                      {{- end }}
                      {{- if $entraNeeded }}
                        # Read by the Azure SDK's WorkloadIdentityCredential - it does the
                        # client_assertion exchange itself, not this sidecar. See
                        # workload-identity-sidecar's README for the split.
                        - name: AZURE_CLIENT_ID
                          value: {{ $entraClientId | quote }}
                        - name: AZURE_TENANT_ID
                          value: {{ $entraTenantId | quote }}
                        - name: AZURE_FEDERATED_TOKEN_FILE
                          value: /entra-identity/token
                        {{- range $c := $consumes }}
                        {{- if and $c.app $c.namespace }}
                        # One per app this Api already said it calls. The URI format is
                        # the platform's own, so an app that had to build this string
                        # would be guessing at a convention it cannot see.
                        - name: ENTRA_SCOPE_{{ $c.app | upper | replace "-" "_" }}
                          value: api://{{ $entraTenantId }}/platform-{{ $c.namespace }}-{{ $c.app }}/.default
                        {{- end }}
                        {{- if $c.entraApp }}
                        # A registration the platform does not own, so its owner supplied
                        # the URI. Injected for the same reason as the derived ones: the
                        # app should never assemble an audience string by hand.
                        - name: ENTRA_SCOPE_{{ $c.entraApp.role | upper | replace "." "_" | replace "-" "_" }}
                          value: {{ printf "%s/.default" $c.entraApp.appIdUri | quote }}
                        {{- end }}
                        {{- end }}
                      {{- end }}
                      {{- if $topicRefName }}
                        # Topic wiring: injected automatically from topicRef.
                        # App reads NATS_URL + NATS_STREAM to publish events.
                        - name: NATS_URL
                          value: "nats://nats.nats.svc.cluster.local:4222"
                        - name: NATS_STREAM
                          value: {{ $topicStreamName | quote }}
                      {{- end }}
                      {{- if $subscriptionRefName }}
                        # Subscription wiring: injected automatically from subscriptionRef.
                        # App reads NATS_CONSUMER to bind to the durable cursor.
                        {{- if not $topicRefName }}
                        - name: NATS_URL
                          value: "nats://nats.nats.svc.cluster.local:4222"
                        {{- end }}
                        - name: NATS_CONSUMER
                          value: {{ $subscriptionRefName | quote }}
                      {{- end }}
                      {{- if or $configFrom $secretsFrom }}
                      envFrom:
                        {{- range $cm := $configFrom }}
                        - configMapRef:
                            name: {{ $cm }}
                        {{- end }}
                        {{- range $s := $secretsFrom }}
                        - secretRef:
                            name: {{ $s }}
                        {{- end }}
                      {{- end }}
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                        {{- if gt (len $awsBindings) 0 }}
                        - name: aws-credentials
                          mountPath: /aws-credentials
                          readOnly: true
                        {{- end }}
                        {{- range $i, $ref := $objectStorageRefs }}
                        {{- $osMountName := "object-storage" }}{{- if gt $i 0 }}{{- $osMountName = printf "object-storage-%d" $i }}{{- end }}
                        - name: object-storage-{{ $ref.name }}-binding
                          mountPath: /bindings/{{ $osMountName }}
                          readOnly: true
                        {{- end }}
                        {{- if $sqlRefName }}
                        - name: sql-binding
                          mountPath: /bindings/sql
                          readOnly: true
                        {{- end }}
                        {{- if $nosqlRefName }}
                        - name: nosql-binding
                          mountPath: /bindings/nosql
                          readOnly: true
                        {{- end }}
                        {{- if $cacheEnabled }}
                        - name: cache-binding
                          mountPath: /bindings/cache
                          readOnly: true
                        {{- end }}
                        {{- if $entraNeeded }}
                        - name: entra-identity
                          mountPath: /entra-identity
                          readOnly: true
                        {{- end }}
                    {{- if or (gt (len $awsBindings) 0) $entraNeeded }}
                    - name: workload-identity-sidecar
                      image: ghcr.io/cujarrett/workload-identity-sidecar:main
                      imagePullPolicy: Always
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      env:
                        {{- if gt (len $awsBindings) 0 }}
                        - name: AWS_BINDINGS
                          value: {{ join "," $sidecarBindingParts | quote }}
                        - name: CREDS_FILE
                          value: /aws-credentials/credentials
                        {{- end }}
                        {{- if $entraNeeded }}
                        - name: ENTRA_FEDERATED_TOKEN_FILE
                          value: /entra-identity/token
                        {{- end }}
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                        - name: spiffe-bundle
                          mountPath: /var/run/secrets/spiffe.io
                          readOnly: true
                        {{- if gt (len $awsBindings) 0 }}
                        - name: aws-credentials
                          mountPath: /aws-credentials
                        {{- end }}
                        {{- if $entraNeeded }}
                        - name: entra-identity
                          mountPath: /entra-identity
                        {{- end }}
                        {{- range $i, $ref := $objectStorageRefs }}
                        {{- $osMountName := "object-storage" }}{{- if gt $i 0 }}{{- $osMountName = printf "object-storage-%d" $i }}{{- end }}
                        - name: object-storage-{{ $ref.name }}-binding
                          mountPath: /bindings/{{ $osMountName }}
                          readOnly: true
                        {{- end }}
                        {{- if $nosqlRefName }}
                        - name: nosql-binding
                          mountPath: /bindings/nosql
                          readOnly: true
                        {{- end }}
                        {{- if and $sqlRefName (eq $sqlBackend "public-cloud") }}
                        - name: sql-binding
                          mountPath: /bindings/sql
                          readOnly: true
                        {{- end }}
                        {{- if and $cacheEnabled (eq $cacheBackend "public-cloud") }}
                        - name: cache-binding
                          mountPath: /bindings/cache
                          readOnly: true
                        {{- end }}
                    {{- end }}
                  volumes:
                    - name: tmp
                      emptyDir: {}
                    {{- if or (gt (len $awsBindings) 0) $entraNeeded }}
                    - name: spiffe-bundle
                      csi:
                        driver: csi.spiffe.io
                        readOnly: true
                    {{- end }}
                    {{- if gt (len $awsBindings) 0 }}
                    - name: aws-credentials
                      emptyDir: {}
                    {{- end }}
                    {{- if $entraNeeded }}
                    - name: entra-identity
                      emptyDir: {}
                    {{- end }}
                    {{- range $objectStorageRefs }}
                    - name: object-storage-{{ .name }}-binding
                      secret:
                        secretName: {{ $name }}-{{ .name }}
                        optional: true
                    {{- end }}
                    {{- if $sqlRefName }}
                    - name: sql-binding
                      secret:
                        secretName: {{ if eq $sqlBackend "public-cloud" }}{{ $name }}-sql{{ else }}{{ $sqlRefName }}{{ end }}
                        optional: true
                    {{- end }}
                    {{- if $nosqlRefName }}
                    - name: nosql-binding
                      secret:
                        secretName: {{ $name }}-nosql
                        optional: true
                    {{- end }}
                    {{- if $cacheEnabled }}
                    - name: cache-binding
                      secret:
                        secretName: {{ $name }}-cache
                        optional: true
                    {{- end }}
            {{- /* --- AWS IAM resources: one Role + Profile + binding Secret per objectStorageRef. --- */}}
            {{- /* Role and Profile lifecycle is tied to this Api (deleted with it).                   */}}
            {{- /* Bucket name is computed from convention: platform-{ns}-{refName}.                    */}}
            {{- /* $hasAwsCloudBindings covers all AWS cloud resource types:                            */}}
            {{- /*   objectStorageRefs (any entries), nosqlRef (always DynamoDB),                       */}}
            {{- /*   cache backend=cloud (ElastiCache). Add sqlRef cloud variant when XRD supports.     */}}
            {{- $hasAwsCloudBindings := or (gt (len $objectStorageRefs) 0) (ne $nosqlRefName "") (and $cacheEnabled (eq $cacheBackend "public-cloud")) (and (ne $sqlRefName "") (eq $sqlBackend "public-cloud")) }}
            {{- if $hasAwsCloudBindings }}
            {{- range $i, $ref := $objectStorageRefs }}
            {{- $refName := $ref.name }}
            {{- $roleKey := printf "role-object-storage-%s" $refName }}
            {{- $bucketName := printf "platform-%s-%s" $ns $refName }}
            {{- /* IAM role names are capped at 64 chars. Hash the name when it would exceed that. */}}
            {{- $rawRoleExternalName := printf "crossplane-%s-%s-%s" $ns $name $refName }}
            {{- $roleExternalName := $rawRoleExternalName }}
            {{- if gt (len $rawRoleExternalName) 64 }}
            {{- $roleExternalName = printf "xp-%s" ($rawRoleExternalName | sha256sum | trunc 61) }}
            {{- end }}
            {{- $predictedRoleArn := printf "arn:aws:iam::%s:role/crossplane/%s" $awsAccountId $roleExternalName }}
            {{- $inlinePolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Action" (list "s3:GetObject" "s3:PutObject" "s3:DeleteObject" "s3:ListBucket") "Resource" (list (printf "arn:aws:s3:::%s" $bucketName) (printf "arn:aws:s3:::%s/*" $bucketName)))) | toJson }}
            ---
            # IAM Role for objectStorageRef {{ $refName }}. Trust scoped to this Api's service account.
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: {{ $name }}-objstorage-{{ $refName }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $roleKey }}
                gotemplating.fn.crossplane.io/ready: "True"
                crossplane.io/external-name: {{ $roleExternalName }}
            spec:
              forProvider:
                path: /crossplane/
                maxSessionDuration: 3600
                tags:
                  App: {{ $name }}
                  Namespace: {{ $ns }}
                  ObjectStorageRef: {{ $refName }}
                assumeRolePolicy: {{ $trustPolicy | quote }}
                inlinePolicy:
                  - name: platform-object-storage-{{ $ns }}-{{ $refName }}
                    policy: {{ $inlinePolicy | quote }}

            ---
            # Binding Secret for {{ $refName }}.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-{{ $refName }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: binding-secret-object-storage-{{ $refName }}
                gotemplating.fn.crossplane.io/ready: "True"
            type: servicebinding.io/s3
            stringData:
              type: s3
              provider: aws
              bucket: {{ $bucketName }}
              region: us-east-1
              role-arn: {{ $predictedRoleArn }}

            {{- end }}
            {{- if $nosqlRefName }}
            {{- $nosqlRoleKey := "role-nosql" }}
            {{- $tableName := $nosqlRefName }}
            {{- $nosqlPredictedRoleArn := printf "arn:aws:iam::%s:role/crossplane/crossplane-%s-%s-nosql" $awsAccountId $ns $name }}
            {{- $nosqlInlinePolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Action" (list "dynamodb:GetItem" "dynamodb:PutItem" "dynamodb:UpdateItem" "dynamodb:DeleteItem" "dynamodb:Query" "dynamodb:Scan" "dynamodb:BatchGetItem" "dynamodb:BatchWriteItem") "Resource" (list (printf "arn:aws:dynamodb:us-east-1:*:table/%s" $tableName) (printf "arn:aws:dynamodb:us-east-1:*:table/%s/index/*" $tableName)))) | toJson }}
            ---
            # IAM Role for nosqlRef {{ $nosqlRefName }}. Trust scoped to this Api's service account.
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: {{ $name }}-nosql
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $nosqlRoleKey }}
                gotemplating.fn.crossplane.io/ready: "True"
                crossplane.io/external-name: crossplane-{{ $ns }}-{{ $name }}-nosql
            spec:
              forProvider:
                path: /crossplane/
                maxSessionDuration: 3600
                tags:
                  App: {{ $name }}
                  Namespace: {{ $ns }}
                  NoSqlRef: {{ $nosqlRefName }}
                assumeRolePolicy: {{ $trustPolicy | quote }}
                inlinePolicy:
                  - name: platform-nosql-{{ $ns }}-{{ $nosqlRefName }}
                    policy: {{ $nosqlInlinePolicy | quote }}
            ---
            # Binding Secret for nosqlRef {{ $nosqlRefName }}.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-nosql
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: binding-secret-nosql
                gotemplating.fn.crossplane.io/ready: "True"
            type: servicebinding.io/dynamodb
            stringData:
              type: dynamodb
              provider: aws
              table-name: {{ $tableName }}
              region: us-east-1
              role-arn: {{ $nosqlPredictedRoleArn }}
            {{- end }}{{- /* end nosqlRefName */}}
            {{- end }}{{- /* end hasAwsCloudBindings */}}
            {{- if $entraNeeded }}
            ---
            # Entra app registration for this Api. owners is required - an app created
            # through the API (CLI or Crossplane, doesn't matter) is never auto-owned;
            # only the Azure web UI does that. Without it, crossplane-entra can
            # create this but never delete or update it. See azuread-permissions.md.
            apiVersion: applications.azuread.m.upbound.io/v1beta1
            kind: Application
            metadata:
              name: {{ $ns }}-{{ $name }}-entra
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-application
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                displayName: platform-{{ $ns }}-{{ $name }}
                api:
                  # Without this Entra mints v1 tokens, issued by sts.windows.net rather
                  # than login.microsoftonline.com/<tenant>/v2.0. An API validating the
                  # v2 issuer rejects every one of them, and the token looks fine.
                  requestedAccessTokenVersion: 2
                  {{- if $delegatedScopes }}
                  # auth: user interfaces. A delegated scope is a field on the application
                  # rather than its own object, which is why these are inline and app roles
                  # are not. type Admin keeps consent with an administrator - User would let
                  # any signed-in person consent on their own behalf.
                  oauth2PermissionScope:
                  {{- range $scope := $delegatedScopes }}
                  {{- $scopeHash := printf "%s/%s/%s/scope" $ns $name $scope.name | sha256sum }}
                    - id: {{ printf "%s-%s-4%s-a%s-%s" (substr 0 8 $scopeHash) (substr 8 12 $scopeHash) (substr 13 16 $scopeHash) (substr 17 20 $scopeHash) (substr 20 32 $scopeHash) }}
                      value: {{ $scope.name | quote }}
                      type: Admin
                      enabled: true
                      adminConsentDisplayName: {{ $scope.name | quote }}
                      adminConsentDescription: {{ printf "%s on %s, on behalf of a signed-in user" $scope.name $name | quote }}
                  {{- end }}
                  {{- end }}
                # A stable name for this Api as an audience. Entra generates the client
                # ID, so a caller could only learn it by reading this Api's resources -
                # this is derivable instead, the same trick the Sql composition uses to
                # predict role ARNs rather than look them up. The tenant ID is not
                # decoration: a bare api://name is refused by the default tenant policy,
                # which requires a verified domain, the tenant ID or the app ID.
                identifierUris:
                  - api://{{ $entraTenantId }}/platform-{{ $ns }}-{{ $name }}
                owners:
                  - {{ $crossplaneEntraSpId }}
            ---
            # Service principal - required before a federated credential can attach,
            # and before the app can be assigned any app role on another Api later.
            apiVersion: serviceprincipals.azuread.m.upbound.io/v1beta1
            kind: Principal
            metadata:
              name: {{ $ns }}-{{ $name }}-entra
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-principal
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                clientIdRef:
                  name: {{ $ns }}-{{ $name }}-entra
                owners:
                  - {{ $crossplaneEntraSpId }}
            ---
            # Trusts a JWT-SVID for this exact pod identity, traded for a real Entra
            # token via client_assertion - no client secret anywhere.
            apiVersion: applications.azuread.m.upbound.io/v1beta1
            kind: FederatedIdentityCredential
            metadata:
              name: {{ $ns }}-{{ $name }}-entra
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-federated-credential
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                applicationIdRef:
                  name: {{ $ns }}-{{ $name }}-entra
                displayName: workload-identity
                issuer: https://{{ $oidcIssuerHost }}
                subject: spiffe://homelab.local/ns/{{ $ns }}/sa/{{ $name }}
                audiences:
                  - api://AzureADTokenExchange
            {{- range $role := $appRoles }}
            {{- /* Entra role names are PascalCase with dots by convention (Data.Read);   */ -}}
            {{- /* neither survives a Kubernetes object name, so sanitize for the name    */ -}}
            {{- /* only. forProvider.value keeps the role exactly as the app declared it. */ -}}
            {{- $roleSlug := $role.name | lower | replace "." "-" | replace "_" "-" }}
            {{- /* Entra identifies a role by GUID, not by name, and wants the same GUID  */ -}}
            {{- /* every reconcile. Deriving it from what already names this role means   */ -}}
            {{- /* no one has to invent a UUID, paste it into a workspace file, or know   */ -}}
            {{- /* that it must never change. uuidv4 would be a new value every render.   */ -}}
            {{- $roleHash := printf "%s/%s/%s" $ns $name $role.name | sha256sum }}
            {{- $roleId := printf "%s-%s-4%s-a%s-%s" (substr 0 8 $roleHash) (substr 8 12 $roleHash) (substr 13 16 $roleHash) (substr 17 20 $roleHash) (substr 20 32 $roleHash) }}
            ---
            # A role this Api offers. allowedMemberTypes must be Application - the Azure web UI
            # defaults to User, which syncs green and then never shows up in the token of
            # a caller that has no user behind it.
            apiVersion: applications.azuread.m.upbound.io/v1beta1
            kind: AppRole
            metadata:
              name: {{ $ns }}-{{ $name }}-entra-role-{{ $roleSlug }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-role-{{ $roleSlug }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                applicationIdRef:
                  name: {{ $ns }}-{{ $name }}-entra
                roleId: {{ $roleId }}
                value: {{ $role.name | quote }}
                displayName: {{ $role.name | quote }}
                description: {{ printf "%s on %s" $role.name $name | quote }}
                allowedMemberTypes:
                  - Application
            {{- range $caller := ($role.allowedCallers | default list) }}
            ---
            # The grant itself. Expect this one to sit red for its first ~30s with
            # "Permission being assigned was not found on application" - the role above
            # has to replicate from the app registration to its service principal, and
            # the grant is checked against the service principal. It self-heals.
            apiVersion: app.azuread.m.upbound.io/v1beta1
            kind: RoleAssignment
            metadata:
              name: {{ $ns }}-{{ $name }}-entra-grant-{{ $roleSlug }}-{{ $caller.namespace }}-{{ $caller.app }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-grant-{{ $roleSlug }}-{{ $caller.namespace }}-{{ $caller.app }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                appRoleId: {{ $roleId }}
                # The caller's own Principal, created by that Api's own composition run.
                # Resolves by name across XRs - if the caller has not reconciled yet, this
                # stays unresolved and retries rather than rendering something wrong.
                principalObjectIdRef:
                  name: {{ $caller.namespace }}-{{ $caller.app }}-entra
                resourceObjectIdRef:
                  name: {{ $ns }}-{{ $name }}-entra
            {{- end }}
            {{- end }}
            {{- range $scope := $delegatedScopes }}
            {{- $scopeSlug := $scope.name | lower | replace "." "-" | replace "_" "-" }}
            {{- range $caller := ($scope.allowedCallers | default list) }}
            ---
            # The delegated equivalent of a RoleAssignment. Consent is recorded against the
            # caller's service principal, so a token minted through on-behalf-of carries
            # this scope in scp rather than the roles claim an app-only call would get.
            apiVersion: serviceprincipaldelegated.azuread.m.upbound.io/v1beta1
            kind: PermissionGrant
            metadata:
              name: {{ $ns }}-{{ $name }}-entra-scope-{{ $scopeSlug }}-{{ $caller.namespace }}-{{ $caller.app }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: entra-scope-grant-{{ $scopeSlug }}-{{ $caller.namespace }}-{{ $caller.app }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              forProvider:
                claimValues:
                  - {{ $scope.name | quote }}
                # The API being called, so the scope is one this app actually exposes.
                resourceServicePrincipalObjectIdRef:
                  name: {{ $ns }}-{{ $name }}-entra
                # The caller, created by its own composition run.
                servicePrincipalObjectIdRef:
                  name: {{ $caller.namespace }}-{{ $caller.app }}-entra
            {{- end }}
            {{- end }}
            {{- end }}{{- /* end entraNeeded */}}
            {{- if $cacheEnabled }}
            ---
            apiVersion: platform.local.lab/v1alpha1
            kind: Cache
            metadata:
              name: {{ $name }}-cache
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              parameters:
                backend: {{ $cacheBackend }}
                consumerServiceAccount: {{ $name }}
            {{- end }}
            ---
            # release: monitoring matches the Prometheus operator's serviceMonitorSelector
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                release: monitoring
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: servicemonitor
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/instance: {{ $name }}
              endpoints:
                - port: metrics
                  path: /metrics
                  interval: {{ $scrapeInterval }}
                  metricRelabelings:
                    - sourceLabels: [__name__]
                      regex: "go_.*|process_.*|promhttp_.*"
                      action: drop
            {{- if $host }}
            {{- /* Public means reachable from the internet through the tunnel - either a  */ -}}
            {{- /* letsencrypt-prod cert or a pre-issued demo slot secret. Internal hosts  */ -}}
            {{- /* stay off the rate limiter on purpose, see the Middleware comment below. */ -}}
            {{- $isPublic := or (eq $tlsIssuer "letsencrypt-prod") (ne $tlsSecret "") }}
            ---
            # --- Security response headers Middleware ---
            # An Api serves its own responses with no nginx in front, so these have to come
            # from Traefik. default-src 'none' because a JSON API should never be a document
            # context - it makes a reflected-content bug unexploitable in a browser.
            apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: {{ $name }}-security-headers
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: security-headers-middleware
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              headers:
                customResponseHeaders:
                  Server: ""
                  X-Powered-By: ""
                  X-Content-Type-Options: "nosniff"
                  X-Frame-Options: "DENY"
                  Referrer-Policy: "strict-origin-when-cross-origin"
                  # "0" disables the legacy XSS auditor - removed from modern browsers,
                  # and enabling it created XS-Leak side channels in older ones. Matches Spa.
                  X-XSS-Protection: "0"
                  Strict-Transport-Security: "max-age=31536000; includeSubDomains"
                  Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'"
            {{- if $isPublic }}
            ---
            # --- Rate limit Middleware ---
            # Public hosts only. Keyed on CF-Connecting-IP because public traffic all
            # arrives from the two cloudflared pod IPs, so the default remote-address key
            # would put every visitor in one shared bucket.
            #
            # That keying is exactly why internal hosts are excluded rather than given a
            # different limit. A .local.lab request carries no CF-Connecting-IP, so every
            # caller would fall into one shared bucket - and sump-pump-bridge.local.lab is
            # IoT ingest, where a throttled POST is a lost reading, not a retried page load.
            apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: {{ $name }}-ratelimit
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ratelimit-middleware
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              rateLimit:
                average: 60
                burst: 20
                period: 1m
                sourceCriterion:
                  requestHeaderName: CF-Connecting-IP
            {{- end }}
            ---
            # tlsIssuer: local-lab-ca-issuer for .local.lab; letsencrypt-prod for public hosts
            # tlsSecret: skip issuance and reference a pre-existing secret (e.g. demo slot certs)
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                # Headers first - a 429 from the rate limiter short-circuits the rest of
                # the chain, and the response still needs the security headers on it.
                traefik.ingress.kubernetes.io/router.middlewares: "{{ $ns }}-{{ $name }}-security-headers@kubernetescrd{{ if $isPublic }},{{ $ns }}-{{ $name }}-ratelimit@kubernetescrd{{ end }}"
                {{- if not $tlsSecret }}
                cert-manager.io/cluster-issuer: {{ $tlsIssuer }}
                {{- end }}
                gotemplating.fn.crossplane.io/composition-resource-name: ingress
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              ingressClassName: traefik
              tls:
                - hosts:
                    - {{ $host }}
                  secretName: {{ if $tlsSecret }}{{ $tlsSecret }}{{ else }}{{ $name }}-tls{{ end }}
              rules:
                - host: {{ $host }}
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ $name }}
                            port:
                              number: 80
            {{- end }}
            {{- /* ---------- Connections ---------- */ -}}
            {{- /* Deny by default, allow by declaration. AuthorizationPolicy is the     */ -}}
            {{- /* control on the way in, Sidecar the control on the way out. Both are   */ -}}
            {{- /* rendered onto this workload, from this workload's own declarations.   */ -}}
            {{- /* Deny-by-default is not a toggle. A toggle defaulting to off stays off. */ -}}
            {{- $appPort := $xr.spec.parameters.port | default 8080 }}
            ---
            # Callers must prove a real mesh identity. Two exceptions, both for unmeshed
            # infrastructure that has no identity to present, Prometheus scraping metrics,
            # and Traefik forwarding public ingress (only when this Api has a host).
            apiVersion: security.istio.io/v1
            kind: PeerAuthentication
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-peerauth
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels: { app.kubernetes.io/instance: {{ $name }} }
              mtls:
                mode: STRICT
              portLevelMtls:
                "{{ $metricsPort }}":
                  mode: PERMISSIVE
                {{- if $host }}
                "{{ $appPort }}":
                  mode: PERMISSIVE
                {{- end }}
            ---
            # The first ALLOW policy selecting this workload makes it default-deny, so
            # every rule this workload needs lives in THIS object. Two ALLOW policies
            # would OR together and widen access, and anything that must all hold goes
            # in one rule rather than two.
            apiVersion: security.istio.io/v1
            kind: AuthorizationPolicy
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-authz
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels: { app.kubernetes.io/instance: {{ $name }} }
              action: ALLOW
              rules:
                # Prometheus is unmeshed - it presents no identity to match on.
                - to:
                    - operation: { ports: ["{{ $metricsPort }}"] }
                {{- if $host }}
                # This Api has an Ingress, and Traefik is unmeshed, so this port cannot
                # be restricted by identity. How far that reaches depends on tlsIssuer -
                # letsencrypt-prod means the internet, local-lab-ca-issuer means the
                # homelab network. Drop the host, or mesh Traefik, to close it.
                - to:
                    - operation: { ports: ["{{ $appPort }}"] }
                {{- end }}
                {{- range $iface := $provides }}
                {{- /* An interface nobody holds renders no rule. An empty principals list  */ -}}
                {{- /* is not "deny everyone" to Istio, it is a source clause with nothing  */ -}}
                {{- /* to match on, and the surrounding ALLOW rule then lets anyone in.     */ -}}
                {{- if $iface.allowedCallers }}
                # provides: {{ $iface.name }}
                - from:
                    - source:
                        principals:
                          {{- range $iface.allowedCallers }}
                          - "cluster.local/ns/{{ .namespace }}/sa/{{ .app }}"
                          {{- end }}
                  {{- $m := $iface.methods | default list }}
                  {{- $p := $iface.paths | default list }}
                  {{- if or (gt (len $m) 0) (gt (len $p) 0) }}
                  to:
                    - operation:
                        {{- if gt (len $m) 0 }}
                        methods: [{{ range $i, $v := $m }}{{ if $i }}, {{ end }}{{ $v | quote }}{{ end }}]
                        {{- end }}
                        {{- if gt (len $p) 0 }}
                        paths: [{{ range $i, $v := $p }}{{ if $i }}, {{ end }}{{ $v | quote }}{{ end }}]
                        {{- end }}
                  {{- end }}
                {{- end }}
                {{- end }}
            ---
            # REGISTRY_ONLY: only the control plane, what this XR composed, and what it
            # declared. No wildcard, so every other app in the namespace is refused too.
            apiVersion: networking.istio.io/v1
            kind: Sidecar
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-sidecar
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              workloadSelector:
                labels: { app.kubernetes.io/instance: {{ $name }} }
              outboundTrafficPolicy:
                mode: REGISTRY_ONLY
              egress:
                - hosts:
                    - "istio-system/*"
                    {{- if and $cacheEnabled (eq $cacheBackend "private-cloud") }}
                    # Composed by this XR, so the app never declares it.
                    - "./{{ $name }}-cache-redis.{{ $ns }}.svc.cluster.local"
                    {{- end }}
                    {{- if and $sqlRefName (eq $sqlBackend "private-cloud") }}
                    - "./{{ $sqlRefName }}-postgres.{{ $ns }}.svc.cluster.local"
                    {{- end }}
                    {{- if or $topicRefName $subscriptionRefName }}
                    # The XR already hands this app NATS_URL, so permitting it here is
                    # the other half of that. Unmeshed, so there is no inbound gate.
                    - "nats/nats.nats.svc.cluster.local"
                    {{- end }}
                    {{- range $h := $derivedHosts }}
                    # Implied by a binding on this XR, so the app never declares it.
                    - "./{{ $h }}"
                    {{- end }}
                    {{- range $c := $consumes }}
                    {{- if $c.host }}
                    - "./{{ $c.host }}"
                    {{- end }}
                    {{- if $c.address }}
                    - "./{{ $c.address | replace "." "-" }}.address.declared"
                    {{- end }}
                    {{- if $c.entraApp }}
                    - "./{{ $c.entraApp.host }}"
                    {{- end }}
                    {{- if and $c.app $c.namespace }}
                    - "{{ $c.namespace }}/{{ $c.app }}.{{ $c.namespace }}.svc.cluster.local"
                    {{- end }}
                    {{- end }}
            {{- range $h := $derivedHosts }}
            ---
            # {{ $h }} - a binding on this XR implies this endpoint, so the platform
            # registers it rather than making the app restate it in consumes.
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: {{ $name }}-{{ $h | replace "." "-" }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-se-{{ $h | replace "." "-" }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              hosts:
                - {{ $h | quote }}
              location: MESH_EXTERNAL
              resolution: DNS
              exportTo: ["."]
              ports:
                - number: 443
                  name: tls
                  protocol: TLS
            {{- end }}
            {{- range $c := $consumes }}
            {{- if $c.host }}
            ---
            # consumes {{ $c.host }} - this registers the host. The egress entry above
            # is what permits it. protocol TLS passes the app's own encrypted stream
            # straight through; HTTP would make Envoy try to terminate it.
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: {{ $name }}-{{ $c.host | replace "." "-" }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-se-{{ $c.host | replace "." "-" }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              hosts:
                - {{ $c.host | quote }}
              location: MESH_EXTERNAL
              resolution: DNS
              exportTo: ["."]
              ports:
                - number: {{ $c.port | default 443 }}
                  name: {{ $c.protocol | default "TLS" | lower }}
                  protocol: {{ $c.protocol | default "TLS" }}
            {{- end }}
            {{- if $c.address }}
            ---
            # consumes {{ $c.address }} - a destination with no DNS name, such as a device
            # on the LAN. Static resolution names the endpoint directly, because a DNS
            # ServiceEntry has nothing to look up.
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: {{ $name }}-{{ $c.address | replace "." "-" }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-se-{{ $c.address | replace "." "-" }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              hosts:
                - {{ printf "%s.address.declared" ($c.address | replace "." "-") | quote }}
              addresses:
                - {{ printf "%s/32" $c.address | quote }}
              location: MESH_EXTERNAL
              resolution: STATIC
              exportTo: ["."]
              endpoints:
                - address: {{ $c.address | quote }}
              ports:
                - number: {{ $c.port | default 443 }}
                  name: {{ $c.protocol | default "TLS" | lower }}
                  protocol: {{ $c.protocol | default "TLS" }}
            {{- end }}
            {{- if $c.entraApp }}
            ---
            # consumes {{ $c.entraApp.host }} - an API registered in Entra outside the
            # platform. Its owner grants the role; the platform only opens the path.
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: {{ $name }}-{{ $c.entraApp.host | replace "." "-" }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-se-{{ $c.entraApp.host | replace "." "-" }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              hosts:
                - {{ $c.entraApp.host | quote }}
              location: MESH_EXTERNAL
              resolution: DNS
              exportTo: ["."]
              ports:
                - number: 443
                  name: tls
                  protocol: TLS
            {{- end }}
            {{- end }}
            {{- /* Derived values written back so kubectl get api <name> -o yaml answers   */ -}}
            {{- /* what an app expects, without opening a composition or the Azure web UI.  */ -}}
            {{- $scopeRows := list }}
            {{- range $c := $consumes }}
            {{- if and $c.app $c.namespace }}
            {{- $scopeRows = append $scopeRows (dict "target" (printf "%s/%s" $c.namespace $c.app) "scope" (printf "api://%s/platform-%s-%s/.default" $entraTenantId $c.namespace $c.app) "envVar" (printf "ENTRA_SCOPE_%s" ($c.app | upper | replace "-" "_"))) }}
            {{- end }}
            {{- if $c.entraApp }}
            {{- $scopeRows = append $scopeRows (dict "target" $c.entraApp.host "scope" (printf "%s/.default" $c.entraApp.appIdUri) "envVar" (printf "ENTRA_SCOPE_%s" ($c.entraApp.role | upper | replace "." "_" | replace "-" "_"))) }}
            {{- end }}
            {{- end }}
            {{- if or $entraNeeded $scopeRows }}
            ---
            apiVersion: platform.local.lab/v1alpha1
            kind: Api
            status:
              {{- if $entraNeeded }}
              entra:
                {{- if $entraClientId }}
                clientId: {{ $entraClientId | quote }}
                {{- end }}
                audience: {{ printf "api://%s/platform-%s-%s" $entraTenantId $ns $name | quote }}
                issuer: {{ printf "https://login.microsoftonline.com/%s/v2.0" $entraTenantId | quote }}
              {{- end }}
              {{- if $scopeRows }}
              consumes:
              {{- range $r := $scopeRows }}
                - target: {{ $r.target | quote }}
                  scope: {{ $r.scope | quote }}
                  envVar: {{ $r.envVar | quote }}
              {{- end }}
              {{- end }}
            {{- end }}
