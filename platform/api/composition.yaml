apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xapi
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: XApi
  mode: Pipeline
  pipeline:
    - step: render-all-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.spec.parameters.namespace }}
            {{- $env := ($xr.spec.parameters.cache | default dict).environment | default "cluster" }}
            {{- /* Refs point to standalone resources created outside this XApi. */ -}}
            {{- /* The binding Secret already exists in $ns — just mount it.    */ -}}
            {{- $objectStorageRefName := "" }}
            {{- if $xr.spec.parameters.objectStorageRef }}{{- $objectStorageRefName = $xr.spec.parameters.objectStorageRef.name }}{{- end }}
            {{- $sqlRefName := "" }}
            {{- if $xr.spec.parameters.sqlRef }}{{- $sqlRefName = $xr.spec.parameters.sqlRef.name }}{{- end }}
            {{- $nosqlRefName := "" }}
            {{- if $xr.spec.parameters.nosqlRef }}{{- $nosqlRefName = $xr.spec.parameters.nosqlRef.name }}{{- end }}
            {{- $cacheEnabled := and $xr.spec.parameters.cache $xr.spec.parameters.cache.enabled }}
            {{- $cacheReady := "False" }}
            {{- $cacheObserved := index (.observed.resources | default dict) "cache" }}
            {{- if $cacheObserved }}
              {{- range ($cacheObserved.resource.status.conditions | default list) }}
                {{- if and (eq .type "Ready") (eq .status "True") }}
                  {{- $cacheReady = "True" }}
                {{- end }}
              {{- end }}
            {{- end }}
            {{- $host := $xr.spec.parameters.host | default "" }}
            {{- $tlsIssuer := $xr.spec.parameters.tlsIssuer | default "local-lab-ca-issuer" }}
            {{- $metricsPort := $xr.spec.parameters.metricsPort | default 9090 }}
            {{- $scrapeInterval := $xr.spec.parameters.scrapeInterval | default "60s" }}
            {{- $replicas := $xr.spec.parameters.replicas | default 1 }}
            {{- $healthCheckPath := $xr.spec.parameters.healthCheckPath | default "/healthz" }}
            {{- $secretRefName := "" }}
            {{- if $xr.spec.parameters.secretRef }}{{- $secretRefName = $xr.spec.parameters.secretRef.name }}{{- end }}
            {{- $topicRefName := "" }}
            {{- $topicStreamName := "" }}
            {{- if $xr.spec.parameters.topicRef }}
            {{- $topicRefName = $xr.spec.parameters.topicRef.name }}
            {{- $topicStreamName = ($xr.spec.parameters.topicRef.streamName | default ($xr.spec.parameters.topicRef.name | upper)) }}
            {{- end }}
            {{- $subscriptionRefName := "" }}
            {{- if $xr.spec.parameters.subscriptionRef }}{{- $subscriptionRefName = $xr.spec.parameters.subscriptionRef.name }}{{- end }}
            # --- Service ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app: xapi
                app.kubernetes.io/instance: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/instance: {{ $name }}
              ports:
                - name: http
                  port: 80
                  targetPort: {{ $xr.spec.parameters.port | default 8080 }}
                - name: metrics
                  port: {{ $metricsPort }}
                  targetPort: {{ $metricsPort }}
            ---
            # --- Deployment ---
            # Init containers poll for each binding's "type" file — last key written,
            # confirming all binding keys are available before the app starts.
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app: xapi
                app.kubernetes.io/instance: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              replicas: {{ $replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/instance: {{ $name }}
              template:
                metadata:
                  labels:
                    app: xapi
                    app.kubernetes.io/instance: {{ $name }}
                spec:
                  nodeSelector:
                    node-role.kubernetes.io/worker: worker
                  {{- if or $objectStorageRefName $sqlRefName $nosqlRefName $cacheEnabled }}
                  initContainers:
                    {{- if $objectStorageRefName }}
                    - name: wait-for-object-storage-binding
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/object-storage/type ]; do echo waiting for object-storage binding; sleep 5; done"
                      volumeMounts:
                        - name: object-storage-binding
                          mountPath: /bindings/object-storage
                          readOnly: true
                    {{- end }}
                    {{- if $sqlRefName }}
                    - name: wait-for-sql-binding
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/sql/type ]; do echo waiting for sql binding; sleep 5; done"
                      volumeMounts:
                        - name: sql-binding
                          mountPath: /bindings/sql
                          readOnly: true
                    {{- end }}
                    {{- if $nosqlRefName }}
                    - name: wait-for-nosql-binding
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/nosql/type ]; do echo waiting for nosql binding; sleep 5; done"
                      volumeMounts:
                        - name: nosql-binding
                          mountPath: /bindings/nosql
                          readOnly: true
                    {{- end }}
                    {{- if $cacheEnabled }}
                    - name: wait-for-cache-binding
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - "until [ -f /bindings/cache/type ]; do echo waiting for cache binding; sleep 5; done"
                      volumeMounts:
                        - name: cache-binding
                          mountPath: /bindings/cache
                          readOnly: true
                    {{- end }}
                  {{- end }}
                  containers:
                    - name: api
                      image: {{ $xr.spec.parameters.image }}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: {{ $xr.spec.parameters.port | default 8080 }}
                      resources:
                        requests:
                          cpu: {{ $xr.spec.parameters.cpuRequest | default "50m" }}
                          memory: {{ $xr.spec.parameters.memoryRequest | default "32Mi" }}
                        limits:
                          cpu: {{ $xr.spec.parameters.cpuLimit | default "200m" }}
                          memory: {{ $xr.spec.parameters.memoryLimit | default "64Mi" }}
                      readinessProbe:
                        httpGet:
                          path: {{ $healthCheckPath }}
                          port: {{ $xr.spec.parameters.port | default 8080 }}
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      env:
                        # servicebinding.io convention: $SERVICE_BINDING_ROOT/<binding>/<key>
                        - name: SERVICE_BINDING_ROOT
                          value: /bindings
                      {{- if $topicRefName }}
                        # XTopic wiring: injected automatically from topicRef.
                        # App reads NATS_URL + NATS_STREAM to publish events.
                        - name: NATS_URL
                          value: "nats://nats.nats.svc.cluster.local:4222"
                        - name: NATS_STREAM
                          value: {{ $topicStreamName | quote }}
                      {{- end }}
                      {{- if $subscriptionRefName }}
                        # XSubscription wiring: injected automatically from subscriptionRef.
                        # App reads NATS_CONSUMER to bind to the durable cursor.
                        {{- if not $topicRefName }}
                        - name: NATS_URL
                          value: "nats://nats.nats.svc.cluster.local:4222"
                        {{- end }}
                        - name: NATS_CONSUMER
                          value: {{ $subscriptionRefName | quote }}
                      {{- end }}
                      {{- if $secretRefName }}
                      envFrom:
                        - secretRef:
                            name: {{ $secretRefName }}
                      {{- end }}
                      {{- if or $objectStorageRefName $sqlRefName $nosqlRefName $cacheEnabled }}
                      volumeMounts:
                        {{- if $objectStorageRefName }}
                        - name: object-storage-binding
                          mountPath: /bindings/object-storage
                          readOnly: true
                        {{- end }}
                        {{- if $sqlRefName }}
                        - name: sql-binding
                          mountPath: /bindings/sql
                          readOnly: true
                        {{- end }}
                        {{- if $nosqlRefName }}
                        - name: nosql-binding
                          mountPath: /bindings/nosql
                          readOnly: true
                        {{- end }}
                        {{- if $cacheEnabled }}
                        - name: cache-binding
                          mountPath: /bindings/cache
                          readOnly: true
                        {{- end }}
                      {{- end }}
                  {{- if or $objectStorageRefName $sqlRefName $nosqlRefName $cacheEnabled }}
                  volumes:
                    {{- if $objectStorageRefName }}
                    - name: object-storage-binding
                      secret:
                        secretName: {{ $objectStorageRefName }}
                        optional: true
                    {{- end }}
                    {{- if $sqlRefName }}
                    - name: sql-binding
                      secret:
                        secretName: {{ $sqlRefName }}
                        optional: true
                    {{- end }}
                    {{- if $nosqlRefName }}
                    - name: nosql-binding
                      secret:
                        secretName: {{ $nosqlRefName }}
                        optional: true
                    {{- end }}
                    {{- if $cacheEnabled }}
                    - name: cache-binding
                      secret:
                        secretName: {{ $name }}-cache
                        optional: true
                    {{- end }}
                  {{- end }}
            {{- if $cacheEnabled }}
            ---
            apiVersion: platform.local.lab/v1alpha1
            kind: XCache
            metadata:
              name: {{ $name }}-cache
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache
                gotemplating.fn.crossplane.io/ready: {{ $cacheReady | quote }}
            spec:
              parameters:
                environment: {{ $env }}
                namespace: {{ $ns }}
            {{- end }}
            ---
            # release: monitoring matches the Prometheus operator's serviceMonitorSelector
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                release: monitoring
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: servicemonitor
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/instance: {{ $name }}
              endpoints:
                - port: metrics
                  path: /metrics
                  interval: {{ $scrapeInterval }}
            {{- if $host }}
            ---
            # tlsIssuer: local-lab-ca-issuer for .local.lab; letsencrypt-prod for public hosts
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                cert-manager.io/cluster-issuer: {{ $tlsIssuer }}
                gotemplating.fn.crossplane.io/composition-resource-name: ingress
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              ingressClassName: traefik
              tls:
                - hosts:
                    - {{ $host }}
                  secretName: {{ $name }}-tls
              rules:
                - host: {{ $host }}
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ $name }}
                            port:
                              number: 80
            {{- end }}
