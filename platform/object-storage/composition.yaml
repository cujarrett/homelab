apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: object-storage
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: ObjectStorage
  mode: Pipeline
  pipeline:
    - step: render-aws-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $dataRetention := $xr.spec.parameters.dataRetention | default "retain" }}
            {{- $managementPolicies := list "Observe" "Create" "Update" "LateInitialize" }}
            {{- $forceDestroy := false }}
            {{- /* AWS refuses DeleteBucket on a non-empty bucket, which stalls sandbox */ -}}
            {{- /* teardown forever, so only the delete case sweeps objects first.      */ -}}
            {{- if eq $dataRetention "delete" }}
            {{- $managementPolicies = list "*" }}
            {{- $forceDestroy = true }}
            {{- end }}
            {{- /* The platform- prefix lets IAM resource conditions scope to           */ -}}
            {{- /* arn:aws:s3:::platform-* - IAM cannot read bucket tags at auth time.  */ -}}
            {{- $bucketName := printf "platform-%s-%s" $ns $name }}
            {{- $ready := "False" }}
            {{- with index (.observed.resources | default dict) "bucket" }}
            {{- range (.resource.status.conditions | default list) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}{{- $ready = "True" }}{{- end }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: s3.aws.m.upbound.io/v1beta1
            kind: Bucket
            metadata:
              name: {{ $name }}
              annotations:
                crossplane.io/external-name: {{ $bucketName }}
                gotemplating.fn.crossplane.io/composition-resource-name: bucket
                gotemplating.fn.crossplane.io/ready: {{ $ready | quote }}
            spec:
              managementPolicies: {{ $managementPolicies | toJson }}
              forProvider:
                region: us-east-1
                forceDestroy: {{ $forceDestroy }}
                tags:
                  App: {{ $name }}
                  Namespace: {{ $ns }}
