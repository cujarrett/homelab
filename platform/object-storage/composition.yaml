apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: object-storage
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: ObjectStorage
  mode: Pipeline
  pipeline:
    - step: render-aws-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: "us-east-1"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dataRetention
                toFieldPath: spec.deletionPolicy
                transforms:
                  - type: map
                    map:
                      delete: Delete
                      retain: Orphan
              # forceDestroy only for dataRetention=delete - AWS refuses DeleteBucket
              # on a non-empty bucket otherwise, which stalls sandbox teardown forever.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dataRetention
                toFieldPath: spec.forProvider.forceDestroy
                transforms:
                  - type: map
                    map:
                      delete: true
                      retain: false
              # Bucket name: platform-{namespace}-{name}. The platform- prefix is a
              # naming convention that lets IAM resource conditions scope to
              # arn:aws:s3:::platform-* without relying on bucket tags (IAM cannot
              # read S3 tags at auth time). This role's inline policy is scoped to
              # the exact bucket ARN, not the wildcard.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "platform-%s-%s"
                toFieldPath: metadata.annotations["crossplane.io/external-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.tags.App
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.tags.Namespace
            connectionDetails:
              - type: FromFieldPath
                name: bucket
                fromFieldPath: status.atProvider.id

