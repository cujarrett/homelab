apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xobjectstorages.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XObjectStorage
    plural: xobjectstorages
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                      default: us-east-1
                      description: "Cloud region for the bucket."
                    environment:
                      type: string
                      default: cluster
                      enum: [cluster, cloud]
                      description: "Runtime environment. cloud provisions AWS S3; cluster is reserved for future in-cluster MinIO routing. Currently passed through from XApi but does not alter provisioning."
