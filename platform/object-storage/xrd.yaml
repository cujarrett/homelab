apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xobjectstorages.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XObjectStorage
    plural: xobjectstorages
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  required: [namespace]
                  properties:
                    region:
                      type: string
                      default: us-east-1
                      description: "Cloud region for the bucket."
                    namespace:
                      type: string
                      description: "Namespace to write the binding Secret into."
