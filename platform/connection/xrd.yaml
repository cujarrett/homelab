apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: connections.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: Connection
    plural: connections
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [from]
                  properties:
                    from:
                      type: object
                      description: The workload initiating the connections, identified by its service account.
                      required: [namespace, serviceAccount]
                      properties:
                        namespace:
                          type: string
                          description: Namespace of the calling workload.
                        serviceAccount:
                          type: string
                          description: Service account of the calling workload. This is the identity the connections are granted to.
                    toServices:
                      type: array
                      description: On-platform destinations this caller may reach. One grant per entry.
                      items:
                        type: object
                        required: [namespace, appLabel, port]
                        properties:
                          namespace:
                            type: string
                            description: Namespace of the destination workload.
                          appLabel:
                            type: string
                            description: Name of the destination instance (its metadata.name) — selects only that instance's pods, safe even when a namespace runs several instances of the same platform type.
                          port:
                            type: integer
                            description: Destination container port.
                          httpPolicy:
                            type: object
                            description: Optional L7 restriction for this destination.
                            properties:
                              allowMethods:
                                type: array
                                description: HTTP methods to allow (e.g. GET, POST). Omit to allow any.
                                items:
                                  type: string
                              allowPaths:
                                type: array
                                description: HTTP path prefixes to allow (e.g. /api/v1/*). Omit to allow any.
                                items:
                                  type: string
                    toExternals:
                      type: array
                      description: Off-platform destinations this caller may reach. One egress registration per entry. This is the only way traffic leaves the platform from a locked-down namespace.
                      items:
                        type: object
                        required: [fqdn, port]
                        properties:
                          fqdn:
                            type: string
                            description: Fully-qualified external hostname (e.g. api.example.com).
                          port:
                            type: integer
                            description: Destination port (typically 443).
