apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spa-composition
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: XSpa
  mode: Pipeline
  pipeline:
    - step: render-all-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $params := .observed.composite.resource.spec.parameters }}
            {{- $namespace := $params.namespace }}
            {{- $apiProxyEnabled := and $params.apiProxy $params.apiProxy.enabled }}
            {{- $sizeResourceMap := dict "xs" (dict "cpuReq" "25m" "cpuLim" "100m" "memReq" "32Mi" "memLim" "64Mi") "sm" (dict "cpuReq" "50m" "cpuLim" "200m" "memReq" "64Mi" "memLim" "128Mi") "md" (dict "cpuReq" "100m" "cpuLim" "500m" "memReq" "128Mi" "memLim" "256Mi") "lg" (dict "cpuReq" "250m" "cpuLim" "1000m" "memReq" "256Mi" "memLim" "512Mi") }}
            {{- $sizeKey := $params.size | default "sm" }}
            {{- $sizeRes := get $sizeResourceMap $sizeKey | default (get $sizeResourceMap "sm") }}
            # --- nginx ConfigMap ---
            # Generated from XR params so the SPA image stays generic across instances.
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $name }}-nginx-config
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nginx-config
                gotemplating.fn.crossplane.io/ready: "True"
            data:
              default.conf: |
                server {
                    listen 80;
                    server_tokens off;

                    root /usr/share/nginx/html;
                    index index.html;

                    location /healthz {
                        access_log off;
                        return 200 'ok';
                        add_header Content-Type text/plain always;
                    }

                    # no-cache: browser always refetches the entry point
                    # All security headers repeated — nginx drops server-level add_header
                    # directives for any location that defines its own add_header.
                    location = /index.html {
                        add_header Cache-Control                "no-cache"                                  always;
                        add_header Content-Security-Policy      "{{ $params.contentSecurityPolicy }}"       always;
                        add_header X-Content-Type-Options       "nosniff"                                   always;
                        add_header X-Frame-Options              "SAMEORIGIN"                                always;
                        add_header X-XSS-Protection             "0"                                         always;
                        add_header Referrer-Policy              "strict-origin-when-cross-origin"           always;
                        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()"  always;
                    }

                    # immutable: hashed filenames change on each build
                    location ~* \.(js|css|woff2|woff)$ {
                        add_header Cache-Control                "public, max-age=31536000, immutable"       always;
                        add_header Content-Security-Policy      "{{ $params.contentSecurityPolicy }}"       always;
                        add_header X-Content-Type-Options       "nosniff"                                   always;
                        add_header X-Frame-Options              "SAMEORIGIN"                                always;
                        add_header X-XSS-Protection             "0"                                         always;
                        add_header Referrer-Policy              "strict-origin-when-cross-origin"           always;
                        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()"  always;
                    }

                    # no-cache: images are not content-hashed so must always revalidate
                    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                        add_header Cache-Control                "no-cache"                                  always;
                        add_header Content-Security-Policy      "{{ $params.contentSecurityPolicy }}"       always;
                        add_header X-Content-Type-Options       "nosniff"                                   always;
                        add_header X-Frame-Options              "SAMEORIGIN"                                always;
                        add_header X-XSS-Protection             "0"                                         always;
                        add_header Referrer-Policy              "strict-origin-when-cross-origin"           always;
                        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()"  always;
                    }

                    # Block credential/config probes before the catch-all.
                    # Without these, try_files returns 200 for every .env scan.
                    location ~* /\.git(/|$) {
                        return 404;
                    }

                    location ~* /\.ssh(/|$) {
                        return 404;
                    }

                    location ~* /\.vscode(/|$) {
                        return 404;
                    }

                    location ~* (^|/)\.env[^/]* {
                        return 404;
                    }

                    location ~* (\.htaccess|\.htpasswd|\.gitconfig|\.DS_Store|wp-config\.php|phpinfo\.php|settings\.py|settings\.json|settings\.yaml|config\.json|config\.php|config\.yaml|config\.rb|web\.config|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.yml|readme\.md|README\.md|wlwmanifest\.xml|xmlrpc\.php)$ {
                        return 404;
                    }

                    location ~* (^|/)(\.aws|credentials|api-keys\.txt|logs/error\.log|var/log/)(/|$) {
                        return 404;
                    }

                    location ~* \.(log)$ {
                        return 404;
                    }

                    location ~* \.(php|php5|php7|php8|phtml|asp|aspx|jsp|cgi|sh|py|rb|pl)$ {
                        return 404;
                    }

                    # Endpoint/framework probes (Spring Boot, Symfony, Magento, etc.)
                    location ~* (^/actuator(/|$)|^/swagger(/|$)|^/openapi(/|$)|^/v2/_catalog(/|$)|^/v3/api-docs(/|$)|^/console(/|$)|^/telescope(/|$)|^/server-status$|^/_profiler(/|$)|^/_environment(/|$)|^/rest/(V[0-9]+|default)(/|$)) {
                        return 404;
                    }

                    # Config/secret file probes not covered above
                    location ~* (application\.(yml|yaml|properties)|appsettings(\.[^.]+)?\.json|terraform\.tfstate(\.backup)?|serverless\.yml|connectionstrings\.config|\.composer/) {
                        return 404;
                    }

                    # PHP info/debug probes without extension (complements the *.php block)
                    location ~* ^/(phpinfo|php-info|pinfo|server-info|server-status)(/|$) {
                        return 404;
                    }

                    # Bare /env probe — complements the \.env[^/]* block (no leading dot)
                    location ~* ^/env(/|$) {
                        return 404;
                    }

                    # WordPress REST API probes
                    location ~* ^/wp-json(/|$) {
                        return 404;
                    }

                    # cPanel SSO / OpenID probes
                    location ~* ^/openid_connect(/|$) {
                        return 404;
                    }

                    {{- if $apiProxyEnabled }}
                    # API proxy: routes /api/ to in-cluster service (no public exposure needed)
                    location /api/ {
                        proxy_pass http://{{ $params.apiProxy.upstream }}/;
                        proxy_set_header Host $host;
                        # Use Traefik's forwarded header — $remote_addr is Traefik's pod IP, not the client.
                        proxy_set_header X-Real-IP $http_x_real_ip;
                        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                    {{- end }}

                    # SPA catch-all: client-side router handles unmatched paths
                    location / {
                        try_files $uri $uri/ /index.html;
                    }
                }
            ---
            # --- Deployment ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              labels:
                app: spa
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              replicas: {{ $params.replicas | default 1 }}
              selector:
                matchLabels:
                  app: spa
                  instance: {{ $name }}
              template:
                metadata:
                  labels:
                    app: spa
                    instance: {{ $name }}
                spec:
                  nodeSelector:
                    node-role.kubernetes.io/worker: worker
                  {{- if $params.imagePullSecret }}
                  imagePullSecrets:
                    - name: {{ $params.imagePullSecret }}
                  {{- end }}
                  containers:
                    - name: spa
                      image: {{ $params.image }}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                      resources:
                        requests:
                          cpu: {{ get $sizeRes "cpuReq" }}
                          memory: {{ get $sizeRes "memReq" }}
                        limits:
                          cpu: {{ get $sizeRes "cpuLim" }}
                          memory: {{ get $sizeRes "memLim" }}
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: 80
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      volumeMounts:
                        - name: nginx-config
                          mountPath: /etc/nginx/conf.d/default.conf
                          subPath: default.conf
                          readOnly: true
                  volumes:
                    - name: nginx-config
                      configMap:
                        name: {{ $name }}-nginx-config
            ---
            # --- Service ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              labels:
                app: spa
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app: spa
                instance: {{ $name }}
              ports:
                - port: 80
                  targetPort: 80
            ---
            # --- Ingress ---
            # tlsIssuer: local-lab-ca-issuer for .local.lab; letsencrypt-prod for public hosts
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress
                gotemplating.fn.crossplane.io/ready: "True"
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                cert-manager.io/cluster-issuer: {{ $params.tlsIssuer | default "local-lab-ca-issuer" }}
            spec:
              ingressClassName: traefik
              tls:
                - hosts:
                    - {{ $params.host }}
                  secretName: {{ $name }}-tls
              rules:
                - host: {{ $params.host }}
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ $name }}
                            port:
                              number: 80
