apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xspas.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XSpa
    plural: xspas
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    image:
                      type: string
                      description: >
                        Container image for the SPA (e.g. ghcr.io/owner/app:sha-abc123).
                        Expected to be an nginx-based image with the built Angular app already
                        copied into /usr/share/nginx/html. CI on the source repo builds and
                        pushes this on merge to main, then commits the new tag back here.
                    host:
                      type: string
                      description: "Ingress hostname (e.g. myapp.local.lab or myapp.example.com)."
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                      description: "Number of nginx replicas. Stateless — safe to scale freely."
                    tlsIssuer:
                      type: string
                      default: "local-lab-ca-issuer"
                      description: "Certificate issuer. Internal for services only on the homelab network. External for services exposed to the public internet."
                      x-enumLabels: ["Internal (homelab only)", "External (public internet)"]
                      enum:
                        - local-lab-ca-issuer
                        - letsencrypt-prod
                    imagePullSecret:
                      type: string
                      x-advanced: true
                      description: "Override the registry pull secret for this deployment. Leave empty — the namespace service account is pre-configured with pull access by the platform."
                    contentSecurityPolicy:
                      type: string
                      default: "default-src 'self'; frame-ancestors 'none'; base-uri 'self';"
                      x-advanced: true
                      description: >
                        Value for the Content-Security-Policy response header.
                        Override with app-specific origins (e.g. Google Fonts, external APIs).
                        Default is a strict policy suitable for SPAs with no external dependencies.
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      x-enumLabels: ["Extra Small", "Small", "Medium", "Large"]
                      description: "Compute tier for the container. Choose based on expected traffic — Extra Small suits low-traffic or background services; Large suits high-throughput workloads."
                    namespace:
                      type: string
                      description: "Namespace to deploy into. Must already exist (created by the tenant's namespace.yaml)."
                    apiProxy:
                      type: object
                      description: "Use when this SPA has a companion XApi. Nginx routes /api/* requests to it in-cluster — the API never needs its own public hostname or Cloudflare Tunnel entry. Only the SPA is internet-facing; the API stays cluster-internal."
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        upstream:
                          type: string
                          description: "FQDN of the upstream service (e.g. my-vinyl-api.my-vinyl-api.svc.cluster.local). nginx proxies /api/ → http://<upstream>/."
                  required:
                    - image
                    - host
                    - namespace
              required:
                - parameters
          required:
            - spec
