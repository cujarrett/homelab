apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: spas.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: Spa
    plural: spas
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    image:
                      type: string
                      description: >-
                        Container image (e.g. ghcr.io/owner/app:sha-abc123). Managed by CI —
                        set on first create, then updated automatically on each merge to main.
                    repo:
                      type: string
                      description: "GitHub repository URL for this app's source code (e.g. https://github.com/owner/app)."
                    host:
                      type: string
                      description: "Ingress hostname (e.g. myapp.local.lab or myapp.example.com)."
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                      description: "Number of nginx replicas. Stateless — safe to scale freely."
                    tlsIssuer:
                      type: string
                      default: "local-lab-ca-issuer"
                      description: "Certificate issuer. Internal for services only on the homelab network. External for services exposed to the public internet."
                      enum:
                        - local-lab-ca-issuer
                        - letsencrypt-prod
                    tlsSecret:
                      type: string
                      description: "Name of a pre-existing TLS Secret in the app namespace. When set, the Ingress references it directly and cert-manager issuance is skipped."
                    contentSecurityPolicy:
                      type: string
                      default: "default-src 'self'; frame-ancestors 'none'; base-uri 'self';"
                      pattern: "^[^\"\\r\\n]+$"
                      description: >
                        Value for the Content-Security-Policy response header.
                        Override with app-specific origins (e.g. Google Fonts, external APIs).
                        Default is a strict policy suitable for SPAs with no external dependencies.
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      description: "Compute tier for the container. Choose based on expected traffic — Extra Small suits low-traffic or background services; Large suits high-throughput workloads."
                    namespace:
                      type: string
                      description: "Namespace to deploy into. Must already exist (created by the tenant's namespace.yaml)."
                    apiProxies:
                      type: array
                      description: "Use when this SPA has companion Apis. Each entry routes one path prefix to one in-cluster service; the prefix is stripped before proxying. The Apis need no hostname or Cloudflare Tunnel entry of their own — only the SPA is exposed, and how far depends on its tlsIssuer."
                      items:
                        type: object
                        required: [path, upstream]
                        properties:
                          path:
                            type: string
                            description: "URL path prefix to route (e.g. /foo/). Must start and end with /."
                            pattern: "^/.*/$"
                          upstream:
                            type: string
                            description: "FQDN of the upstream service (e.g. foo.foo-ns.svc.cluster.local). nginx proxies <path>* → http://<upstream>/*."
                    connectionPosture:
                      type: string
                      default: "off"
                      enum: [off, enforce]
                      description: "Connection policy for this workload. off renders nothing. enforce blocks calls out unless the destination is same-namespace, already named in apiProxies, or declared in consumes."
                    consumes:
                      type: array
                      description: "Destinations this SPA calls that no other field already states. Same-namespace destinations and anything already named in apiProxies are allowed automatically — do not list them. Set either host (off-platform) or app+namespace (another namespace on the platform)."
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                            description: "Off-platform hostname (e.g. api.discogs.com). Anything not listed is blocked at this workload's own sidecar."
                          port:
                            type: integer
                            default: 443
                            description: "Port for host. Defaults to 443."
                          protocol:
                            type: string
                            default: TLS
                            enum: [TLS, HTTP]
                            description: "Wire protocol for host. TLS for any https:// destination — the app terminates its own TLS. HTTP only for plaintext destinations."
                          app:
                            type: string
                            description: "metadata.name of an Api in another namespace this calls. Use with namespace."
                          namespace:
                            type: string
                            description: "Namespace of app. Required when app is set."
                  required:
                    - image
                    - host
                    - namespace
              required:
                - parameters
          required:
            - spec
