apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xspas.platform.local.lab
spec:
  group: platform.local.lab
  scope: Cluster
  names:
    kind: XSpa
    plural: xspas
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    image:
                      type: string
                      description: >
                        Container image for the SPA (e.g. ghcr.io/owner/app:sha-abc123).
                        Expected to be an nginx-based image with the built Angular app already
                        copied into /usr/share/nginx/html. CI on the source repo builds and
                        pushes this on merge to main, then commits the new tag back here.
                    host:
                      type: string
                      description: "Ingress hostname (e.g. myapp.local.lab or myapp.example.com)."
                    replicas:
                      type: integer
                      default: 1
                      description: "Number of nginx replicas. Stateless — safe to scale freely."
                    tlsIssuer:
                      type: string
                      default: "local-lab-ca-issuer"
                      description: >
                        cert-manager ClusterIssuer name.
                        Use local-lab-ca-issuer for .local.lab internal hosts.
                        Use letsencrypt-prod for public hosts via Cloudflare Tunnel.
                      enum:
                        - local-lab-ca-issuer
                        - letsencrypt-staging
                        - letsencrypt-prod
                    imagePullSecret:
                      type: string
                      description: >
                        Name of the Kubernetes Secret containing registry credentials
                        (e.g. ghcr-pull-secret for private GHCR images). Omit for public images.
                    contentSecurityPolicy:
                      type: string
                      default: "default-src 'self'; frame-ancestors 'none'; base-uri 'self';"
                      x-advanced: true
                      description: >
                        Value for the Content-Security-Policy response header.
                        Override with app-specific origins (e.g. Google Fonts, external APIs).
                        Default is a strict policy suitable for SPAs with no external dependencies.
                    size:
                      type: string
                      default: sm
                      enum: [xs, sm, md, lg]
                      x-enumLabels: ["Extra Small", "Small", "Medium", "Large"]
                      description: "Container resource size. xs=25m/100m cpu, 32Mi/64Mi mem. sm=50m/200m cpu, 64Mi/128Mi mem. md=100m/500m cpu, 128Mi/256Mi mem. lg=250m/1000m cpu, 256Mi/512Mi mem."
                    namespace:
                      type: string
                      description: "Namespace to deploy into. Must already exist (created by the tenant's namespace.yaml)."
                    apiProxy:
                      type: object
                      description: "Optional API proxy. When enabled, nginx proxies /api/ to an in-cluster service, keeping the API off the public internet."
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        upstream:
                          type: string
                          description: "FQDN of the upstream service (e.g. my-vinyl-api.my-vinyl-api.svc.cluster.local). nginx proxies /api/ → http://<upstream>/."
                  required:
                    - image
                    - host
                    - namespace
              required:
                - parameters
          required:
            - spec
