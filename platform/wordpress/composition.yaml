apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xwordpress-composition
spec:
  compositeTypeRef:
    apiVersion: platform.local.lab/v1alpha1
    kind: XWordpress
  mode: Pipeline
  pipeline:
    - step: render-all-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $namespace := .observed.composite.resource.metadata.namespace }}
            {{- $uid := .observed.composite.resource.metadata.uid }}
            {{- $params := .observed.composite.resource.spec.parameters }}
            {{- $observedResources := .observed.resources | default dict }}
            {{- $size := $params.size | default "sm" }}
            {{- $wpCPUReq := "100m" }}{{- $wpCPULim := "500m" }}
            {{- $wpMemReq := "256Mi" }}{{- $wpMemLim := "512Mi" }}
            {{- $dbCPUReq := "100m" }}{{- $dbCPULim := "500m" }}
            {{- $dbMemReq := "256Mi" }}{{- $dbMemLim := "512Mi" }}
            {{- if eq $size "md" }}
            {{-   $wpCPUReq = "250m" }}{{- $wpCPULim = "1500m" }}
            {{-   $wpMemReq = "512Mi" }}{{- $wpMemLim = "1024Mi" }}
            {{- else if eq $size "lg" }}
            {{-   $wpCPUReq = "500m" }}{{- $wpCPULim = "2000m" }}
            {{-   $wpMemReq = "1Gi" }}{{- $wpMemLim = "2Gi" }}
            {{-   $dbCPUReq = "200m" }}{{- $dbCPULim = "1000m" }}
            {{-   $dbMemReq = "512Mi" }}{{- $dbMemLim = "1Gi" }}
            {{- end }}
            # --- MariaDB credentials Secret ---
            # Passwords derived from the XR's immutable UID (sha256, hex-truncated).
            # No human input, nothing sensitive in Git.
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-mariadb
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: mariadb-secret
                gotemplating.fn.crossplane.io/ready: "True"
            type: Opaque
            stringData:
              database: wordpress
              username: wordpress
              password: "{{ printf "%s-db" $uid | sha256sum | trunc 32 }}"
              rootPassword: "{{ printf "%s-root" $uid | sha256sum | trunc 32 }}"
            ---
            # --- MariaDB data PVC ---
            # storageClassName is frozen on first creation: once bound, a PVC's storageClassName
            # is immutable. We read back the observed value so reconciles are always no-ops.
            {{- $mariadbSC := "longhorn-retain" }}
            {{- if (index $observedResources "mariadb-pvc") }}
            {{-   $mariadbSC = (index $observedResources "mariadb-pvc").resource.spec.storageClassName }}
            {{- else if eq $params.dataRetention "delete" }}
            {{-   $mariadbSC = "longhorn-delete" }}
            {{- end }}
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: {{ $name }}-mariadb-data
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: mariadb-pvc
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: {{ $mariadbSC }}
              resources:
                requests:
                  storage: {{ $params.dbStorageSize | default "5Gi" }}
            ---
            # --- WordPress wp-content PVC ---
            {{- $wpSC := "longhorn-retain" }}
            {{- if (index $observedResources "wordpress-pvc") }}
            {{-   $wpSC = (index $observedResources "wordpress-pvc").resource.spec.storageClassName }}
            {{- else if eq $params.dataRetention "delete" }}
            {{-   $wpSC = "longhorn-delete" }}
            {{- end }}
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: {{ $name }}-wp-content
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wordpress-pvc
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: {{ $wpSC }}
              resources:
                requests:
                  storage: {{ $params.storageSize | default "10Gi" }}
            ---
            # --- MariaDB StatefulSet ---
            apiVersion: apps/v1
            kind: StatefulSet
            metadata:
              name: {{ $name }}-mariadb
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: mariadb-statefulset
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels:
                  app: mariadb
                  instance: {{ $name }}
              serviceName: {{ $name }}-mariadb
              replicas: 1
              template:
                metadata:
                  labels:
                    app: mariadb
                    instance: {{ $name }}
                spec:
                  containers:
                    - name: mariadb
                      image: mariadb:11
                      env:
                        - name: MYSQL_ROOT_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: rootPassword
                        - name: MYSQL_DATABASE
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: database
                        - name: MYSQL_USER
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: username
                        - name: MYSQL_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: password
                      ports:
                        - containerPort: 3306
                          name: mysql
                      resources:
                        requests:
                          cpu: {{ $dbCPUReq }}
                          memory: {{ $dbMemReq }}
                        limits:
                          cpu: {{ $dbCPULim }}
                          memory: {{ $dbMemLim }}
                      volumeMounts:
                        - name: data
                          mountPath: /var/lib/mysql
                  volumes:
                    - name: data
                      persistentVolumeClaim:
                        claimName: {{ $name }}-mariadb-data
            ---
            # --- MariaDB Service ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}-mariadb
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: mariadb-service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app: mariadb
                instance: {{ $name }}
              ports:
                - port: 3306
                  targetPort: 3306
                  name: mysql
            ---
            # --- WordPress Deployment ---
            # initContainer seeds wp-content from the image on first run (empty PVC),
            # leaving existing data untouched on subsequent starts (migration-safe).
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}-wordpress
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wordpress-deployment
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels:
                  app: wordpress
                  instance: {{ $name }}
              replicas: {{ $params.replicas | default 1 }}
              strategy:
                type: Recreate
              template:
                metadata:
                  labels:
                    app: wordpress
                    instance: {{ $name }}
                spec:
                  initContainers:
                    - name: init-wp-content
                      image: wordpress:6-apache
                      command:
                        - sh
                        - -c
                        - |
                          if [ -z "$(ls -A /target)" ]; then
                            echo "Seeding wp-content from image..."
                            cp -r /var/www/html/wp-content/. /target/
                          fi
                      volumeMounts:
                        - name: wp-content
                          mountPath: /target
                  containers:
                    - name: wordpress
                      image: wordpress:6-apache
                      env:
                        - name: WORDPRESS_DB_HOST
                          value: {{ $name }}-mariadb:3306
                        - name: WORDPRESS_DB_NAME
                          value: wordpress
                        - name: WORDPRESS_DB_USER
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: username
                        - name: WORDPRESS_DB_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: {{ $name }}-mariadb
                              key: password
                      ports:
                        - containerPort: 80
                      resources:
                        requests:
                          cpu: {{ $wpCPUReq }}
                          memory: {{ $wpMemReq }}
                        limits:
                          cpu: {{ $wpCPULim }}
                          memory: {{ $wpMemLim }}
                      volumeMounts:
                        - name: wp-content
                          mountPath: /var/www/html/wp-content
                        - name: security-mu-plugin
                          mountPath: /var/www/html/wp-content/mu-plugins/security-hardening.php
                          subPath: security-hardening.php
                  volumes:
                    - name: wp-content
                      persistentVolumeClaim:
                        claimName: {{ $name }}-wp-content
                    - name: security-mu-plugin
                      configMap:
                        name: {{ $name }}-security-mu-plugin
            ---
            # --- WordPress Service ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}-wordpress
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wordpress-service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app: wordpress
                instance: {{ $name }}
              ports:
                - port: 80
                  targetPort: 80
            ---
            # --- WordPress Ingress ---
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: {{ $name }}-wordpress
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wordpress-ingress
                gotemplating.fn.crossplane.io/ready: "True"
                cert-manager.io/cluster-issuer: letsencrypt-prod
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.middlewares: "{{ $namespace }}-{{ $name }}-wp-security-headers@kubernetescrd"
            spec:
              ingressClassName: traefik
              tls:
                - hosts:
                    - {{ $params.host }}
                  secretName: wordpress-tls
              rules:
                - host: {{ $params.host }}
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: {{ $name }}-wordpress
                            port:
                              number: 80
            ---
            # --- Security mu-plugin ConfigMap ---
            # Mounts a must-use plugin that:
            #   1. Disables XML-RPC (blocks brute-force via xmlrpc.php)
            #   2. Removes /wp/v2/users + /wp/v2/users/me from the REST API (prevents username enumeration)
            #   3. Disables Application Passwords (blocks REST API basic-auth credential stuffing)
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $name }}-security-mu-plugin
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: security-mu-plugin-configmap
                gotemplating.fn.crossplane.io/ready: "True"
            data:
              security-hardening.php: |
                <?php
                // Disable XML-RPC
                add_filter('xmlrpc_enabled', '__return_false');
                // Disable Application Passwords so REST API basic-auth is rejected outright.
                // Bots cannot credential-stuff via /wp-json/ without this feature enabled.
                add_filter('wp_is_application_passwords_available', '__return_false');
                // Remove users from REST API to prevent username enumeration.
                // Includes /me which was previously omitted and used in active credential stuffing.
                add_filter('rest_endpoints', function($endpoints) {
                    unset($endpoints['/wp/v2/users']);
                    unset($endpoints['/wp/v2/users/(?P<id>[\d]+)']);
                    unset($endpoints['/wp/v2/users/me']);
                    return $endpoints;
                });
                // Remove users provider from XML sitemaps (/wp-sitemap-users-1.xml)
                add_filter('wp_sitemaps_add_provider', function($provider, $name) {
                    return ($name === 'users') ? false : $provider;
                }, 10, 2);
                // Block canonical redirect for /?author= queries.
                // Without this, /?author=2 emits a 301 to /author/<slug>/ which leaks
                // the username before template_redirect fires.
                add_filter('redirect_canonical', function($redirect_url, $requested_url) {
                    if (isset($_GET['author'])) {
                        return false;
                    }
                    return $redirect_url;
                }, 10, 2);
                // Disable author archive pages (/author/<slug>/) to prevent username enumeration
                add_action('template_redirect', function() {
                    if (is_author() || isset($_GET['author'])) {
                        global $wp_query;
                        $wp_query->set_404();
                        status_header(404);
                        nocache_headers();
                    }
                });
            ---
            # --- wp-login.php / xmlrpc.php / REST users rate limit Middleware ---
            apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: {{ $name }}-wp-security-ratelimit
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wp-security-ratelimit-middleware
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              rateLimit:
                average: 30
                burst: 15
                period: 1h
                sourceCriterion:
                  requestHeaderName: CF-Connecting-IP
            ---
            # --- IngressRoute applying rate limit to sensitive WordPress endpoints ---
            apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            metadata:
              name: {{ $name }}-wp-security
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wp-security-ingressroute
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              entryPoints:
                - websecure
              routes:
                - match: "Host(`{{ $params.host }}`) && (Path(`/wp-login.php`) || Path(`/xmlrpc.php`) || PathPrefix(`/wp-json/wp/v2/users`))"
                  kind: Rule
                  priority: 100
                  middlewares:
                    - name: {{ $name }}-wp-security-ratelimit
                  services:
                    - name: {{ $name }}-wordpress
                      port: 80
              tls:
                secretName: wordpress-tls
            ---
            # --- Security response headers Middleware ---
            # Applied to all WordPress traffic via the Ingress annotation.
            # Strips Server and X-Powered-By disclosure headers; adds standard
            # browser security headers missing from Apache's default config.
            apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: {{ $name }}-wp-security-headers
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: wp-security-headers-middleware
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              headers:
                customResponseHeaders:
                  Server: ""
                  X-Powered-By: ""
                  X-Content-Type-Options: "nosniff"
                  X-Frame-Options: "SAMEORIGIN"
                  Referrer-Policy: "strict-origin-when-cross-origin"
                  # "0" disables the legacy XSS auditor — removed from modern browsers,
                  # and enabling it created XS-Leak side channels in older ones. Matches XSpa.
                  X-XSS-Protection: "0"
                  Strict-Transport-Security: "max-age=31536000; includeSubDomains"
                  Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
            ---
            # --- xmlrpc.php block Middleware ---
            # Rejects all external requests to xmlrpc.php at Traefik before they reach PHP.
            # The mu-plugin also disables XML-RPC at the WordPress level; this adds a
            # Traefik-layer block so bots get 403 without consuming a PHP worker.
            apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: {{ $name }}-xmlrpc-block
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: xmlrpc-block-middleware
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              ipAllowList:
                sourceRange:
                  - "127.0.0.1/32"
            ---
            # --- IngressRoute: block xmlrpc.php at priority 200 (beats the rate-limit route at 100) ---
            apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            metadata:
              name: {{ $name }}-xmlrpc-block
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: xmlrpc-block-ingressroute
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              entryPoints:
                - websecure
              routes:
                - match: "Host(`{{ $params.host }}`) && Path(`/xmlrpc.php`)"
                  kind: Rule
                  priority: 200
                  middlewares:
                    - name: {{ $name }}-xmlrpc-block
                  services:
                    - name: {{ $name }}-wordpress
                      port: 80
              tls:
                secretName: wordpress-tls
