# Placeholder stand-in for the real aws-platform-config EnvironmentConfig, which is
# applied to the cluster by hand and never committed. Values are deliberately zeroed —
# render-check only needs the keys to exist so compositions resolve them.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: aws-platform-config
data:
  abacPolicyArn: arn:aws:iam::000000000000:policy/CrossplaneObjectStorageABAC
  awsAccountId: "000000000000"
  dynamoDbPolicyArn: arn:aws:iam::000000000000:policy/CrossplaneDynamoDBABAC
  trustAnchorArn: arn:aws:rolesanywhere:us-east-1:000000000000:trust-anchor/00000000-0000-0000-0000-000000000000
