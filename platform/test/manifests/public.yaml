# Public-cloud e2e scenario: real AWS RDS, ElastiCache, DynamoDB, and S3.
# Applied directly by platform/test/e2e.sh - never via ArgoCD.
# Costs a few cents per run (RDS + ElastiCache bill hourly).
apiVersion: platform.local.lab/v1alpha1
kind: Sql
metadata:
  name: e2e-sql-public
  namespace: platform-e2e
spec:
  parameters:
    backend: public-cloud
    size: xs
    consumerServiceAccounts:
      - e2e-api-public
---
apiVersion: platform.local.lab/v1alpha1
kind: NoSql
metadata:
  name: e2e-nosql
  namespace: platform-e2e
spec:
  parameters: {}
---
apiVersion: platform.local.lab/v1alpha1
kind: ObjectStorage
metadata:
  name: e2e-assets
  namespace: platform-e2e
spec:
  parameters: {}
---
apiVersion: platform.local.lab/v1alpha1
kind: ManagedSecret
metadata:
  name: e2e-secret
  namespace: platform-e2e
spec:
  parameters:
    keys: [E2E_TOKEN]
    # delete, not the retain default - a scheduled secret keeps its name for the whole
    # recovery window, and the next run cannot recreate it.
    dataRetention: delete
---
apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: e2e-api-public
  namespace: platform-e2e
spec:
  parameters:
    image: ghcr.io/cujarrett/hello-world-api:latest
    port: 8080
    metricsPort: 8080
    sqlRef:
      name: e2e-sql-public
      backend: public-cloud
    cache:
      enabled: true
      backend: public-cloud
    nosqlRef:
      name: e2e-nosql
    objectStorageRefs:
      - name: e2e-assets
    managedSecretRefs:
      - name: e2e-secret
