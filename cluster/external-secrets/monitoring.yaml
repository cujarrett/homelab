apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: webhook-url
      remoteRef: {key: /homelab/monitoring/discord-webhook-url}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: admin-user
      remoteRef: {key: /homelab/monitoring/grafana-admin-user}
    - secretKey: admin-password
      remoteRef: {key: /homelab/monitoring/grafana-admin-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: users
      remoteRef: {key: /homelab/monitoring/prometheus-basic-auth-htpasswd}
