apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: users
      remoteRef: {key: /homelab/longhorn-system/basic-auth-htpasswd}
