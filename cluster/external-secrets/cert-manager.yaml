apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    # Zone DNS Edit on mattjarrett.dev, mattjarrett.com and kentjarrett.com.
    - secretKey: api-token
      remoteRef: {key: /homelab/cert-manager/cloudflare-api-token}
