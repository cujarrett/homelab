# The Kargo chart reads both keys by these exact names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
  namespace: kargo
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef: {key: /homelab/kargo/admin-password-hash}
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef: {key: /homelab/kargo/token-signing-key}
---
# Kargo pushes promotions to homelab-workspaces as the deployer GitHub App.
# The cred-type label is how Kargo finds this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-workspaces-git
  namespace: kargo-storefront
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  target:
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/cujarrett/homelab-workspaces.git
        githubAppClientID: Iv23liC9AQ1xrWzEe4nX
        githubAppPrivateKey: "{{ .privateKey }}"
        githubAppInstallationID: "{{ .installationID }}"
  data:
    - secretKey: privateKey
      remoteRef: {key: /homelab/kargo/homelab-workspaces-app-key}
    - secretKey: installationID
      remoteRef: {key: /homelab/kargo/homelab-workspaces-app-installation-id}
---
# A GraphOS graph key for storefront-homelab. Kargo's verification runs schema checks with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apollo-graph-key
  namespace: kargo-storefront
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: aws-parameter-store}
  data:
    - secretKey: key
      remoteRef: {key: /homelab/kargo/apollo-graph-key}
