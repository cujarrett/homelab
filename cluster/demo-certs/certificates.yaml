# Long-lived certificates for the 5 fixed demo slots, one per slot covering both the
# Spa and Api hostnames. They outlive sandbox churn, so Let's Encrypt's 5 certs per
# exact hostname set per 168h limit is never hit. secretmirrors.yaml copies them in.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo1-tls
  namespace: demo-certs
spec:
  secretName: demo1-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - demo1.mattjarrett.dev
    - demo1-api.mattjarrett.dev
---
