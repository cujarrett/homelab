# Long-lived TLS certificates for the 5 fixed demo slot hostnames. Permanent -
# they survive sandbox churn so we never re-issue against Let's Encrypt's "5
# certs per exact hostname per 168h" limit. launchpad-api copies the secrets in.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo1-api-tls
  namespace: demo-certs
spec:
  secretName: demo1-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - demo1-api.mattjarrett.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo1-tls
  namespace: demo-certs
spec:
  secretName: demo1-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - demo1.mattjarrett.dev
---
