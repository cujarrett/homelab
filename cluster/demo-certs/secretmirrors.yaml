# One mirror per demo cert. Each selects the namespace currently holding its
# slot, or none while the slot is free. The controller keeps every selected
# namespace holding an identical copy and removes copies from namespaces that
# stop matching, so a torn-down sandbox leaves nothing behind.
apiVersion: platform.local.lab/v1alpha1
kind: SecretMirror
metadata:
  name: demo1-tls
  namespace: demo-certs
spec:
  sourceSecret: demo1-tls
  targetNamespaceSelector:
    matchLabels:
      launchpad.local.lab/slot: demo1
---
apiVersion: platform.local.lab/v1alpha1
kind: SecretMirror
metadata:
  name: demo1-api-tls
  namespace: demo-certs
spec:
  sourceSecret: demo1-api-tls
  targetNamespaceSelector:
    matchLabels:
      launchpad.local.lab/slot: demo1
---
