apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cert-manager
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cert-manager.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{condition=\"True\"} == 1)",
              "legendFormat": "Ready",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Ready",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{condition=\"False\"} == 1) or vector(0)",
              "legendFormat": "Not Ready",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Not Ready",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "count((certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 86400) or vector(0)",
              "legendFormat": "Expiring Soon",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Expiring < 7 days",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "sum(increase(certmanager_http_acme_client_request_count[1h]))",
              "legendFormat": "Requests",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "ACME Requests (1h)",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "color-background"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "color": {
                "fixedColor": "red",
                "mode": "fixed"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Certificate"
              }
            ]
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "certmanager_certificate_ready_status{condition=\"False\"} == 1",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Failing Certificates",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "condition": true,
                  "issuer_group": true,
                  "issuer_kind": true
                },
                "renameByName": {
                  "issuer_name": "Issuer",
                  "name": "Certificate",
                  "namespace": "Namespace"
                },
                "indexByName": {
                  "name": 0,
                  "namespace": 1,
                  "issuer_name": 2
                }
              }
            }
          ],
          "noDataText": "No failing certificates",
          "type": "table"
        },
        {
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Renews In"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dtdurations"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": 0
                        },
                        {
                          "color": "orange",
                          "value": 86400
                        },
                        {
                          "color": "yellow",
                          "value": 259200
                        },
                        {
                          "color": "green",
                          "value": 604800
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "id": 8,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Renews In"
              }
            ]
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "certmanager_certificate_renewal_timestamp_seconds - time()",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Upcoming Certificate Renewals",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "issuer_group": true,
                  "issuer_kind": true,
                  "issuer_name": true
                },
                "renameByName": {
                  "Value": "Renews In",
                  "name": "Certificate",
                  "namespace": "Namespace"
                },
                "indexByName": {
                  "name": 0,
                  "namespace": 1,
                  "Value": 2
                }
              }
            }
          ],
          "noDataText": "No upcoming renewals found",
          "type": "table"
        },
        {
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "True": {
                            "color": "green",
                            "text": "Ready"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "False": {
                            "color": "red",
                            "text": "Not Ready"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "Unknown": {
                            "color": "orange",
                            "text": "Unknown"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Expires In"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dtdurations"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": 0
                        },
                        {
                          "color": "orange",
                          "value": 604800
                        },
                        {
                          "color": "green",
                          "value": 2592000
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Expires In"
              }
            ]
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "certmanager_certificate_ready_status",
              "format": "table",
              "instant": true,
              "legendFormat": "{{name}} {{namespace}} {{condition}}",
              "refId": "A"
            },
            {
              "expr": "certmanager_certificate_expiration_timestamp_seconds - time()",
              "format": "table",
              "instant": true,
              "legendFormat": "{{name}} {{namespace}}",
              "refId": "B"
            }
          ],
          "title": "All Certificates",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "issuer_group": true,
                  "issuer_kind": true,
                  "issuer_name": true
                },
                "renameByName": {
                  "Value #A": "Ready",
                  "Value #B": "Expires In",
                  "condition": "Ready",
                  "name": "Certificate",
                  "namespace": "Namespace"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "id": 6,
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "expr": "sum by (status) (rate(certmanager_http_acme_client_request_count[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "title": "ACME Request Rate",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "refresh": "60s",
      "schemaVersion": 42,
      "tags": [
        "cert-manager"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "Cert Manager",
      "uid": "homelab-cert-manager"
    }
