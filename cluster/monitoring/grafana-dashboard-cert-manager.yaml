apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cert-manager
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cert-manager.json: |-
    {
      "title": "Cert Manager",
      "uid": "homelab-cert-manager",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "refresh": "60s",
      "schemaVersion": 38,
      "version": 1,
      "links": [],
      "tags": ["cert-manager"],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [],
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{condition=\"True\"} == 1)",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Not Ready",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "mappings": [],
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "count(certmanager_certificate_ready_status{condition=\"False\"} == 1) or vector(0)",
              "legendFormat": "Not Ready",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Expiring < 7 days",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "mappings": [],
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "count((certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 86400) or vector(0)",
              "legendFormat": "Expiring Soon",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "ACME Requests (1h)",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              },
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum(increase(certmanager_http_acme_client_request_count[1h]))",
              "legendFormat": "Requests",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Certificate Status",
          "gridPos": { "x": 0, "y": 4, "w": 16, "h": 10 },
          "options": {
            "sortBy": [{ "displayName": "Expires In", "desc": false }]
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "left" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Ready" },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-background"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "True":  { "text": "Ready",     "color": "green" } } },
                      { "type": "value", "options": { "False": { "text": "Not Ready", "color": "red"   } } },
                      { "type": "value", "options": { "Unknown": { "text": "Unknown", "color": "orange" } } }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Expires In" },
                "properties": [
                  { "id": "unit", "value": "dtdurations" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red",    "value": null },
                        { "color": "orange", "value": 604800 },
                        { "color": "green",  "value": 2592000 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "name": "Certificate",
                  "namespace": "Namespace",
                  "condition": "Ready",
                  "Value #A": "Ready",
                  "Value #B": "Expires In"
                },
                "excludeByName": {
                  "Time": true,
                  "issuer_name": true,
                  "issuer_kind": true,
                  "issuer_group": true
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "certmanager_certificate_ready_status",
              "legendFormat": "{{name}} {{namespace}} {{condition}}",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "certmanager_certificate_expiration_timestamp_seconds - time()",
              "legendFormat": "{{name}} {{namespace}}",
              "refId": "B",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "ACME Request Rate",
          "gridPos": { "x": 0, "y": 14, "w": 16, "h": 7 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(certmanager_http_acme_client_request_count[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
