apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pod-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pod-health.json: |-
    {
      "title": "Pod Health Breakdown",
      "uid": "homelab-pod-health",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "refresh": "30s",
      "schemaVersion": 38,
      "version": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Running",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"}) or vector(0)", "instant": true, "legendFormat": "Running", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pending",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or vector(0)", "instant": true, "legendFormat": "Pending", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failed",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)", "instant": true, "legendFormat": "Failed", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Unknown",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }, { "color": "orange", "value": 1 }]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Unknown\"}) or vector(0)", "instant": true, "legendFormat": "Unknown", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Non-Running Pods",
          "description": "Pods not in Running or Succeeded phase.",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "Phase", "desc": false }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Pending": { "color": "yellow", "index": 0 },
                          "Failed":  { "color": "red",    "index": 1 },
                          "Unknown": { "color": "orange", "index": 2 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "kube_pod_status_phase{phase!~\"Running|Succeeded\"} == 1",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": { "include": { "names": ["namespace", "pod", "phase"] } }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": { "namespace": "Namespace", "pod": "Pod", "phase": "Phase" }
              }
            },
            {
              "id": "sortBy",
              "options": { "fields": [{ "displayName": "Phase", "desc": false }] }
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Deployments Available",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Degraded" },
                "properties": [
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } }
                ]
              }
            ]
          },
          "targets": [
            { "expr": "sum(kube_deployment_status_condition{condition=\"Available\",status=\"true\"})", "instant": true, "legendFormat": "Available", "refId": "A" },
            { "expr": "sum(kube_deployment_status_condition{condition=\"Available\",status=\"false\"}) or vector(0)", "instant": true, "legendFormat": "Degraded", "refId": "B" }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Degraded Deployments",
          "description": "Deployments with unavailable replicas.",
          "gridPos": { "x": 0, "y": 36, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "Unavailable", "desc": true }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Unavailable" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Desired" },
                "properties": [{ "id": "custom.width", "value": 100 }]
              },
              {
                "matcher": { "id": "byName", "options": "Ready" },
                "properties": [{ "id": "custom.width", "value": 100 }]
              },
              {
                "matcher": { "id": "byName", "options": "Unavailable" },
                "properties": [{ "id": "custom.width", "value": 120 }]
              }
            ]
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_unavailable > 0",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_spec_replicas",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "B"
            },
            {
              "expr": "kube_deployment_status_replicas_ready",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["namespace", "deployment", "Value #A", "Value #B", "Value #C"] } } },
            { "id": "organize", "options": { "renameByName": { "namespace": "Namespace", "deployment": "Deployment", "Value #A": "Unavailable", "Value #B": "Desired", "Value #C": "Ready" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "Unavailable", "desc": true }] } }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "All Pods",
          "description": "All pods and their current phase.",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "Namespace", "desc": false }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Running":   { "color": "green",  "index": 0 },
                          "Succeeded": { "color": "blue",   "index": 1 },
                          "Pending":   { "color": "yellow", "index": 2 },
                          "Failed":    { "color": "red",    "index": 3 },
                          "Unknown":   { "color": "orange", "index": 4 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "kube_pod_status_phase == 1",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": { "include": { "names": ["namespace", "pod", "phase"] } }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": { "namespace": "Namespace", "pod": "Pod", "phase": "Phase" }
              }
            }
          ]
        }
      ]
    }
