                "title": "ctrl-1",
                "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 6,
                    "h": 5
                },
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "thresholds"
                        },
                        "decimals": 0,
                        "min": 0,
                        "max": 100,
                        "thresholds": {
                            "mode": "absolute",
                            "steps": [
                                {
                                    "color": "green",
                                    "value": 0
                                },
                                {
                                    "color": "yellow",
                                    "value": 60
                                },
                                {
                                    "color": "orange",
                                    "value": 80
                                },
                                {
                                    "color": "red",
                                    "value": 90
                                }
                            ]
                        },
                        "unit": "percent"
                    },
                    "overrides": [
                        {
                            "matcher": {
                                "id": "byName",
                                "options": "Pods"
                            },
                            "properties": [
                                {
                                    "id": "unit",
                                    "value": "short"
                                },
                                {
                                    "id": "color",
                                    "value": {
                                        "fixedColor": "purple",
                                        "mode": "fixed"
                                    }
                                }
                            ]
                        },
                        {
                            "matcher": {
                                "id": "byName",
                                "options": "Temp"
                            },
                            "properties": [
                                {
                                    "id": "unit",
                                    "value": "celsius"
                                },
                                {
                                    "id": "thresholds",
