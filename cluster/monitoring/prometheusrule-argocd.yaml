apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: argocd
      interval: 5m
      rules:
        # A controller restart alone creates a "new" argocd_app_info series per app, so
        # collapsing to (name, health_status, sync_status) first removes that noise.
        # Counts distinct state combos, not transitions - a normal deploy stays under threshold.
        - alert: ArgoCDAppFlapping
          expr: |
            count by (name) (
              count by (name, health_status, sync_status) (
                count_over_time(argocd_app_info[1h])
              )
            ) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "ArgoCD app {{ $labels.name }} has changed health/sync state {{ $value | printf \"%.0f\" }} times in the last hour"
            description: >-
              Usually self-heal fighting an external change, or the underlying
              workload itself flapping.
              Check `argocd app get {{ $labels.name }} --grpc-web` for sync history,
              and `k get pods -n <app namespace>` for restarts.
