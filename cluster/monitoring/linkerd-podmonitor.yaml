apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
  labels:
    release: monitoring
spec:
  # Scrape linkerd-proxy sidecars across all meshed namespaces.
  # The proxy exposes metrics on port 4191 (linkerd-admin) of every injected pod.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      linkerd.io/control-plane-ns: linkerd
  podMetricsEndpoints:
    - port: linkerd-admin
      path: /metrics
      interval: 60s
