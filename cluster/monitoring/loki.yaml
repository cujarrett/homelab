# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        # The chart's default sidecar trails upstream by months.
        sidecar:
          image:
            # renovate: datasource=docker depName=docker.io/kiwigrid/k8s-sidecar
            tag: 2.14.1
        loki:
          # The chart pins a Loki tag older than its own appVersion.
          image:
            # renovate: datasource=docker depName=docker.io/grafana/loki
            tag: 3.7.9
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          auth_enabled: false
          limits_config:
            retention_period: 30d
            # US visitor and sandbox access logs, for the maps.
            retention_stream:
              - selector: '{log_type=~"access|sandbox"}'
                priority: 1
                period: 8760h
            # Lets a map query reach back the full year those streams are kept.
            max_query_length: 8784h
            # The US Visitors map groups by visitor before counting per location.
            # The 500 default is about six hours of visitors.
            max_query_series: 100000
            # The chart's 15m split turns a year-long query into 35,000 subqueries on one Pi.
            # A single binary gains nothing from splitting finer than a day.
            # A day split is also the cache key, so a repeat year view only computes today.
            split_queries_by_interval: 24h
            split_instant_metric_queries_by_interval: 24h
          # In-process caches, so no memcached pod is needed.
          # Data newer than 10m is never cached, so today's numbers stay live.
          query_range:
            cache_results: true
            results_cache:
              cache:
                embedded_cache:
                  enabled: true
                  max_size_mb: 64
                  ttl: 24h
            cache_instant_metric_results: true
            instant_metric_query_split_align: true
            instant_metric_results_cache:
              cache:
                embedded_cache:
                  enabled: true
                  max_size_mb: 64
                  ttl: 24h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
            # The 24h default lands a cleanup a day after you ask for it. Ten
            # minutes is still long enough to cancel a mistake.
            delete_request_cancel_period: 10m
        singleBinary:
          replicas: 1
          # The chart requests nothing, so the scheduler counted Loki as free.
          # 320Mi working set plus up to 128Mi of query caches.
          resources:
            requests:
              memory: 448Mi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          persistence:
            enabled: true
            size: 5Gi
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          lokiCanary:
            enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
