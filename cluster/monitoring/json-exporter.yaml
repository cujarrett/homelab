# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: json-exporter
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-json-exporter
    targetRevision: 0.20.2
    helm:
      releaseName: json-exporter
      values: |
        fullnameOverride: json-exporter
        # The chart's default image trails upstream releases.
        image:
          # renovate: datasource=docker depName=quay.io/prometheuscommunity/json-exporter
          tag: v0.8.0
        configuration:
          # structuredConfig keeps the exporter config as YAML rather than a string.
          # Emptying config drops the chart's example module.
          config: ""
          structuredConfig:
            modules:
              # The Marketplace's own site calls this public API. A body makes the exporter POST.
              # filterType 8 is VS Code, 18 is the publisher, so a new extension needs no config change.
              # flags 256 includes statistics.
              marketplace:
                headers:
                  Content-Type: application/json
                  Accept: application/json;api-version=3.0-preview.1
                body:
                  content: '{"filters":[{"criteria":[{"filterType":8,"value":"Microsoft.VisualStudio.Code"},{"filterType":18,"value":"cujarrett"}],"pageSize":100}],"flags":256}'
                metrics:
                  - name: vscode_extension
                    type: object
                    help: All-time installs of a VS Code Marketplace extension.
                    path: '{.results[0].extensions[*]}'
                    labels:
                      extension: '{.extensionName}'
                    values:
                      installs: '{.statistics[?(@.statisticName=="install")].value}'
              # CISA's list of CVEs known to be exploited (KEV). One series per CVE.
              # The Security dashboard joins it with Trivy's per-CVE series on vuln_id.
              kev:
                metrics:
                  - name: cisa_kev
                    type: object
                    help: A CVE on CISA's Known Exploited Vulnerabilities list.
                    path: '{.vulnerabilities[*]}'
                    labels:
                      vuln_id: '{.cveID}'
                    values:
                      listed: 1
              # Any Shopify store serves a product's variants at <product page>.js.
              # sku is the label to match on. The exporter prints the numeric id as a float.
              # price is in cents.
              shopify:
                metrics:
                  - name: shopify_variant
                    type: object
                    help: A product variant in a Shopify store.
                    path: '{.variants[*]}'
                    labels:
                      sku: '{.sku}'
                      variant: '{.title}'
                    values:
                      available: '{.available}'
                      price_cents: '{.price}'
        serviceMonitor:
          enabled: true
          defaults:
            labels:
              release: monitoring
          targets:
            # Prometheus treats a series as gone 5m after its last sample.
            # A longer interval leaves the kiosk tile blank most of the time.
            - name: vscode-marketplace
              url: https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery
              module: marketplace
              interval: 4m
              scrapeTimeout: 30s
            # CISA's official GitHub mirror. cisa.gov answers this exporter with 403.
            # The list changes about once a day, so rules read it with max_over_time over 2h.
            - name: cisa-kev
              url: https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json
              module: kev
              interval: 1h
              scrapeTimeout: 30s
            # Homelab 2.0 nodes. A sold-out bundle can sell out again within hours, so it is checked every 5m.
            - name: minisforum-ms-a2
              url: https://store.minisforum.com/products/minisforum-ms-a2-workstation.js
              module: shopify
              interval: 5m
              scrapeTimeout: 30s
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            # The KEV file is about 1.5MB and parses in memory.
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
