# Prometheus and Loki take requests with no auth, so only named callers reach this namespace.
#
# monitoring namespace: Prometheus, Grafana, Loki, Alloy and Alertmanager talk to each other.
# Traefik: the grafana.local.lab and prometheus.local.lab routes.
# homelab-stats: reads Prometheus for the homelab section on mattjarrett.dev.
# Node addresses: kubelet probes, and the API server reaching the operator webhook.
#   kube-router matches on address alone, so these are each node's cni0 bridge,
#   the first address of its pod CIDR. Re-check them if a node is rebuilt.
#   10.42.0.0 is ctrl-1's flannel address, which the API server uses for pods on other nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-callers
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mattjarrett-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: homelab-stats
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.3.1/32
        - ipBlock:
            cidr: 10.42.5.1/32
