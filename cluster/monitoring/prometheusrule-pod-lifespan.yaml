apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-lifespan
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: pod-lifespan
      # 2m, not 1h: the archive federates this metric, and /federate only serves
      # samples inside Prometheus's 5m staleness window. Evaluating less often than
      # that makes the series read as absent, so federation silently scrapes zero
      # samples. Cheap to run — the query measures ~0.2s.
      interval: 2m
      rules:
        - record: homelab:pod_lifespan_dead_seconds
          expr: |
            (
              max by (namespace, pod) (timestamp(last_over_time(kube_pod_info{namespace=~"adguard|blog|default|js-pollock|kentjarrett-com|launchpad|mattjarrett-com|mattjarrett-dev|my-vinyl|nats|sump-pump", pod!~"cm-acme-http-solver-.*"}[30d])))
              -
              max by (namespace, pod) (last_over_time(kube_pod_created{namespace=~"adguard|blog|default|js-pollock|kentjarrett-com|launchpad|mattjarrett-com|mattjarrett-dev|my-vinyl|nats|sump-pump", pod!~"cm-acme-http-solver-.*"}[30d]))
            )
            unless on(namespace, pod) kube_pod_info{namespace=~"adguard|blog|default|js-pollock|kentjarrett-com|launchpad|mattjarrett-com|mattjarrett-dev|my-vinyl|nats|sump-pump", pod!~"cm-acme-http-solver-.*"}
            unless on(namespace, pod) last_over_time(kube_pod_owner{owner_kind="Job"}[30d])
