apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sdlc
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sdlc.json: |-
    {
      "uid": "sdlc-delivery",
      "title": "SDLC",
      "tags": ["sdlc", "github"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": { "from": "now-30d", "to": "now" },
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "repo",
            "label": "Repo",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(github_exporter_pr_merged, repo)",
            "query": {
              "query": "label_values(github_exporter_pr_merged, repo)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Merged, last 30 days",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "blue" } } },
          "targets": [{ "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\"})", "instant": true }]
        },
        {
          "id": 2, "type": "stat", "title": "Merged by a human",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "purple" } } },
          "targets": [{ "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",category=\"human\"})", "instant": true }]
        },
        {
          "id": 3, "type": "stat", "title": "Merged by Dependabot",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "light-blue" } } },
          "targets": [{ "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",category=~\"dependabot-.*\"})", "instant": true }]
        },
        {
          "id": 4, "type": "stat", "title": "Poll failures",
          "description": "A failed poll and a quiet week both leave the counts flat, so this is how an expired token becomes visible.",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } },
          "targets": [{ "expr": "sum(increase(github_exporter_poll_errors_total{repo=~\"$repo\"}[$__range])) or vector(0)", "instant": true }]
        },
        {
          "id": 10, "type": "bargauge", "title": "Merged by repo",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "reduceOptions": { "calcs": ["lastNotNull"] }, "showUnfilled": true },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "continuous-BlPu" } } },
          "targets": [{ "expr": "sum by (repo) (github_exporter_pr_merged{repo=~\"$repo\"})", "legendFormat": "{{repo}}", "instant": true }]
        },
        {
          "id": 11, "type": "piechart", "title": "How a merge happens",
          "description": "dependabot-auto merged through the auto-merge workflow. dependabot-manual needed a person.",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "legend": { "displayMode": "table", "placement": "right", "values": ["value"] } },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0 },
            "overrides": [
              { "matcher": { "id": "byName", "options": "human" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] },
              { "matcher": { "id": "byName", "options": "dependabot-auto" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "dependabot-manual" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }] }
            ]
          },
          "targets": [{ "expr": "sum by (category) (github_exporter_pr_merged{repo=~\"$repo\"})", "legendFormat": "{{category}}", "instant": true }]
        },
        {
          "id": 20, "type": "timeseries", "title": "Rolling 30-day window, by category",
          "description": "Each series is the count inside a sliding 30-day window, so a rise means more merges than a month ago rather than merges today.",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "human" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] },
              { "matcher": { "id": "byName", "options": "dependabot-auto" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "dependabot-manual" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }] }
            ]
          },
          "targets": [{ "expr": "sum by (category) (github_exporter_pr_merged{repo=~\"$repo\"})", "legendFormat": "{{category}}" }]
        }
      ]
    }
