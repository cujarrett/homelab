          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (conclusion) (github_exporter_workflow_runs{repo=~\"$repo\"})",
              "legendFormat": "{{conclusion}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Workflow runs on main, by outcome",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Opened and merged over the trailing 24 hours, plus how many sit open right now, sampled every poll.",
          "fieldConfig": {
