            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Opened"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "light-blue",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
