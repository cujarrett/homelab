apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sdlc
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sdlc.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The share of the last 30 days' merges that reached main with nobody pressing the button. This is the number the whole dashboard exists to move.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.75
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 60,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",merge=~\"auto|bot\",window=\"30d\"}) / (sum(github_exporter_pr_merged{repo=~\"$repo\",window=\"30d\"}) > 0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Merged without a human",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Grouped minor/patch or actions bumps - the ones an auto-merge workflow was built for - that a person merged by hand instead, over 30 days. Excludes major bumps, which were never eligible.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "color": {
                "fixedColor": "purple",
                "mode": "fixed"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 61,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",merge=\"clicked\",scope=\"auto-candidate\",window=\"30d\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Eligible PRs a human clicked anyway",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Runs on the default branch only. Auto-merge is only as safe as this number, since a green check is the gate it waits on.",
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.98
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(github_exporter_workflow_runs{repo=~\"$repo\",conclusion=\"success\"}) / (sum(github_exporter_workflow_runs{repo=~\"$repo\",conclusion=~\"success|failure\"}) > 0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "CI pass rate on main",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Repos whose GitHub poll failed in the last hour. Every count on this dashboard is a floor while this is above zero.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(increase(github_exporter_poll_errors_total{repo=~\"$repo\"}[1h]) > 0) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Repos with poll errors",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Daily bars. Open PRs split by why they are or aren't an auto-merge candidate, plus the day's total merges. How a merge happens (below) owns the clicked/auto/bot breakdown.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "bars",
                "barAlignment": 0,
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Open (human)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "light-blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Open (candidate)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Open (excluded)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Merged"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 50,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "expr": "sum(github_exporter_pr_open{repo=~\"$repo\",scope=\"human\"})",
              "legendFormat": "Open (human)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "range": true
            },
            {
              "expr": "sum(github_exporter_pr_open{repo=~\"$repo\",scope=\"auto-candidate\"})",
              "legendFormat": "Open (candidate)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "range": true
            },
            {
              "expr": "sum(github_exporter_pr_open{repo=~\"$repo\",scope=\"excluded\"})",
              "legendFormat": "Open (excluded)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "range": true
            },
            {
              "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",window=\"1d\"})",
              "legendFormat": "Merged",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "D",
              "range": true
            }
          ],
          "title": "PRs per day",
          "type": "timeseries",
          "interval": "1d"
        },
        {
          "id": 51,
          "type": "piechart",
          "title": "How a merge happens",
          "description": "Read from GitHub's own record. auto means GitHub merged it once checks passed, clicked means a person pressed the button, bot means a workflow merged with its own token.",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "auto"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "clicked"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "bot"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "light-blue"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum by (merge) (github_exporter_pr_merged{repo=~\"$repo\",window=\"30d\"})",
              "legendFormat": "{{merge}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A"
            }
          ]
        },
        {
          "id": 52,
          "type": "timeseries",
          "title": "CI failures by repo",
          "description": "Trailing 30-day failure count per repo, replotted every poll. A rising line is that repo's auto-merge CI getting less reliable.",
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (repo) (github_exporter_workflow_runs{repo=~\"$repo\",conclusion=\"failure\"}) > 0",
              "legendFormat": "{{repo}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "id": 53,
          "type": "piechart",
          "title": "Merge eligibility",
          "description": "Whether the merge could ever have used the auto-merge workflow. human is a person's own PR, excluded is an ungrouped major bump - neither was ever in scope. auto-candidate is the pile auto-merge should be clearing.",
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "human"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "light-blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "auto-candidate"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "excluded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum by (scope) (github_exporter_pr_merged{repo=~\"$repo\",window=\"30d\"})",
              "legendFormat": "{{scope}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A"
            }
          ]
        },
        {
          "id": 54,
          "type": "bargauge",
          "title": "Manual-required merges by repo",
          "description": "Merges that could never have used auto-merge - a person's own PR, or a major dependency bump - by repo, over 30 days.",
          "gridPos": {
            "x": 12,
            "y": 34,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "continuous-BlPu"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sort_desc(sum by (repo) (github_exporter_pr_merged{repo=~\"$repo\",scope=~\"human|excluded\",window=\"30d\"}) > 0)",
              "legendFormat": "{{repo}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Pull requests waiting right now. Under auto-merge this queue should drain itself.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "unit": "short",
              "color": {
                "mode": "continuous-BlPu"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 42
          },
          "id": 12,
          "options": {
            "displayMode": "gradient",
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(sum by (repo) (github_exporter_pr_open{repo=~\"$repo\"}) > 0)",
              "instant": true,
              "legendFormat": "{{repo}}",
              "refId": "A"
            }
          ],
          "title": "Open PRs by repo",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Auto-merge is gated on a green check, so a repo with flaky CI is not a safe place to turn it on. Repos with no runs at all are left out.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "unit": "percentunit",
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.98
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 42
          },
          "id": 13,
          "options": {
            "displayMode": "gradient",
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "13.2.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(sum by (repo) (github_exporter_workflow_runs{repo=~\"$repo\",conclusion=\"success\"}) / (sum by (repo) (github_exporter_workflow_runs{repo=~\"$repo\",conclusion=~\"success|failure\"}) > 0))",
              "instant": true,
              "legendFormat": "{{repo}}",
              "refId": "A"
            }
          ],
          "title": "CI pass rate by repo",
          "type": "bargauge"
        }
      ],
      "preload": false,
      "refresh": "5m",
      "schemaVersion": 42,
      "tags": [
        "sdlc",
        "github"
      ],
      "templating": {
        "list": [
          {
            "allowCustomValue": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(github_exporter_pr_merged, repo)",
            "hide": 0,
            "includeAll": true,
            "label": "Repo",
            "multi": true,
            "name": "repo",
            "options": [],
            "query": {
              "query": "label_values(github_exporter_pr_merged, repo)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "regexApplyTo": "value",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "SDLC",
      "uid": "sdlc-delivery"
    }
