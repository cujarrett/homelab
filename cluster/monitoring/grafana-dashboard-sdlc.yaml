              "expr": "sum(github_exporter_pr_merged{repo=~\"$repo\",merge=\"auto\",window=\"1d\"})",
              "legendFormat": "Merged auto",
              "range": true,
              "refId": "D"
            }
          ],
          "title": "Rolling 24 hour count",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
