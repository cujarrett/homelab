apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: storage
      interval: 5m
      rules:
        # actual_size counts every layer a replica holds on disk — volume-head plus
        # any snapshots. volume-head alone can never exceed capacity, so a ratio
        # above 1 means snapshot layers are carrying the excess. Longhorn marks
        # system-generated snapshots for cleanup after a replica rebuild, but the
        # purge that reclaims the space can stall silently, leaving the layer on
        # every replica. 1.1 for 6h clears both the current 0.88 steady state and
        # the short-lived spike a legitimate rebuild produces.
        - alert: LonghornVolumeSnapshotBloat
          expr: |
            longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes > 1.1
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} holds more on disk than its capacity"
            description: >-
              {{ $labels.volume }} ({{ $labels.pvc }}) is using
              {{ $value | humanizePercentage }} of its capacity on each replica,
              so unpurged snapshot layers are holding the difference. Check the
              chain with `kubectl get engines.longhorn.io -n longhorn-system`; if a
              snapshot shows removed=true it never got purged, and the reclaim is
              a snapshotPurge action against the volume on the longhorn-manager API.

        # The bloat alert above only sees a volume against its own capacity, which
        # says nothing about the node underneath it. This is the backstop: whatever
        # the cause, it fires before a node is close enough to full to matter.
        - alert: NodeDiskFillingUp
          expr: |
            100 - (
              node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
              * 100
            ) > 75
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} root filesystem is {{ $value | printf \"%.0f\" }}% full"
            description: >-
              Largest consumers are usually /var/lib/longhorn (replica data) and
              /var/lib/rancher/k3s/agent/containerd (image store, which accretes
              stale tags across Renovate bumps and is reclaimable with
              `k3s crictl rmi --prune`).
