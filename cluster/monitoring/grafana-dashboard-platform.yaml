apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform.json: |-
    {
      "title": "Platform",
      "uid": "homelab-platform",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "refresh": "1m",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active Guest Workspaces",
          "description": "Number of live guest sandbox workspaces (max 5).",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto", "justifyMode": "center" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 4 }, { "color": "red", "value": 5 } ] }
            }
          },
          "targets": [
            { "expr": "sum(launchpad_guest_workspace_count)", "legendFormat": "workspaces", "instant": true }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Guest Resource Count",
          "description": "Total resources across all active guest workspaces.",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none", "graphMode": "none", "textMode": "auto", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } },
          "targets": [
            { "expr": "sum(launchpad_guest_resource_count)", "legendFormat": "resources", "instant": true }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Guest Workspace & Resource Usage",
          "description": "Active guest workspace count and total resource count over time.",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 10, "lineInterpolation": "smooth" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "workspaces" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "resources" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "sum(launchpad_guest_workspace_count)", "legendFormat": "workspaces", "refId": "A" },
            { "expr": "sum(launchpad_guest_resource_count)", "legendFormat": "resources", "refId": "B" }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "XR Ready Status",
          "description": "Current ready state for all platform composite resources.",
          "gridPos": { "x": 0, "y": 13, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "footer": { "show": false } },
          "fieldConfig": {
            "defaults": { "custom": { "align": "left" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "ready" }, "properties": [
                { "id": "custom.width", "value": 110 },
                { "id": "mappings", "value": [
                  { "type": "value", "options": {
                    "1": { "text": "Ready",     "color": "green", "index": 0 },
                    "0": { "text": "Not Ready", "color": "red",   "index": 1 }
                  } }
                ] },
                { "id": "custom.displayMode", "value": "color-text" }
              ] },
              { "matcher": { "id": "byName", "options": "Time" },     "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "__name__" }, "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "job" },      "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "instance" }, "properties": [ { "id": "custom.hidden", "value": true } ] }
            ]
          },
          "targets": [
            { "expr": "platform_xr_ready", "instant": true, "legendFormat": "", "format": "table", "refId": "A" }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["kind", "name", "namespace", "backend", "Value"] } } },
            { "id": "organize", "options": { "renameByName": { "Value": "ready" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "kind", "desc": false }] } }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "XApi Bindings",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
          "panels": [
            {
              "id": 5,
              "type": "table",
              "title": "XApi Bindings",
              "description": "Active bindings between XApi instances and their platform dependencies (sql, nosql, topic, subscription, object-storage).",
              "gridPos": { "x": 0, "y": 24, "w": 24, "h": 8 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "footer": { "show": false } },
              "fieldConfig": {
                "defaults": { "custom": { "align": "left" } },
                "overrides": [
                  { "matcher": { "id": "byName", "options": "Value" },         "properties": [ { "id": "custom.hidden", "value": true } ] },
                  { "matcher": { "id": "byName", "options": "Time" },          "properties": [ { "id": "custom.hidden", "value": true } ] },
                  { "matcher": { "id": "byName", "options": "__name__" },      "properties": [ { "id": "custom.hidden", "value": true } ] },
                  { "matcher": { "id": "byName", "options": "job" },           "properties": [ { "id": "custom.hidden", "value": true } ] },
                  { "matcher": { "id": "byName", "options": "instance" },      "properties": [ { "id": "custom.hidden", "value": true } ] },
                  { "matcher": { "id": "byName", "options": "consumer_kind" }, "properties": [ { "id": "custom.hidden", "value": true } ] }
                ]
              },
              "targets": [
                { "expr": "platform_xr_binding", "instant": true, "legendFormat": "", "format": "table", "refId": "A" }
              ],
              "transformations": [
                { "id": "filterFieldsByName", "options": { "include": { "names": ["consumer_name", "binding_type", "provider_name"] } } },
                { "id": "sortBy", "options": { "fields": [{ "displayName": "consumer_name", "desc": false }] } }
              ]
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "XR Time-to-Ready — p50 and p99 per Type",
          "description": "Zero to Ready for each platform offering, split by backend. XApi private-cloud (sql/cache only) vs public-cloud (nosql/objstorage) differ significantly — grouping by backend makes that visible. XTopic and XSubscription excluded (single instances, percentiles are not meaningful).",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "footer": { "show": false } },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "align": "left" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p50" }, "properties": [
                { "id": "custom.width", "value": 160 },
                { "id": "custom.displayMode", "value": "color-background" },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 90 }
                ] } }
              ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [
                { "id": "custom.width", "value": 160 }
              ] },
              { "matcher": { "id": "byName", "options": "Time" },     "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "job" },      "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "instance" }, "properties": [ { "id": "custom.hidden", "value": true } ] }
            ]
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(platform_xr_time_to_ready_seconds_bucket{kind!~\"XTopic|XSubscription\"}) by (le, kind, backend))",
              "instant": true, "legendFormat": "", "format": "table", "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum(platform_xr_time_to_ready_seconds_bucket{kind!~\"XTopic|XSubscription\"}) by (le, kind, backend))",
              "instant": true, "legendFormat": "", "format": "table", "refId": "B"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "filterFieldsByName", "options": { "include": { "names": ["kind", "backend", "Value #A", "Value #B"] } } },
            { "id": "organize", "options": { "renameByName": { "Value #A": "p50", "Value #B": "p99" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "p50", "desc": false }] } }
          ]
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "XR Time-to-Ready — p50 / p99 Visual",
          "description": "p50 and p99 per XR type and backend side-by-side. Use alongside the table to spot outliers at a glance. XTopic and XSubscription excluded.",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(platform_xr_time_to_ready_seconds_bucket{kind!~\"XTopic|XSubscription\"}) by (le, kind, backend))",
              "instant": true,
              "legendFormat": "p50 — {{kind}} / {{backend}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "XApi Binding Wait — p50 per Stage",
          "description": "Median time spent waiting in each XApi pod init container stage (time from pod creation to that stage completing). Linkerd excluded. Object-storage init containers are normalized to a single label — the instance name is stripped. The nosql and object-storage stages are slow because Crossplane binding propagation adds ~75s on top of the AWS provision time (DynamoDB 16s + 75s propagation = ~90s total).",
          "gridPos": { "x": 0, "y": 34, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 15 },
                  { "color": "red", "value": 60 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(\n  label_replace(\n    histogram_quantile(0.5,\n      sum(platform_pod_init_container_seconds_bucket{init_container!~\"linkerd.*\"})\n      by (le, init_container)\n    ),\n    \"init_container\", \"wait-for-object-storage-binding\",\n    \"init_container\", \"wait-for-object-storage-.*-binding\"\n  ),\n  \"init_container\", \"$1\",\n  \"init_container\", \"wait-for-(.*)-binding\"\n)",
              "instant": true,
              "legendFormat": "{{init_container}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "AWS Resource Provisioning — p50 per Type",
          "description": "Median time from managed resource creation to Ready=True. This is the pure AWS provisioning cost — the binding propagation lag on top of this is what dominates XApi nosql/objstorage wait times. NATS resources excluded (their lastTransitionTime drifts for long-running resources).",
          "gridPos": { "x": 12, "y": 34, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 120 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(platform_managed_time_to_ready_seconds_bucket{kind!~\"NATS.*\"}) by (le, kind))",
              "instant": true,
              "legendFormat": "{{kind}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "XR Rollouts — Per Instance",
          "description": "Per-instance provisioning time for all XR types. Scroll to find any instance; click a column header to re-sort. Note: long-running XRs drift because Crossplane refreshes lastTransitionTime on reconcile — values for instances older than ~30 min reflect XR age rather than original provisioning time.",
          "gridPos": { "x": 0, "y": 42, "w": 24, "h": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "footer": { "show": false } },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "align": "left" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "time_to_ready" }, "properties": [
                { "id": "custom.width", "value": 160 },
                { "id": "custom.displayMode", "value": "color-background" },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 90 }
                ] } }
              ] },
              { "matcher": { "id": "byName", "options": "Time" },     "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "__name__" }, "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "job" },      "properties": [ { "id": "custom.hidden", "value": true } ] },
              { "matcher": { "id": "byName", "options": "instance" }, "properties": [ { "id": "custom.hidden", "value": true } ] }
            ]
          },
          "targets": [
            {
              "expr": "platform_xr_time_to_ready_seconds_instance",
              "instant": true,
              "legendFormat": "",
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["kind", "name", "namespace", "backend", "Value"] } } },
            { "id": "organize", "options": { "renameByName": { "Value": "time_to_ready" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "kind", "desc": false }] } }
          ]
        }
      ]
    }
