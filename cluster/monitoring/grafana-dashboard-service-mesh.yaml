apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-mesh
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-mesh.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Fraction of flows forwarded vs (forwarded + dropped) over the last 5 minutes. Drops indicate policy denials.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 0, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_flows_processed_total{verdict=\"FORWARDED\"}[5m])) / sum(rate(hubble_flows_processed_total{verdict=~\"FORWARDED|DROPPED\"}[5m])) * 100",
              "instant": true, "legendFormat": "Forward Rate", "refId": "A"
            }
          ],
          "title": "Forward Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Total network flows per second observed by Hubble across all workloads.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 4, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_flows_processed_total[5m]))",
              "instant": true, "legendFormat": "Flows/s", "refId": "A"
            }
          ],
          "title": "Flows/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Packets dropped by Cilium network policy per second. Spikes indicate denied connections.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 8, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_drop_total[5m])) or vector(0)",
              "instant": true, "legendFormat": "Drops/s", "refId": "A"
            }
          ],
          "title": "Policy Drops/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DNS responses with non-zero return codes (NXDOMAIN, SERVFAIL, etc.) per second.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 12, "y": 0 },
          "id": 5,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_dns_responses_total{rcode!=\"No Error\"}[5m])) or vector(0)",
              "instant": true, "legendFormat": "DNS Errors/s", "refId": "A"
            }
          ],
          "title": "DNS Errors/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DNS queries per second observed by Hubble across all workloads.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 16, "y": 0 },
          "id": 6,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_dns_queries_total[5m])) or vector(0)",
              "instant": true, "legendFormat": "DNS Queries/s", "refId": "A"
            }
          ],
          "title": "DNS Queries/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "New TCP connections per second (SYN flag rate) observed by Hubble.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 20, "y": 0 },
          "id": 7,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_tcp_flags_total{flag=\"SYN\"}[5m])) or vector(0)",
              "instant": true, "legendFormat": "SYN/s", "refId": "A"
            }
          ],
          "title": "TCP Connections/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Forwarded flows as a percentage of (forwarded + dropped) by source namespace over time.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text",
                "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "barWidthFactor": 0.6,
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "showValues": false,
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "max": 100, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 3 },
          "id": 9,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_flows_processed_total{verdict=\"FORWARDED\"}[$__rate_interval])) by (source) / sum(rate(hubble_flows_processed_total{verdict=~\"FORWARDED|DROPPED\"}[$__rate_interval])) by (source) * 100",
              "legendFormat": "{{source}}", "refId": "A"
            }
          ],
          "title": "Forward Rate by Namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Total network flows per second broken down by source namespace over time.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text",
                "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "barWidthFactor": 0.6,
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "showValues": false,
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 3 },
          "id": 10,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "legend": {
              "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right",
              "showLegend": true, "sortBy": "Last *", "sortDesc": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_flows_processed_total[$__rate_interval])) by (source)",
              "legendFormat": "{{source}}", "refId": "A"
            }
          ],
          "title": "Flows/s by Namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "All Hubble flows broken down by verdict over time. FORWARDED is normal traffic; DROPPED indicates policy denials.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text",
                "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "barWidthFactor": 0.6,
                "drawStyle": "line", "fillOpacity": 20, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "showValues": false,
                "spanNulls": false, "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "DROPPED" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "FORWARDED" },
                "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 11 },
          "id": 20,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "legend": {
              "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right",
              "showLegend": true, "sortBy": "Last *", "sortDesc": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (verdict) (rate(hubble_flows_processed_total[$__rate_interval]))",
              "legendFormat": "{{verdict}}", "refId": "A"
            }
          ],
          "title": "Flows by Verdict",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["homelab", "cilium", "service-mesh"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"]
      },
      "timezone": "browser",
      "title": "Service Mesh",
      "uid": "service-mesh"
    }
