apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-mesh
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-mesh.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Fraction of HTTP responses not classified as 5xx over the last 5 minutes.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 0, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_http_responses_total{status_code!~\"5..\"}[5m])) / sum(rate(hubble_http_responses_total[5m])) * 100",
              "instant": true, "legendFormat": "Success Rate", "refId": "A"
            }
          ],
          "title": "Success Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Total HTTP requests per second observed by Hubble across all meshed workloads.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 4, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_http_requests_total[5m]))",
              "instant": true, "legendFormat": "RPS", "refId": "A"
            }
          ],
          "title": "Req/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Packets dropped by Cilium network policy per second. Spikes indicate denied connections.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 8, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_drop_total[5m])) or vector(0)",
              "instant": true, "legendFormat": "Drops/s", "refId": "A"
            }
          ],
          "title": "Policy Drops/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "99th percentile HTTP response latency across all meshed workloads over the last 5 minutes.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 1000 }
                ]
              },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 12, "y": 0 },
          "id": 5,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(hubble_http_duration_seconds_bucket[5m])) by (le)) * 1000",
              "instant": true, "legendFormat": "p99", "refId": "A"
            }
          ],
          "title": "p99 Latency",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DNS queries per second observed by Hubble across all workloads.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 16, "y": 0 },
          "id": 6,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_dns_queries_total[5m])) or vector(0)",
              "instant": true, "legendFormat": "DNS Queries/s", "refId": "A"
            }
          ],
          "title": "DNS Queries/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "New TCP connections per second (SYN flag rate) observed by Hubble.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": 0 }]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 3, "w": 4, "x": 20, "y": 0 },
          "id": 7,
          "options": {
            "colorMode": "value", "graphMode": "none", "justifyMode": "center",
            "orientation": "auto", "percentChangeColorMode": "standard",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false, "textMode": "auto", "wideLayout": true
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_tcp_flags_total{flag=\"SYN\"}[5m])) or vector(0)",
              "instant": true, "legendFormat": "SYN/s", "refId": "A"
            }
          ],
          "title": "TCP Connections/s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "HTTP success rate broken down by source namespace over time.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text",
                "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "barWidthFactor": 0.6,
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "showValues": false,
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "max": 100, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 3 },
          "id": 9,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_http_responses_total{status_code!~\"5..\"}[$__rate_interval])) by (source) / sum(rate(hubble_http_responses_total[$__rate_interval])) by (source) * 100",
              "legendFormat": "{{source}}", "refId": "A"
            }
          ],
          "title": "Success Rate by Namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "HTTP requests per second broken down by source namespace over time.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text",
                "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "barWidthFactor": 0.6,
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "showValues": false,
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 3 },
          "id": 10,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "legend": {
              "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right",
              "showLegend": true, "sortBy": "Last *", "sortDesc": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(hubble_http_requests_total[$__rate_interval])) by (source)",
              "legendFormat": "{{source}}", "refId": "A"
            }
          ],
          "title": "RPS by Namespace",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "HTTP response latency distribution across all meshed services. X=time, Y=latency bucket (s), color=request volume.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "scaleDistribution": { "type": "linear" }
              }
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 11 },
          "id": 20,
          "options": {
            "annotations": { "clustering": -1, "multiLane": false },
            "calculate": false,
            "cellGap": 1,
            "color": {
              "exponent": 0.5, "fill": "dark-orange", "mode": "scheme",
              "reverse": false, "scale": "exponential", "scheme": "Cool", "steps": 64
            },
            "exemplars": { "color": "rgba(255,255,120,0.7)" },
            "filterValues": { "le": 1e-09 },
            "legend": { "show": true },
            "rowsFrame": { "layout": "auto" },
            "tooltip": { "mode": "single", "showColorScale": false, "yHistogram": false },
            "yAxis": { "axisPlacement": "left", "reverse": false, "unit": "s" }
          },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (le) (increase(hubble_http_duration_seconds_bucket[2m]))",
              "format": "heatmap", "legendFormat": "{{le}}", "refId": "A"
            }
          ],
          "title": "Response Latency Distribution",
          "type": "heatmap"
        }
      ],
      "preload": false,
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["homelab", "cilium", "service-mesh"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"]
      },
      "timezone": "browser",
      "title": "Service Mesh",
      "uid": "service-mesh"
    }
