apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-mesh
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-mesh.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Total request rate across the mesh (destination-reported).",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "reqps", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } } },
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval]))", "refId": "A" } ],
          "title": "Request Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Percent of requests without a 5xx response.",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "percent", "decimals": 2, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 95 }, { "color": "green", "value": 99 } ] } } },
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\",response_code!~\"5..\"}[$__rate_interval])) / sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) * 100", "refId": "A" } ],
          "title": "Success Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Percent of mesh requests carried over mutual TLS. This is the platform's mTLS coverage.",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "percent", "decimals": 1, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 80 }, { "color": "green", "value": 100 } ] } } },
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 0 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\",connection_security_policy=\"mutual_tls\"}[$__rate_interval])) / sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) * 100", "refId": "A" } ],
          "title": "mTLS Coverage",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "p99 request duration across the mesh.",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "ms", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 250 }, { "color": "red", "value": 1000 } ] } } },
          "gridPos": { "h": 4, "w": 5, "x": 15, "y": 0 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[$__rate_interval])) by (le))", "refId": "A" } ],
          "title": "p99 Latency",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Sidecars currently connected to istiod (xDS).",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } } },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "id": 5,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(pilot_xds)", "refId": "A" } ],
          "title": "Connected Proxies",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Inbound request rate per destination workload.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never", "stacking": { "mode": "none" } }, "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 6,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) by (destination_workload)", "legendFormat": "{{destination_workload}}", "refId": "A" } ],
          "title": "Request Rate by Workload",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Requests by response code. 403s are RBAC/AuthorizationPolicy denials.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 20, "showPoints": "never", "stacking": { "mode": "normal" } }, "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 7,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) by (response_code)", "legendFormat": "{{response_code}}", "refId": "A" } ],
          "title": "Response Codes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Request latency percentiles (destination-reported).",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" }, "unit": "ms" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 8,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[$__rate_interval])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.90, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[$__rate_interval])) by (le))", "legendFormat": "p90", "refId": "B" },
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[$__rate_interval])) by (le))", "legendFormat": "p99", "refId": "C" }
          ],
          "title": "Latency Percentiles",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Requests split by connection security. mutual_tls = protected; none/unknown = plaintext or unmeshed peer.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 30, "showPoints": "never", "stacking": { "mode": "normal" } }, "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 9,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) by (connection_security_policy)", "legendFormat": "{{connection_security_policy}}", "refId": "A" } ],
          "title": "Connection Security (mTLS vs plaintext)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Who is calling whom, by SPIFFE identity. This is the platform-managed connection map: source service account -> destination service account, with the response code.",
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": true } } },
          "gridPos": { "h": 8, "w": 14, "x": 0, "y": 20 },
          "id": 10,
          "options": { "showHeader": true, "sortBy": [ { "displayName": "Value", "desc": true } ] },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[$__rate_interval])) by (source_principal, destination_principal, response_code)", "format": "table", "instant": true, "refId": "A" } ],
          "title": "Identity Flows (source SA -> destination SA)",
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "source_principal": "Source identity", "destination_principal": "Destination identity", "response_code": "Code", "Value": "req/s" } } } ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "AuthorizationPolicy denials (HTTP 403). Empty until default-deny lands; then this is the missing-registration alarm.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "bars", "fillOpacity": 60, "showPoints": "never", "stacking": { "mode": "normal" } }, "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 20 },
          "id": 11,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(istio_requests_total{reporter=\"destination\",response_code=\"403\"}[$__rate_interval])) by (source_workload, destination_workload)", "legendFormat": "{{source_workload}} -> {{destination_workload}}", "refId": "A" } ],
          "title": "Denied Requests (403)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "istiod configuration pushes to sidecars, by xDS type.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" }, "unit": "cps" } },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 28 },
          "id": 12,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(pilot_xds_pushes[$__rate_interval])) by (type)", "legendFormat": "{{type}}", "refId": "A" } ],
          "title": "istiod xDS Pushes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "p99 time for istiod to push config and have proxies converge.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" }, "unit": "s" } },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 28 },
          "id": 13,
          "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "pluginVersion": "13.0.1+security-01",
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "histogram_quantile(0.99, sum(rate(pilot_proxy_convergence_time_bucket[$__rate_interval])) by (le))", "legendFormat": "p99 convergence", "refId": "A" } ],
          "title": "Proxy Convergence Time (p99)",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["homelab", "istio", "service-mesh"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"]
      },
      "timezone": "browser",
      "title": "Service Mesh",
      "uid": "service-mesh"
    }
