              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "pluginVersion": "12.4.2",
          "targets": [
            {
              "expr": "sump_pump_running{job=\"sump-pump-consumer\"}",
