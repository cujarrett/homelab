          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (node) (kube_pod_info)",
              "instant": true,
              "refId": "A",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]) * on(instance) group_left(node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\")) * 100",
              "instant": true,
              "refId": "B",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum by (node) (((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"cpu\"})) > (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"}))) or ((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"cpu\"})) unless (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"}))) or (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"})))) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}) * 100",
              "instant": true,
              "refId": "C",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}) - (sum by (node) (((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"cpu\"})) > (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"}))) or ((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"cpu\"})) unless (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"}))) or (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"cpu\"}))))) * 1000",
              "instant": true,
              "refId": "D",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - sum by (node) (node_memory_MemAvailable_bytes * on(instance) group_left(node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\")) / sum by (node) (node_memory_MemTotal_bytes * on(instance) group_left(node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\")))",
              "instant": true,
              "refId": "E",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node) (node_memory_MemAvailable_bytes * on(instance) group_left(node) label_replace(kube_node_info, \"instance\", \"$1:9100\", \"internal_ip\", \"(.*)\"))",
              "instant": true,
              "refId": "F",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum by (node) (((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"memory\"})) > (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"memory\"}))) or ((sum by (namespace,pod,node) (kube_pod_container_resource_requests{resource=\"memory\"})) unless (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"memory\"}))) or (max by (namespace,pod,node) (kube_pod_init_container_resource_requests{resource=\"memory\"})))) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"}) * 100",
              "instant": true,
              "refId": "G",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum by (node) (((sum by (namespace,pod,node) (kube_pod_container_resource_limits{resource=\"memory\"})) > (max by (namespace,pod,node) (kube_pod_init_container_resource_limits{resource=\"memory\"}))) or ((sum by (namespace,pod,node) (kube_pod_container_resource_limits{resource=\"memory\"})) unless (max by (namespace,pod,node) (kube_pod_init_container_resource_limits{resource=\"memory\"}))) or (max by (namespace,pod,node) (kube_pod_init_container_resource_limits{resource=\"memory\"})))) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"}) * 100",
              "instant": true,
              "refId": "H",
              "format": "table"
            }
          ],
          "title": "Nodes",
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "node",
