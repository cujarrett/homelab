apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pods-by-node
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pods-by-node.json: |-
    {
      "title": "Pods by Node",
      "uid": "homelab-pods-by-node",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "refresh": "30s",
      "schemaVersion": 38,
      "version": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "bargauge",
          "title": "Pod Count per Node",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(kube_pod_info{node!=\"\"}) by (node)",
              "instant": true,
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Pods by Node",
          "description": "Every pod and the node it's scheduled on.",
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "Node", "desc": false }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_pod_info{node!=\"\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": { "include": { "names": ["node", "namespace", "pod"] } }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": { "node": "Node", "namespace": "Namespace", "pod": "Pod" }
              }
            },
            {
              "id": "sortBy",
              "options": { "fields": [{ "displayName": "Node", "desc": false }] }
            }
          ]
        }
      ]
    }
