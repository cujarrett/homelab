apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sump-pump-kiosk
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sump-pump-kiosk.json: |-
    {
      "title": "Sump Pump — Kiosk",
      "uid": "sump-pump-kiosk",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": { "hidden": true },
      "refresh": "30s",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Runs / Hour",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "sump-pump-archive" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] } } },
          "targets": [{ "expr": "sum(rate(sump_pump_runs_total{job=\"sump-pump-consumer\"}[1h]) * 3600)", "legendFormat": "runs/hr", "instant": true, "refId": "A" }]
        },
        {
          "id": 2, "type": "timeseries", "title": "Runs, Duration, Temp, Rain",
          "gridPos": { "x": 4, "y": 0, "w": 20, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "sump-pump-archive" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "color": { "fixedColor": "rgba(38, 198, 218, 0.95)", "mode": "fixed" },
              "custom": { "lineWidth": 2, "fillOpacity": 0, "lineInterpolation": "smooth", "drawStyle": "line", "spanNulls": true }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "runs/hr" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "rgba(140, 140, 140, 0.95)", "mode": "fixed" } },
                  { "id": "custom.axisPlacement", "value": "left" },
                  { "id": "custom.lineWidth", "value": 2 },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "in/hr" },
                "properties": [
                  { "id": "unit", "value": "lengthin" },
                  { "id": "decimals", "value": 2 },
                  { "id": "color", "value": { "fixedColor": "rgba(90, 168, 255, 0.9)", "mode": "fixed" } },
                  { "id": "custom.drawStyle", "value": "bars" },
                  { "id": "custom.lineWidth", "value": 0 },
                  { "id": "custom.fillOpacity", "value": 35 },
                  { "id": "custom.axisPlacement", "value": "hidden" },
                  { "id": "custom.spanNulls", "value": true }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "\u00b0F" },
                "properties": [
                  { "id": "unit", "value": "fahrenheit" },
                  { "id": "decimals", "value": 1 },
                  { "id": "color", "value": { "fixedColor": "rgba(255, 230, 120, 0.95)", "mode": "fixed" } },
                  { "id": "custom.lineWidth", "value": 2 },
                  { "id": "custom.lineInterpolation", "value": "smooth" },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.spanNulls", "value": true },
                  { "id": "custom.axisPlacement", "value": "hidden" },
                  { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": true } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "min/hr" },
                "properties": [
                  { "id": "unit", "value": "min" },
                  { "id": "decimals", "value": 0 },
                  { "id": "color", "value": { "fixedColor": "rgba(38, 198, 218, 0.95)", "mode": "fixed" } },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.axisLabel", "value": "weather" },
                  { "id": "custom.lineWidth", "value": 2 },
                  { "id": "custom.lineInterpolation", "value": "smooth" },
                  { "id": "custom.fillOpacity", "value": 35 },
                  { "id": "custom.spanNulls", "value": true }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "hideZeros": false, "mode": "multi", "sort": "none" } },
          "targets": [
            { "expr": "sum(rate(sump_pump_runs_total{job=\"sump-pump-consumer\"}[1h]) * 3600)", "legendFormat": "runs/hr", "refId": "A" },
            { "expr": "max(weather_precipitation_mm{job=\"weather-exporter\"}) * 0.03937", "legendFormat": "in/hr", "refId": "B" },
            { "expr": "max(weather_temperature_fahrenheit{job=\"weather-exporter\"})", "legendFormat": "\u00b0F", "refId": "C" },
            { "expr": "round(avg_over_time(max(sump_pump_running{job=\"sump-pump-consumer\"})[1h:10s]) * 60)", "legendFormat": "min/hr", "refId": "D" }
          ]
        }
      ]
    }
