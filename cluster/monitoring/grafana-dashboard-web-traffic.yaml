apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-web-traffic
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  web-traffic.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Visitors",
          "description": "People who opened a page. US only. Attackers and known bots are left out.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "count(count by (visitor) (sum by (visitor, site) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | method=\"GET\" | status<400 | host!~\"demo[0-9]-api.*\" | ua=~\"Mozilla/5\\\\.0 \\\\((iPhone|iPad|Linux; Android|Macintosh|Windows|X11).*\" | ua!~\".*compatible;.*\" | path!~\"(?i).*\\\\.(js|css|png|jpe?g|gif|svg|ico|webp|avif|heic|woff2?|ttf|map|webmanifest|xml|txt|json|php)\" | path!~\"/(api|stats|wp-json|wp-admin|wp-content|wp-includes|ghost|members|content|assets|public)/.*|/feed/?|/healthz|/readyz|/undefined\" | label_format site=\"{{ regexReplaceAll \\\"^demo[0-9](-api)?[.]mattjarrett[.]dev$\\\" .host \\\"sandbox\\\" }}\" [$__range])) unless on (visitor) sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [$__range])))) or vector(0)",
              "refId": "A",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Page views",
          "description": "Pages those visitors opened. Images, scripts and API calls are not counted.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum(sum by (visitor, site) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | method=\"GET\" | status<400 | host!~\"demo[0-9]-api.*\" | ua=~\"Mozilla/5\\\\.0 \\\\((iPhone|iPad|Linux; Android|Macintosh|Windows|X11).*\" | ua!~\".*compatible;.*\" | path!~\"(?i).*\\\\.(js|css|png|jpe?g|gif|svg|ico|webp|avif|heic|woff2?|ttf|map|webmanifest|xml|txt|json|php)\" | path!~\"/(api|stats|wp-json|wp-admin|wp-content|wp-includes|ghost|members|content|assets|public)/.*|/feed/?|/healthz|/readyz|/undefined\" | label_format site=\"{{ regexReplaceAll \\\"^demo[0-9](-api)?[.]mattjarrett[.]dev$\\\" .host \\\"sandbox\\\" }}\" [$__range])) unless on (visitor) sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [$__range]))) or vector(0)",
              "refId": "A",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Attack sources",
          "description": "Sources that asked for a file no visitor asks for, such as /.env or /wp-login.php on a site with no WordPress. US only.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "count(sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [$__range]))) or vector(0)",
              "refId": "A",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Probe requests",
          "description": "Requests that match a scanner pattern. US only.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum(count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [$__range])) or vector(0)",
              "refId": "A",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Probes answered",
          "description": "Probes that got a 2xx back. Zero is the only good number. The paths are in What they probed.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum(count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" | status<300 [$__range])) or vector(0)",
              "refId": "A",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Refused, all countries",
          "description": "Every 401, 403, 404, 405 and 429 from Traefik's own counters. Mostly scanners. This is the only number here that includes traffic from outside the US.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-(${site:pipe})-gw-.*\",code=~\"401|403|404|405|429\"}[$__range]))",
              "refId": "A",
              "legendFormat": "",
              "instant": true
            }
          ]
        },
        {
          "id": 10,
          "type": "geomap",
          "title": "Who looked at what",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "description": "One dot per city and site. The color is the site. Hover a dot to see the pages. Bigger dots mean more requests. US only. mattjarrett.com and kentjarrett.com send no location, so they are never on the map.",
          "gridPos": {
            "h": 16,
            "w": 16,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Site"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "mattjarrett.dev": {
                            "color": "purple",
                            "index": 0
                          },
                          "blog.mattjarrett.dev": {
                            "color": "blue",
                            "index": 1
                          },
                          "launchpad.mattjarrett.dev": {
                            "color": "dark-blue",
                            "index": 2
                          },
                          "myvinyl.mattjarrett.dev": {
                            "color": "super-light-blue",
                            "index": 3
                          },
                          "jspollock.mattjarrett.dev": {
                            "color": "light-purple",
                            "index": 4
                          },
                          "connections.mattjarrett.dev": {
                            "color": "semi-dark-purple",
                            "index": 5
                          },
                          "graph.mattjarrett.dev": {
                            "color": "light-blue",
                            "index": 6
                          },
                          "kentjarrett.com": {
                            "color": "dark-purple",
                            "index": 7
                          },
                          "mattjarrett.com": {
                            "color": "super-light-purple",
                            "index": 8
                          },
                          "sandbox": {
                            "color": "semi-dark-blue",
                            "index": 9
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "basemap": {
              "config": {
                "showLabels": true,
                "theme": "dark"
              },
              "type": "carto"
            },
            "controls": {
              "mouseWheelZoom": false,
              "showAttribution": true,
              "showDebug": false,
              "showMeasure": false,
              "showScale": false,
              "showZoom": true
            },
            "layers": [
              {
                "config": {
                  "showLegend": false,
                  "style": {
                    "color": {
                      "field": "Site",
                      "fixed": "blue"
                    },
                    "opacity": 0.85,
                    "size": {
                      "field": "Requests",
                      "fixed": 6,
                      "min": 5,
                      "max": 14
                    },
                    "symbol": {
                      "fixed": "img/icons/marker/circle.svg",
                      "mode": "fixed"
                    }
                  }
                },
                "location": {
                  "latitude": "lat",
                  "longitude": "lon",
                  "mode": "coords"
                },
                "name": "Traffic",
                "tooltip": true,
                "type": "markers"
              }
            ],
            "tooltip": {
              "mode": "details"
            },
            "view": {
              "allLayers": true,
              "id": "coords",
              "lat": 39.5,
              "lon": -98.35,
              "zoom": 3.8
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum by (site, city, region, lat, lon, path) (sum by (visitor, site, city, region, lat, lon, path) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | host=~\"${site:pipe}\" | method=\"GET\" | status<400 | host!~\"demo[0-9]-api.*\" | ua=~\"Mozilla/5\\\\.0 \\\\((iPhone|iPad|Linux; Android|Macintosh|Windows|X11).*\" | ua!~\".*compatible;.*\" | path!~\"(?i).*\\\\.(js|css|png|jpe?g|gif|svg|ico|webp|avif|heic|woff2?|ttf|map|webmanifest|xml|txt|json|php)\" | path!~\"/(api|stats|wp-json|wp-admin|wp-content|wp-includes|ghost|members|content|assets|public)/.*|/feed/?|/healthz|/readyz|/undefined\" | label_format site=\"{{ regexReplaceAll \\\"^demo[0-9](-api)?[.]mattjarrett[.]dev$\\\" .host \\\"sandbox\\\" }}\" [$__range])) unless on (visitor) sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [$__range])))",
              "refId": "A",
              "queryType": "instant"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "destinationType": "number",
                    "targetField": "lat"
                  },
                  {
                    "destinationType": "number",
                    "targetField": "lon"
                  }
                ]
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "type": "exclude",
                "match": "any",
                "filters": [
                  {
                    "fieldName": "lat",
                    "config": {
                      "id": "isNull",
                      "options": {}
                    }
                  }
                ]
              }
            },
            {
              "id": "groupBy",
              "options": {
                "fields": {
                  "site": {
                    "aggregations": [],
                    "operation": "groupby"
                  },
                  "city": {
                    "aggregations": [],
                    "operation": "groupby"
                  },
                  "region": {
                    "aggregations": [],
                    "operation": "groupby"
                  },
                  "lat": {
                    "aggregations": [],
                    "operation": "groupby"
                  },
                  "lon": {
                    "aggregations": [],
                    "operation": "groupby"
                  },
                  "Value #A": {
                    "aggregations": [
                      "sum"
                    ],
                    "operation": "aggregate"
                  },
                  "path": {
                    "aggregations": [
                      "uniqueValues"
                    ],
                    "operation": "aggregate"
                  }
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Value #A (sum)",
                    "desc": true
                  }
                ]
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "site": "Site",
                  "city": "City",
                  "region": "State",
                  "Value #A (sum)": "Requests",
                  "path (uniqueValues)": "Looked at"
                },
                "indexByName": {
                  "site": 0,
                  "city": 1,
                  "region": 2,
                  "Value #A (sum)": 3,
                  "path (uniqueValues)": 4,
                  "lat": 5,
                  "lon": 6
                }
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Visitors by site",
          "description": "Unique visitors per site. The site colors match the dots on the map.",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
