apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-web-traffic
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  web-traffic.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            }
          },
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "maxPerRow": 6,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "sum"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "13.2.4",
          "repeat": "app",
          "repeatDirection": "h",
          "targets": [
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"$status_code\"}[$__range]))",
              "instant": true,
              "legendFormat": "requests",
              "refId": "A"
            }
          ],
          "title": "$app",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 11,
          "maxPerRow": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.2.4",
          "repeat": "app",
          "repeatDirection": "h",
          "targets": [
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code!~\"5..\"}[$__range])) / sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\"}[$__range]))",
              "instant": true,
              "legendFormat": "Success Rate",
              "refId": "A"
            }
          ],
          "title": "$app - Success Rate",
          "type": "stat"
        },
        {
          "description": "Each point shows requests in the previous 1-hour window. Use the Site dropdown to show fewer sites.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 0,
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.2.4",
          "targets": [
            {
              "expr": "sum by (site) (label_replace(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"$status_code\"}[1h]), \"site\", \"$1\", \"exported_service\", \"httproute-(.+?)-gw-.*\"))",
              "legendFormat": "{{site}}",
              "refId": "A"
            }
          ],
          "title": "Requests per Hour",
          "type": "timeseries"
        },
        {
          "description": "Requests per hour by HTTP status code class for the selected app. 2xx = success, 3xx = redirect, 4xx = client errors / bots, 5xx = server errors.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        10,
                        10
                      ],
                      "fill": "dash"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 20,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.2.4",
          "targets": [
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"2..\"}[1h]))",
              "legendFormat": "2xx",
              "refId": "A"
            },
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"3..\"}[1h]))",
              "legendFormat": "3xx",
              "refId": "B"
            },
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"4..\"}[1h]))",
              "legendFormat": "4xx",
              "refId": "C"
            },
            {
              "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"5..\"}[1h]))",
              "legendFormat": "5xx",
              "refId": "D"
            }
          ],
          "title": "HTTP Status Code Breakdown",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "description": "One pin per visitor location, with unique visitors and every site they opened in the tooltip. US only. Bots and scripts are dropped before storage. Visitors in the same city share a pin, since Cloudflare places them at the same point.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "decimals": 0,
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 30,
          "options": {
            "basemap": {
              "config": {
                "showLabels": true,
                "theme": "dark"
              },
              "type": "carto"
            },
            "controls": {
              "mouseWheelZoom": false,
              "showAttribution": true,
              "showDebug": false,
              "showMeasure": false,
              "showScale": false,
              "showZoom": true
            },
            "layers": [
              {
                "config": {
                  "showLegend": false,
                  "style": {
                    "color": {
                      "fixed": "blue"
                    },
                    "opacity": 0.75,
                    "size": {
                      "fixed": 7
                    }
                  }
                },
                "location": {
                  "latitude": "lat",
                  "longitude": "lon",
                  "mode": "coords"
                },
                "name": "Visitors",
                "tooltip": true,
                "type": "markers"
              }
            ],
            "tooltip": {
              "mode": "details"
            },
            "view": {
              "allLayers": true,
              "dashboardVariable": false,
              "id": "coords",
              "lat": 39.5,
              "lon": -98.35,
              "noRepeat": false,
              "zoom": 3.8
            }
          },
          "pluginVersion": "13.2.4",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "count by (city, region, postal, lat, lon) (sum by (visitor, city, region, postal, lat, lon) (count_over_time({log_type=~\"access|sandbox\"} | json | label_format visitor=request_Cf_Connecting_Ip, city=request_Cf_Ipcity, region=request_Cf_Region_Code, postal=request_Cf_Postal_Code, lat=request_Cf_Iplatitude, lon=request_Cf_Iplongitude [$__range])))",
              "legendFormat": "Visitors",
              "queryType": "instant",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "count by (site, city, region, postal, lat, lon) (sum by (visitor, site, city, region, postal, lat, lon) (count_over_time({log_type=~\"access|sandbox\"} | json | label_format visitor=request_Cf_Connecting_Ip, site=RequestHost, city=request_Cf_Ipcity, region=request_Cf_Region_Code, postal=request_Cf_Postal_Code, lat=request_Cf_Iplatitude, lon=request_Cf_Iplongitude [$__range])))",
              "legendFormat": "Sites",
              "queryType": "instant",
              "refId": "B"
            }
          ],
          "title": "US Visitors",
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "destinationType": "number",
                    "targetField": "lat"
                  },
                  {
                    "destinationType": "number",
                    "targetField": "lon"
                  }
                ]
              }
            },
            {
              "id": "groupBy",
              "options": {
                "fields": {
                  "city": {"aggregations": [], "operation": "groupby"},
                  "region": {"aggregations": [], "operation": "groupby"},
                  "postal": {"aggregations": [], "operation": "groupby"},
                  "lat": {"aggregations": [], "operation": "groupby"},
                  "lon": {"aggregations": [], "operation": "groupby"},
                  "Value #A": {"aggregations": ["max"], "operation": "aggregate"},
                  "site": {"aggregations": ["uniqueValues"], "operation": "aggregate"}
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "city": "City",
                  "site (uniqueValues)": "Sites",
                  "Value #A (max)": "Visitors",
                  "postal": "Postal code",
                  "region": "State"
                }
              }
            }
          ],
          "type": "geomap"
        }
      ],
      "preload": false,
      "refresh": "5m",
      "schemaVersion": 42,
      "templating": {
        "list": [
          {
            "allowCustomValue": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(traefik_service_requests_total{exported_service!~\"httproute-(argocd|monitoring|spire-server|guest-.*)-.*\"}, exported_service)",
            "hide": 0,
            "includeAll": true,
            "label": "Site",
            "multi": true,
            "name": "app",
            "options": [],
            "query": {
              "query": "label_values(traefik_service_requests_total{exported_service!~\"httproute-(argocd|monitoring|spire-server|guest-.*)-.*\"}, exported_service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "/^httproute-(?<value>.+?)-gw-kube-system-/",
            "regexApplyTo": "value",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "allowCustomValue": true,
            "current": {
              "text": "All",
              "value": ".*"
            },
            "hide": 0,
            "includeAll": false,
            "label": "HTTP Code",
            "multi": false,
            "name": "status_code",
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": ".*"
              },
              {
                "selected": false,
                "text": "2xx Success",
                "value": "2.."
              },
              {
                "selected": false,
                "text": "3xx Redirect",
                "value": "3.."
              },
              {
                "selected": false,
                "text": "4xx Client Error",
                "value": "4.."
              },
              {
                "selected": false,
                "text": "5xx Server Error",
                "value": "5.."
              }
            ],
            "query": "All : .*, 2xx Success : 2.., 3xx Redirect : 3.., 4xx Client Error : 4.., 5xx Server Error : 5..",
            "skipUrlSync": false,
            "type": "custom",
            "valuesFormat": "csv"
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "Web Traffic",
      "uid": "web-traffic"
    }
