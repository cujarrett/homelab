apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-web-traffic
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  web-traffic.json: |-
    {
      "title": "Web Traffic",
      "uid": "web-traffic",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "refresh": "5m",
      "schemaVersion": 38,
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "app",
            "label": "Site",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traefik_service_requests_total{exported_service!~\"httproute-(argocd|monitoring|spire-server|guest-.*)-.*\"}, exported_service)",
            "query": {
              "query": "label_values(traefik_service_requests_total{exported_service!~\"httproute-(argocd|monitoring|spire-server|guest-.*)-.*\"}, exported_service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "/^httproute-(?<value>.+?)-gw-kube-system-/",
            "sort": 1,
            "skipUrlSync": false,
            "hide": 0
          },
          {
            "current": { "selected": true, "text": "All", "value": ".*" },
            "hide": 0,
            "includeAll": false,
            "label": "HTTP Code",
            "multi": false,
            "name": "status_code",
            "options": [
              { "selected": true, "text": "All", "value": ".*" },
              { "selected": false, "text": "2xx Success", "value": "2.." },
              { "selected": false, "text": "3xx Redirect", "value": "3.." },
              { "selected": false, "text": "4xx Client Error", "value": "4.." },
              { "selected": false, "text": "5xx Server Error", "value": "5.." }
            ],
            "query": "All : .*, 2xx Success : 2.., 3xx Redirect : 3.., 4xx Client Error : 4.., 5xx Server Error : 5..",
            "skipUrlSync": false,
            "type": "custom"
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "$app",
          "repeat": "app",
          "repeatDirection": "h",
          "maxPerRow": 6,
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["sum"] }, "colorMode": "none", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"$status_code\"}[$__range]))", "legendFormat": "requests", "instant": true }]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests per Hour",
          "description": "Each point shows requests in the previous 1-hour window. Use the Site dropdown to show fewer sites.",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 9 },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth" } }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "sum by (site) (label_replace(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"$status_code\"}[1h]), \"site\", \"$1\", \"exported_service\", \"httproute-(.+?)-gw-.*\"))", "legendFormat": "{{site}}" }
          ]
        },
        {
          "id": 11, "type": "stat", "title": "$app - Success Rate",
          "repeat": "app",
          "repeatDirection": "h",
          "maxPerRow": 6,
          "gridPos": { "x": 0, "y": 13, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.9 }, { "color": "green", "value": 0.99 }] } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code!~\"5..\"}[$__range])) / sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\"}[$__range]))", "legendFormat": "Success Rate", "instant": true }]
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "HTTP Status Code Breakdown",
          "description": "Requests per hour by HTTP status code class for the selected app. 2xx = success, 3xx = redirect, 4xx = client errors / bots, 5xx = server errors.",
          "gridPos": { "x": 0, "y": 17, "w": 24, "h": 10 },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 8, "lineInterpolation": "smooth" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "2xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "3xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }, { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } }] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"2..\"}[1h]))", "legendFormat": "2xx", "refId": "A" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"3..\"}[1h]))", "legendFormat": "3xx", "refId": "B" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"4..\"}[1h]))", "legendFormat": "4xx", "refId": "C" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"httproute-${app:regex}-gw-.*\",code=~\"5..\"}[1h]))", "legendFormat": "5xx", "refId": "D" }
          ]
        },
        {
          "id": 30,
          "type": "geomap",
          "title": "US Visitors",
          "description": "One pin per visitor location across every public site, with unique visitors in the tooltip. US only. Bots and scripts are dropped before storage. Visitors in the same city share a pin, since Cloudflare places them at the same point.",
          "gridPos": { "x": 0, "y": 27, "w": 24, "h": 14 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            { "expr": "count by (city, region, postal, lat, lon) (sum by (visitor, city, region, postal, lat, lon) (count_over_time({log_type=~\"access|sandbox\"} | json | label_format visitor=request_Cf_Connecting_Ip, city=request_Cf_Ipcity, region=request_Cf_Region_Code, postal=request_Cf_Postal_Code, lat=request_Cf_Iplatitude, lon=request_Cf_Iplongitude [$__range])))", "queryType": "instant", "legendFormat": "Visitors", "refId": "A" }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": { "mode": "columns" } },
            { "id": "merge", "options": {} },
            { "id": "convertFieldType", "options": { "conversions": [{ "targetField": "lat", "destinationType": "number" }, { "targetField": "lon", "destinationType": "number" }] } },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "city": "City", "region": "State", "postal": "Postal code" } } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "blue" } }, "overrides": [] },
          "options": {
            "view": { "id": "coords", "lat": 39.5, "lon": -98.35, "zoom": 3.8 },
            "controls": { "showZoom": true, "mouseWheelZoom": false },
            "basemap": { "type": "carto", "config": { "theme": "dark", "showLabels": true } },
            "layers": [{
              "type": "markers", "name": "Visitors", "tooltip": true,
              "location": { "mode": "coords", "latitude": "lat", "longitude": "lon" },
              "config": { "showLegend": false, "style": { "size": { "fixed": 7 }, "color": { "fixed": "blue" }, "opacity": 0.75 } }
            }],
            "tooltip": { "mode": "details" }
          }
        }
      ]
    }
