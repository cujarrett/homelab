apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-launchpad-kiosk
  namespace: monitoring
  annotations:
    grafana_folder: Kiosk
  labels:
    grafana_dashboard: "1"
data:
  launchpad-kiosk.json: |-
    {
      "title": "Launchpad — Kiosk",
      "uid": "launchpad-kiosk",
      "editable": true,
      "graphTooltip": 0,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": { "hidden": true },
      "refresh": "1m",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Guest Workspaces (now)",
          "gridPos": { "x": 0, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 4 }, { "color": "red", "value": 5 } ] }
            }
          },
          "targets": [{ "expr": "sum(launchpad_guest_workspace_count)", "legendFormat": "workspaces", "instant": true, "refId": "A" }]
        },
        {
          "id": 4, "type": "stat", "title": "Guest Workspaces (24h peak)",
          "gridPos": { "x": 3, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "color": { "fixedColor": "purple", "mode": "fixed" }
            }
          },
          "targets": [{ "expr": "max_over_time(sum(launchpad_guest_workspace_count)[24h:1m])", "legendFormat": "peak 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 2, "type": "stat", "title": "Guest Resources (now)",
          "gridPos": { "x": 6, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "color": { "fixedColor": "blue", "mode": "fixed" }
            }
          },
          "targets": [{ "expr": "sum(launchpad_guest_resource_count)", "legendFormat": "resources", "instant": true, "refId": "A" }]
        },
        {
          "id": 5, "type": "stat", "title": "Guest Resources (24h peak)",
          "gridPos": { "x": 9, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "color": { "fixedColor": "blue", "mode": "fixed" }
            }
          },
          "targets": [{ "expr": "max_over_time(sum(launchpad_guest_resource_count)[24h:1m])", "legendFormat": "peak 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 3, "type": "timeseries", "title": "Workspace & Resource Usage",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "workspaces" }, "properties": [{ "id": "color", "value": { "fixedColor": "purple", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "resources" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(launchpad_guest_workspace_count)", "legendFormat": "workspaces", "refId": "A" },
            { "expr": "sum(launchpad_guest_resource_count)", "legendFormat": "resources", "refId": "B" }
          ]
        }
      ]
    }
