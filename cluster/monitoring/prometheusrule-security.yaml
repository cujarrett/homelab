apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: security
      interval: 5m
      rules:
        # homelab:security_open*  = open right now. The Homelab stat and Security dashboard show this.
        # homelab:security_overdue* = open longer than automation needs. Only the Discord alert uses this.
        - record: homelab:security_open_node_updates:count
          expr: count(node_security_updates_pending > 0) or vector(0)
        - record: homelab:security_open_node_reboot:count
          expr: count(node_reboot_required > 0) or vector(0)
        # The stamp is touched daily, so 2 days stale means the timer is broken.
        - record: homelab:security_open_unattended_stale:count
          expr: count(time() - node_unattended_upgrades_last_run_timestamp_seconds > 2 * 86400) or vector(0)
        - record: homelab:security_open_image_cves:count
          expr: count(count by (image_repository, vuln_id) (trivy_vulnerability_id{severity="Critical", fixed_version!="", resource_kind!="Job"})) or vector(0)
        - record: homelab:security_open_renovate_blocked:count
          expr: count(sum by (repo) (github_exporter_pr_open_blocked) > 0) or vector(0)
        - record: homelab:security_open:count
          expr: |
            homelab:security_open_node_updates:count
            + homelab:security_open_node_reboot:count
            + homelab:security_open_unattended_stale:count
            + homelab:security_open_image_cves:count
            + homelab:security_open_renovate_blocked:count
        # image CVE: Jobs are left out. A finished Job's image no longer runs, but its report stays while the Job object exists.
        # image CVE: Renovate waits 7 days, so a fixable critical running 9 days after Trivy listed a fix means it missed
        # Renovate PR: blocked for 2 days means a fix is stuck behind a failing check
        # node rules: max by node first, so a node-updates pod rollout does not leave the old pod's last value in the window
        - record: homelab:security_overdue_node_updates:count
          expr: count(min_over_time(max by (node) (node_security_updates_pending)[3d:5m]) > 0) or vector(0)
        - record: homelab:security_overdue_node_reboot:count
          expr: count(min_over_time(max by (node) (node_reboot_required)[7d:5m]) > 0) or vector(0)
        - record: homelab:security_overdue_image_cves:count
          expr: |
            count(
              count by (image_repository, vuln_id) (
                trivy_vulnerability_id{severity="Critical", fixed_version!="", resource_kind!="Job"}
                and trivy_vulnerability_id{severity="Critical", fixed_version!="", resource_kind!="Job"} offset 9d
              )
            ) or vector(0)
        - record: homelab:security_overdue_renovate_blocked:count
          # The last clause keeps a series from a replaced github-exporter pod from counting for 2 more days.
          expr: count(min_over_time(github_exporter_pr_open_blocked[2d]) > 0 and on(repo) github_exporter_pr_open_blocked > 0) or vector(0)
        - record: homelab:security_overdue:count
          expr: |
            homelab:security_overdue_node_updates:count
            + homelab:security_overdue_node_reboot:count
            + homelab:security_open_unattended_stale:count
            + homelab:security_overdue_image_cves:count
            + homelab:security_overdue_renovate_blocked:count
        # Defined after the open and overdue rules, so one evaluation computes all of them in order.
        # needs_you: only a person can clear these. Reboots and blocked PRs never fix themselves,
        #   and an overdue item has outlived the automation meant to fix it. The Security dashboard leads with this.
        # waiting: automation or an upstream release will clear these without anyone acting.
        - record: homelab:security_needs_you:count
          expr: |
            homelab:security_open_node_reboot:count
            + homelab:security_open_unattended_stale:count
            + homelab:security_open_renovate_blocked:count
            + homelab:security_overdue_node_updates:count
            + homelab:security_overdue_image_cves:count
        - record: homelab:security_waiting:count
          expr: |
            (homelab:security_open_node_updates:count - homelab:security_overdue_node_updates:count)
            + (homelab:security_open_image_cves:count - homelab:security_overdue_image_cves:count)
        # node updates: unattended-upgrades runs daily, so 3 days pending means it stopped
        # node reboot: unattended-upgrades never reboots, so 7 days means nobody did
        - alert: SecurityItemsOverdue
          expr: homelab:security_overdue:count > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-security"
            summary: "{{ $value }} security item(s) automation has not fixed in time"
            description: >-
              Open the Security dashboard for which nodes, images or Renovate PRs.
              Each item has already outlived the window its automation gets.
        # Query: the Security dashboard's Running but Not Scanned table, counted per image.
        # 3h: normal rescans leave gaps of up to 2.5 hours.
        # istio-proxy: matched on the tag that istio-proxy-scan.yaml scans.
        - alert: ImageNotScanned
          expr: |
            count by (image_spec) (
              count by (namespace, owner_name, container, image_spec) (
                (kube_pod_container_info or kube_pod_init_container_info{container!~"istio-proxy|istio-validation"})
                * on (namespace, pod) group_left (owner_name) kube_pod_owner{owner_kind!="Job"}
                unless on (namespace, owner_name, container)
                label_replace(label_replace(trivy_image_vulnerabilities, "owner_name", "$1", "resource_name", "(.*)"), "container", "$1", "container_name", "(.*)")
              )
              or
              count by (namespace, owner_name, container, image_spec) (
                label_replace(kube_pod_init_container_info{container="istio-proxy"} or kube_pod_container_info{container="istio-proxy"}, "image", "$1", "image_spec", "([^@]+).*")
                * on (namespace, pod) group_left (owner_name) kube_pod_owner{owner_kind!="Job"}
                unless on (image)
                label_join(label_join(trivy_image_vulnerabilities{image_repository="release/proxyv2"}, "image", "/", "image_registry", "image_repository"), "image", ":", "image", "image_tag")
              )
            ) > 0
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.image_spec }} runs in {{ $value }} container(s) with no vulnerability report"
            description: >-
              The Security dashboard's Running but Not Scanned table lists the workloads.
              An istio-proxy row runs an older proxy than the scanned one. Restart
              that workload. Any other row means Trivy cannot scan the image. Read
              the trivy-operator logs.
