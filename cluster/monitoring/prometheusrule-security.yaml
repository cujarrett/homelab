apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: security
      interval: 5m
      rules:
        # Each record counts only what automation has failed to fix in its own window.
        # node security updates: unattended-upgrades runs daily, so 3 days pending means it stopped
        # node reboot: unattended-upgrades never reboots, so 7 days means nobody did
        # unattended run: the stamp is touched daily, so 2 days stale means the timer is broken
        # image CVE: Renovate waits 7 days, so a fixable critical still running after 9 means it missed
        # Renovate PR: blocked for 2 days means a fix is stuck behind a failing check
        - record: homelab:security_open_node_updates:count
          expr: count(min_over_time(node_security_updates_pending[3d]) > 0) or vector(0)
        - record: homelab:security_open_node_reboot:count
          expr: count(min_over_time(node_reboot_required[7d]) > 0) or vector(0)
        - record: homelab:security_open_unattended_stale:count
          expr: count(time() - node_unattended_upgrades_last_run_timestamp_seconds > 2 * 86400) or vector(0)
        - record: homelab:security_open_image_cves:count
          expr: |
            count(
              count by (image_repository, vuln_id) (
                trivy_vulnerability_id{severity="Critical", fixed_version!=""}
                and trivy_vulnerability_id{severity="Critical", fixed_version!=""} offset 9d
              )
            ) or vector(0)
        - record: homelab:security_open_renovate_blocked:count
          expr: count(min_over_time(github_exporter_pr_open_blocked[2d]) > 0) or vector(0)
        - record: homelab:security_open:count
          expr: |
            homelab:security_open_node_updates:count
            + homelab:security_open_node_reboot:count
            + homelab:security_open_unattended_stale:count
            + homelab:security_open_image_cves:count
            + homelab:security_open_renovate_blocked:count
        - alert: SecurityItemsOpen
          expr: homelab:security_open:count > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} security item(s) automation has not fixed in time"
            description: >-
              Open the Security dashboard for which nodes, images or Renovate PRs.
              Each item has already outlived the window its automation gets.
