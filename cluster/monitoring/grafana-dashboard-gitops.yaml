apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gitops
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gitops.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Total number of ArgoCD applications.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info)",
              "instant": true,
              "legendFormat": "total apps",
              "refId": "A"
            }
          ],
          "title": "ArgoCD Apps",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Apps with health_status=Healthy.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 10
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info{health_status=\"Healthy\"})",
              "instant": true,
              "legendFormat": "healthy",
              "refId": "A"
            }
          ],
          "title": "Healthy Apps",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Apps with sync_status=Synced.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 10
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info{sync_status=\"Synced\"})",
              "instant": true,
              "legendFormat": "synced",
              "refId": "A"
            }
          ],
          "title": "Synced Apps",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Apps not in Synced state \u2014 should be 0 in a healthy cluster.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "instant": true,
              "legendFormat": "out of sync",
              "refId": "A"
            }
          ],
          "title": "Out of Sync",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Per-app health and sync status. Sourced from argocd_app_info metric.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "health_status"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 140
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "Degraded": {
                            "color": "red",
                            "index": 1,
                            "text": "Degraded"
                          },
                          "Healthy": {
                            "color": "green",
                            "index": 0,
                            "text": "Healthy"
                          },
                          "Missing": {
                            "color": "orange",
                            "index": 3,
                            "text": "Missing"
                          },
                          "Progressing": {
                            "color": "yellow",
                            "index": 2,
                            "text": "Progressing"
                          },
                          "Unknown": {
                            "color": "grey",
                            "index": 4,
                            "text": "Unknown"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "sync_status"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 120
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "OutOfSync": {
                            "color": "orange",
                            "index": 1,
                            "text": "Out of Sync"
                          },
                          "Synced": {
                            "color": "green",
                            "index": 0,
                            "text": "Synced"
                          },
                          "Unknown": {
                            "color": "grey",
                            "index": 2,
                            "text": "Unknown"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom.viz",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom.viz",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "__name__"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom.viz",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "job"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom.viz",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom.viz",
                    "value": true
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "name"
              }
            ]
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "argocd_app_info",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "ArgoCD App Status",
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "name",
                    "health_status",
                    "sync_status",
                    "project",
                    "dest_namespace"
                  ]
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": [
                  {
                    "desc": false,
                    "displayName": "name"
                  }
                ]
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 302,
          "title": "Rollouts",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "description": "ArgoCD sync events \u2014 app synced, when it happened, and whether it succeeded. Sourced from argocd-application-controller logs.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "status"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "Error": {
                            "color": "orange",
                            "index": 2,
                            "text": "Error"
                          },
                          "Failed": {
                            "color": "red",
                            "index": 1,
                            "text": "Failed"
                          },
                          "Succeeded": {
                            "color": "green",
                            "index": 0,
                            "text": "Succeeded"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 301,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "13.1.0",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "{namespace=\"argocd\", container=\"application-controller\"} |= \"Updating operation state\" |~ \"Succeeded|Failed|Error\" | regexp \"(?P<status>Succeeded|Failed|Error).*application=(?P<what>[^ ]+) project=(?P<project>[^ ]+)\" | status != \"\" | line_format \"what={{.what}} project={{.project}} status={{.status}}\"",
              "legendFormat": "",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Recent Rollouts",
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "format": "kvp",
                "source": "Line"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Line": true,
                  "id": true,
                  "labelTypes": true,
                  "labels": true,
                  "tsNs": true
                },
                "renameByName": {
                  "Time": "when"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": [
                  {
                    "desc": true,
                    "displayName": "when"
                  }
                ]
              }
            }
          ],
          "type": "table"
        }
      ],
      "preload": false,
      "refresh": "1m",
      "schemaVersion": 42,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "GitOps & Platform",
      "uid": "homelab-gitops"
    }
