        {
          "description": "One row per vulnerable package in each workload.\nThe package has a fixed release, but the image still ships the old one.\nRenovate opens a PR once the image publisher ships a rebuilt image. Updates already found are in the table below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CVE"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "Critical\\|(.*)",
                          "result": {
                            "index": 0,
                            "text": "$1",
                            "color": "red"
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "High\\|(.*)",
                          "result": {
                            "index": 1,
                            "text": "$1",
                            "color": "yellow"
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "Unknown\\|(.*)",
                          "result": {
                            "index": 2,
                            "text": "$1",
                            "color": "purple"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "links",
                    "value": [
                      {
                        "targetBlank": true,
                        "title": "${__value.text} on cve.org",
                        "url": "https://www.cve.org/CVERecord?id=${__value.text}"
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              }
            ]
          },
