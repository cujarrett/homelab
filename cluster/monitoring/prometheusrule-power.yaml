apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: power
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: power
      interval: 5m
      rules:
        # Prometheus dies with the nodes, so boot time is read after recovery.
        # All four nodes booting within five minutes of each other means lost mains power.
        # The count of four stops a node-exporter rollout from matching while only one node reports.
        - alert: ClusterPowerLoss
          expr: |
            (max(node_boot_time_seconds) - min(node_boot_time_seconds)) < 300
            and
            (time() - max(node_boot_time_seconds)) < 1800
            and
            count(max by (instance) (node_boot_time_seconds)) >= 4
          for: 5m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "All nodes rebooted together - the rack lost power"
            description: >-
              Every node booted within the same five minute window, which mains
              power loss is the only ordinary cause of. Check that workloads
              reading from hardware outside the cluster actually resumed - device
              side config does not always survive a power cycle.
