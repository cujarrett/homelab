apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: power
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: power
      interval: 5m
      rules:
        # A whole-rack outage can't be caught live - Prometheus dies with the nodes,
        # so boot time is read after recovery instead. All four nodes booting within
        # five minutes of each other is the signature of lost mains power.
        - alert: ClusterPowerLoss
          expr: |
            (max(node_boot_time_seconds) - min(node_boot_time_seconds)) < 300
            and
            (time() - max(node_boot_time_seconds)) < 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "All nodes rebooted together - the rack lost power"
            description: >-
              Every node booted within the same five minute window, which mains
              power loss is the only ordinary cause of. Check that workloads
              reading from hardware outside the cluster actually resumed - device
              side config does not always survive a power cycle.
