apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.17.0
    helm:
      releaseName: monitoring
      values: |
        kubeApiServer:
          enabled: false
        kubelet:
          serviceMonitor:
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: "apiserver_.+|etcd_.+|workqueue_.+_bucket|prober_.+_bucket|scheduler_.+_bucket|kubelet_runtime_operations_duration_seconds_bucket|container_blkio_device_usage_total|storage_operation_duration_seconds_bucket|rest_client_request_duration_seconds_bucket|kubernetes_feature_enabled"
                action: drop
        prometheusOperator:
          serviceMonitor:
            selfMonitor: false
          admissionWebhooks:
            patch: {}
        alertmanager:
          alertmanagerSpec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            # Mounts at /etc/alertmanager/secrets/alertmanager-discord/webhook-url.
            # Pre-created in the cluster by hand, never in Git — the webhook URL is
            # the only credential guarding the channel, so anyone holding it can post
            # as the bot. Rotation is deleting the webhook in Discord and remaking it.
            secrets:
              - alertmanager-discord
            storage:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 2Gi
          # Setting this replaces the chart's default config wholesale, so the stock
          # inhibit rules are restated below rather than inherited.
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by:
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              # Everything goes to Discord except the two cases below, which are
              # noise by construction rather than by threshold. First match wins,
              # so both silenced routes have to precede the catch-all.
              receiver: discord
              routes:
                # Watchdog fires permanently by design — it exists so an external
                # dead-man's-switch can notice when it stops arriving. Delivered
                # here it would just be a 12h heartbeat carrying no cluster state.
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                # k3s runs controller-manager, scheduler and kube-proxy inside the
                # single server binary, so nothing listens on the ports these alerts
                # probe and all three fire permanently. Routing them anywhere else
                # means a false page every repeat_interval, forever.
                - receiver: "null"
                  matchers:
                    - alertname =~ "KubeControllerManagerDown|KubeProxyDown|KubeSchedulerDown"
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity =~ warning|info
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - severity = warning
                target_matchers:
                  - severity = info
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - alertname = InfoInhibitor
                target_matchers:
                  - severity = info
                equal:
                  - namespace
              - target_matchers:
                  - alertname = InfoInhibitor
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  # title/message are deliberately left at their built-in defaults.
                  # The chart runs this config through Helm's tpl, so any Go template
                  # braces here would be evaluated at render time and break the sync.
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
        grafana:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          plugins:
            - marcusolsson-treemap-panel
          serviceMonitor:
            enabled: false
          deploymentStrategy:
            type: Recreate
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          grafana.ini:
            auth:
              anonymous:
                enabled: true
                org_role: Viewer
            auth.anonymous:
              enabled: true
              org_role: Viewer
          persistence:
            enabled: true
            size: 2Gi
            storageClassName: longhorn
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
            - name: Sump Pump Archive
              uid: sump-pump-archive
              type: prometheus
              url: http://prometheus-sump-pump.monitoring.svc.cluster.local:9090
              access: proxy
              isDefault: false
            - name: Pod History Archive
              uid: pod-history-archive
              type: prometheus
              url: http://prometheus-pod-history.monitoring.svc.cluster.local:9090
              access: proxy
              isDefault: false
          resources:
            requests:
              memory: 1024Mi
            limits:
              memory: 1536Mi
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              annotations:
                grafana_folder: Less Used
              provider:
                foldersFromFilesStructure: true
                allowUiUpdates: true
          ingress:
            enabled: false
        prometheus:
          prometheusSpec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            enableAdminAPI: true
            retention: 30d
            retentionSize: 32GB
            scrapeInterval: "60s"
            evaluationInterval: "60s"
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 1500Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 35Gi
          ingress:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
