apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cluster
      interval: 5m
      rules:
        # A namespace normally terminates in seconds. Stuck means a finalizer nobody
        # will remove, or the garbage collector wedged on a type discovery advertises
        # but the API server won't serve - which stops every namespace deletion, not just this one.
        - alert: NamespaceStuckTerminating
          expr: |
            kube_namespace_status_phase{phase="Terminating"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "Namespace {{ $labels.namespace }} has been Terminating for 15m"
            description: >-
              Check for a stuck finalizer with
              kubectl get namespace {{ $labels.namespace }} -o json | jq .spec.finalizers
              and for a CRD the API server cannot serve with
              kubectl get crd -o json | jq -r '.items[] | select([.spec.versions[].served] | index(true) | not) | .metadata.name'.
              If a namespace unrelated to any recent work is also stuck, suspect
              the garbage collector rather than the namespace.

        # MemAvailable, not MemFree. Linux parks reclaimable page cache outside free,
        # so free reads near zero on a node with plenty of headroom.
        - alert: NodeMemoryPressure
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "{{ $labels.instance }} is at {{ $value | printf \"%.0f\" }}% memory"
            description: >-
              Find the heaviest pods with `k top pods -A --sort-by=memory` and the
              heaviest host processes with `ssh pi@<node> "ps -eo pid,comm,rss --sort=-rss | head"`.
              On ctrl-1 the k3s server process itself is normally the largest single
              consumer, so compare against its usual size before blaming a workload.

        # Pi 5 soft-throttles around 80C; 65C leaves headroom while still catching a trend early.
        - alert: NodeOvertemp
          expr: |
            node_hwmon_temp_celsius{chip="thermal_thermal_zone0", sensor="temp0"} > 65
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/homelab-mbp/homelab"
            summary: "{{ $labels.instance }} CPU temp is {{ $value | printf \"%.1f\" }}C"
            description: >-
              Check airflow and case fans on the node. Confirm current temp with
              `curl -s http://{{ $labels.instance }}/metrics | grep thermal_zone0`.
