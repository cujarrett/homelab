apiVersion: v1
kind: ConfigMap
metadata:
  name: web-traffic-kiosk
  namespace: monitoring
  annotations:
    grafana_folder: Kiosk
  labels:
    grafana_dashboard: "1"
data:
  web-traffic-kiosk.json: |-
    {
      "title": "Web Traffic - Kiosk",
      "uid": "web-traffic-kiosk",
      "editable": true,
      "graphTooltip": 0,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": { "hidden": true },
      "refresh": "5m",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "blog",
          "gridPos": { "x": 0, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "blue", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(blog-ghost.*)\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 2, "type": "stat", "title": "mattjarrett.dev",
          "gridPos": { "x": 3, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "purple", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(mattjarrett-dev-mattjarrett-dev.*|web-mattjarrett-dev.*)\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 4, "type": "stat", "title": "myvinyl",
          "gridPos": { "x": 6, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "super-light-blue", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(my-vinyl-my-vinyl.*)\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 5, "type": "stat", "title": "jspollock",
          "gridPos": { "x": 9, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "light-purple", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(js-pollock-js-pollock.*)\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 7, "type": "stat", "title": "launchpad",
          "gridPos": { "x": 12, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "dark-blue", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(launchpad-launchpad.*)\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 8, "type": "stat", "title": "gotemplate",
          "gridPos": { "x": 15, "y": 0, "w": 3, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "fixedColor": "text", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(vscode_extension_installs{extension=\"gotemplate-yaml\"})", "legendFormat": "installs", "instant": true, "refId": "A" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "Requests / hr",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "blog" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "mattjarrett.dev" }, "properties": [{ "id": "color", "value": { "fixedColor": "purple", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "myvinyl" }, "properties": [{ "id": "color", "value": { "fixedColor": "super-light-blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "jspollock" }, "properties": [{ "id": "color", "value": { "fixedColor": "light-purple", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "launchpad" }, "properties": [{ "id": "color", "value": { "fixedColor": "dark-blue", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(blog-ghost.*)\"}[1h]))", "legendFormat": "blog", "refId": "A" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(mattjarrett-dev-mattjarrett-dev.*|web-mattjarrett-dev.*)\"}[1h]))", "legendFormat": "mattjarrett.dev", "refId": "B" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(my-vinyl-my-vinyl.*)\"}[1h]))", "legendFormat": "myvinyl", "refId": "D" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(js-pollock-js-pollock.*)\"}[1h]))", "legendFormat": "jspollock", "refId": "E" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"(.*-svc-)?(launchpad-launchpad.*)\"}[1h]))", "legendFormat": "launchpad", "refId": "F" }
          ]
        }
      ]
    }
