          "targets": [{"expr": "sum(sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | method=\"GET\" | status<400 | host!~\"demo[0-9]-api.*\" | ua=~\"Mozilla/5\\\\.0 \\\\((iPhone|iPad|Linux; Android|Macintosh|Windows|X11).*\" | ua!~\".*compatible;.*\" | path!~\"(?i).*\\\\.(js|css|png|jpe?g|gif|svg|ico|webp|avif|heic|woff2?|ttf|map|webmanifest|xml|txt|json|php)\" | path!~\"/(api|stats|wp-json|wp-admin|wp-content|wp-includes|ghost|members|content|assets|public)/.*|/feed/?|/healthz|/readyz|/undefined\" [24h])) unless on (visitor) sum by (visitor) (count_over_time({log_type=~\"access|sandbox\"} | json host=\"RequestHost\", path=\"RequestPath\", method=\"RequestMethod\", status=\"DownstreamStatus\", visitor=\"[\\\"request_Cf-Connecting-Ip\\\"]\", city=\"[\\\"request_Cf-Ipcity\\\"]\", region=\"[\\\"request_Cf-Region-Code\\\"]\", lat=\"[\\\"request_Cf-Iplatitude\\\"]\", lon=\"[\\\"request_Cf-Iplongitude\\\"]\", ua=\"[\\\"request_User-Agent\\\"]\" | host!~\"oidc.*|argocd-webhook.*\" | (path=~\"(?i).*(/\\\\.[a-z_]|\\\\.(sql|bak|old|swp|save|tfstate|tfvars)|phpinfo|wp-config|xmlrpc\\\\.php|wlwmanifest).*\" or (host!~\"(kentjarrett|mattjarrett)\\\\.com\" and path=~\"(?i).*(\\\\.php|/wp-).*\")) | path!~\"/\\\\.(well-known|ghost)/.*\" [24h]))) or vector(0)", "legendFormat": "Page views 24h", "refId": "A", "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"}, "queryType": "instant"}]
        },
        {
          "id": 3, "type": "stat", "title": "",
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
