apiVersion: v1
kind: ConfigMap
metadata:
  name: web-traffic-kiosk
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  web-traffic-kiosk.json: |-
    {
      "title": "Web Traffic — Kiosk",
      "uid": "web-traffic-kiosk",
      "editable": true,
      "graphTooltip": 0,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": { "hidden": true },
      "refresh": "5m",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "blog.mattjarrett.dev",
          "description": "Requests in the last 24 hours",
          "gridPos": { "x": 0, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "fixedColor": "blue", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"blog-ghost.*@kubernetes\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 2, "type": "stat", "title": "mattjarrett.dev",
          "description": "Requests in the last 24 hours",
          "gridPos": { "x": 3, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "fixedColor": "green", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"mattjarrett-dev-mattjarrett-dev.*@kubernetes|web-mattjarrett-dev.*@kubernetes\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 3, "type": "stat", "title": "mattjarrett.com",
          "description": "Requests in the last 24 hours",
          "gridPos": { "x": 6, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "fixedColor": "orange", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"mattjarrett-com-mattjarrett-com-wordpress.*@kubernetes\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 4, "type": "stat", "title": "myvinyl.mattjarrett.dev",
          "description": "Requests in the last 24 hours",
          "gridPos": { "x": 9, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "fixedColor": "purple", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"my-vinyl-my-vinyl.*@kubernetes\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 5, "type": "stat", "title": "jspollock.mattjarrett.dev",
          "description": "Requests in the last 24 hours",
          "gridPos": { "x": 12, "y": 0, "w": 3, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "fixedColor": "yellow", "mode": "fixed" } } },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"js-pollock-js-pollock.*@kubernetes\"}[24h]))", "legendFormat": "requests 24h", "instant": true, "refId": "A" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "Requests / hr — All Sites",
          "description": "Requests per 1-hour window for all public sites.",
          "gridPos": { "x": 15, "y": 0, "w": 9, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "blog" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "mattjarrett.dev" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "mattjarrett.com" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "myvinyl" }, "properties": [{ "id": "color", "value": { "fixedColor": "purple", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "jspollock" }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"blog-ghost.*@kubernetes\"}[1h]))", "legendFormat": "blog", "refId": "A" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"mattjarrett-dev-mattjarrett-dev.*@kubernetes|web-mattjarrett-dev.*@kubernetes\"}[1h]))", "legendFormat": "mattjarrett.dev", "refId": "B" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"mattjarrett-com-mattjarrett-com-wordpress.*@kubernetes\"}[1h]))", "legendFormat": "mattjarrett.com", "refId": "C" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"my-vinyl-my-vinyl.*@kubernetes\"}[1h]))", "legendFormat": "myvinyl", "refId": "D" },
            { "expr": "sum(increase(traefik_service_requests_total{exported_service=~\"js-pollock-js-pollock.*@kubernetes\"}[1h]))", "legendFormat": "jspollock", "refId": "E" }
          ]
        }
      ]
    }
