          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center", "text": {"titleSize": 16, "valueSize": 60}},
          "fieldConfig": {"defaults": {"displayName": "VS Code installs", "unit": "short", "decimals": 0, "noValue": "0", "color": {"fixedColor": "text", "mode": "fixed"}}},
          "targets": [{"expr": "sum(vscode_extension_installs{extension=\"gotemplate-yaml\"})", "legendFormat": "VS Code installs", "refId": "A", "instant": true}]
        },
        {
          "id": 6, "type": "timeseries", "title": "Requests / hr",
          "gridPos": {"x": 15, "y": 0, "w": 9, "h": 5},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth", "showPoints": "never"}}, "overrides": [{"matcher": {"id": "byName", "options": "blog"}, "properties": [{"id": "color", "value": {"fixedColor": "blue", "mode": "fixed"}}]}, {"matcher": {"id": "byName", "options": "mattjarrett.dev"}, "properties": [{"id": "color", "value": {"fixedColor": "purple", "mode": "fixed"}}]}, {"matcher": {"id": "byName", "options": "myvinyl"}, "properties": [{"id": "color", "value": {"fixedColor": "super-light-blue", "mode": "fixed"}}]}, {"matcher": {"id": "byName", "options": "jspollock"}, "properties": [{"id": "color", "value": {"fixedColor": "light-purple", "mode": "fixed"}}]}, {"matcher": {"id": "byName", "options": "launchpad"}, "properties": [{"id": "color", "value": {"fixedColor": "dark-blue", "mode": "fixed"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
