apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-namespace-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  namespace-overview.json: |-
    {
      "title": "Namespace Overview",
      "uid": "homelab-namespace-overview",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "refresh": "30s",
      "schemaVersion": 38,
      "version": 1,
      "links": [],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(kube_pod_info, namespace)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "current": {},
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pod Count",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 0, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "count(kube_pod_info{namespace=\"$namespace\"})", "instant": true, "legendFormat": "Pods", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU Usage",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short", "decimals": 2, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\"}[5m]))", "instant": true, "legendFormat": "CPU cores", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Memory Usage",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "decimals": 1, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\"})", "instant": true, "legendFormat": "Memory", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Request Rate",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps", "decimals": 2, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-.*\"}[5m])) or vector(0)", "instant": true, "legendFormat": "req/s", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error Rate (5xx)",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "decimals": 2, "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 }]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-.*\",code=~\"5..\"}[5m])) or vector(0)) / (sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-.*\"}[5m])) or vector(1))",
              "instant": true,
              "legendFormat": "Error %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "p95 Latency",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none",
            "justifyMode": "center", "orientation": "auto", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s", "decimals": 3, "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-.*\"}[5m])) by (le)) or vector(0)",
              "instant": true,
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Request Rate",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-.*\"}[5m])) by (code)",
              "legendFormat": "{{code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Latency (p50 / p95 / p99)",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-.*\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-.*\"}[5m])) by (le))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-.*\"}[5m])) by (le))", "legendFormat": "p99", "refId": "C" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU & Memory Usage",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [
            { "matcher": { "id": "byName", "options": "Memory" }, "properties": [{ "id": "unit", "value": "bytes" }] }
          ] },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "CPU cores", "refId": "A" },
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\"})", "legendFormat": "Memory", "refId": "B" }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "PVC Usage",
          "description": "Persistent volume claims in this namespace, used vs capacity.",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "PVC", "desc": false }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "unit": "bytes",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "PVC" }, "properties": [{ "id": "unit", "value": "short" }] }
            ]
          },
          "targets": [
            { "expr": "kubelet_volume_stats_used_bytes{namespace=\"$namespace\"}", "instant": true, "format": "table", "legendFormat": "", "refId": "A" },
            { "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"$namespace\"}", "instant": true, "format": "table", "legendFormat": "", "refId": "B" }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["persistentvolumeclaim", "Value #A", "Value #B"] } } },
            { "id": "organize", "options": { "renameByName": { "persistentvolumeclaim": "PVC", "Value #A": "Used", "Value #B": "Capacity" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "PVC", "desc": false }] } }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Pods in Namespace",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "Pod", "desc": false }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "auto" }, "filterable": true },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Running":   { "color": "green",  "index": 0 },
                          "Succeeded": { "color": "blue",   "index": 1 },
                          "Pending":   { "color": "yellow", "index": 2 },
                          "Failed":    { "color": "red",    "index": 3 },
                          "Unknown":   { "color": "orange", "index": 4 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            { "expr": "kube_pod_status_phase{namespace=\"$namespace\"} == 1", "instant": true, "format": "table", "legendFormat": "", "refId": "A" }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["node", "pod", "phase"] } } },
            { "id": "organize", "options": { "renameByName": { "node": "Node", "pod": "Pod", "phase": "Phase" } } },
            { "id": "sortBy", "options": { "fields": [{ "displayName": "Pod", "desc": false }] } }
          ]
        }
      ]
    }
