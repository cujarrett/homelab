# The store and its only consumer, together. Split them out when something else needs the store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-eso-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-eso-creds
            namespace: external-secrets
            key: secret-access-key
---
# Grafana admin login. Read only at pod start — a rotation needs a Grafana restart to take effect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: homelab/cluster
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: homelab/cluster
        property: grafana_admin_password
