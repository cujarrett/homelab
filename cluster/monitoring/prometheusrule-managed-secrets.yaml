apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: managed-secrets
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: managed-secrets
      interval: 1m
      rules:
        # The sidecar turns ready only once every ManagedSecret it binds has a value.
        # The app container starts after it, so a pod stuck here never serves.
        - alert: ManagedSecretWaiting
          expr: |
            kube_pod_init_container_status_running{container="workload-identity-sidecar"} == 1
            and on(namespace, pod)
            kube_pod_init_container_status_ready{container="workload-identity-sidecar"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is waiting on a ManagedSecret value"
            description: >-
              The secret has no value, or its value is unreadable.
              Check with `kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} -c workload-identity-sidecar`.
              See docs/postmortems/postmortem-managed-secret-placeholder.md.
