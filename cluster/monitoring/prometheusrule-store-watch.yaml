apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: store-watch
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: store-watch
      interval: 1m
      rules:
        # max_over_time rides over a single failed scrape.
        - alert: StoreItemInStock
          expr: |
            max by (sku, variant) (max_over_time(shopify_variant_available{sku="MS-A292US"}[15m])) == 1
          labels:
            audience: workload
          annotations:
            dashboard_url: "https://store.minisforum.com/products/minisforum-ms-a2-workstation"
            summary: "{{ $labels.variant }} is in stock"
            description: >-
              {{ with printf "max(max_over_time(shopify_variant_price_cents{sku=\"%s\"}[15m])) / 100" $labels.sku | query }}Price ${{ . | first | value | printf "%.0f" }} each. {{ end }}Homelab 2.0 needs four. Check the price against the plan in https://github.com/cujarrett/homelab/issues/135
        # Without the feed, StoreItemInStock can never fire.
        - alert: StoreWatchMissing
          expr: absent(max_over_time(shopify_variant_available[3h]))
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The Minisforum store has not been scraped for 3 hours"
            description: >-
              json-exporter fetches the MS-A2 product data from the store.
              Check the minisforum-ms-a2 target in Prometheus and the json-exporter logs.
