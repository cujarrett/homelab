apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sump-pump
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: sump-pump
      interval: 5m
      rules:
        # sump_pump_running is 0 or 1, so its hourly average is the fraction of the
        # hour spent running - times 60 reads straight off as minutes per hour.
        # Normal is ~6. Duty cycle is the primary "working hard" signal because it
        # is the one tied to motor damage. Cycle count tracks it so closely that a
        # separate rate alert only double-notified the same rain.
        #
        # Scoped to the consumer. Both apps export this gauge, but only the
        # consumer is scraped every 10s - the bridge defaults to 60s, which cannot
        # see an eleven second run and reads high enough to fire on its own.
        - alert: SumpPumpRunningLongHours
          expr: |
            max(avg_over_time(sump_pump_running{job="sump-pump-consumer"}[1h])) * 60 > 12
          for: 10m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Sump pump ran {{ $value | printf \"%.0f\" }} minutes this hour, normal is ~6"
            description: >-
              Water is coming in faster than usual, which is what rain looks like.
              The resolved notification marks the return to normal.

        - alert: SumpPumpRunningNearlyConstantly
          expr: |
            max(avg_over_time(sump_pump_running{job="sump-pump-consumer"}[1h])) * 60 > 15
          for: 10m
          labels:
            severity: critical
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Sump pump ran {{ $value | printf \"%.0f\" }} minutes of the last hour"
            description: >-
              At this duty cycle there is little idle time to cool between runs.
              Sustained, that is how the motor burns out. Suspect a stuck float, or
              a discharge line blocked or frozen.

        # Duty cycle divided by cycle count is the average seconds per run. It
        # separates the two causes that a duty cycle number alone cannot - more
        # water in, versus each run moving less of it. Rising at a normal cycle
        # count is impeller wear or a partly blocked discharge, and it shows up
        # here well before total runtime crosses a threshold.
        #
        # Normal is ~11.5s. Across the archive the busiest hours ran longest, so
        # 30 sits about a third above the worst storm seen rather than just above
        # p99. The run count guard is load bearing - every reading over 23s in the
        # archive came from a near idle window where the denominator was tiny
        # enough to make the ratio meaningless.
        - alert: SumpPumpRunsGettingLonger
          expr: |
            (
              (max(avg_over_time(sump_pump_running{job="sump-pump-consumer"}[6h])) * 21600)
              /
              max(increase(sump_pump_runs_total{job="sump-pump-consumer"}[6h]))
            ) > 30
            and
            max(increase(sump_pump_runs_total{job="sump-pump-consumer"}[6h])) > 60
          for: 30m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Sump pump runs averaging {{ $value | printf \"%.0f\" }}s, normal is ~12s"
            description: >-
              Each cycle is taking far longer than it should to clear the pit. The
              pump is moving less water per run than it used to - suspect a worn
              impeller, or a discharge line partly blocked or frozen.

        # Idle is normal - 20 of 104 six-hour windows were near zero. Rain is what
        # makes idle suspicious.
        - alert: SumpPumpIdleDespiteRain
          expr: |
            max(max_over_time(weather_precipitation_mm[6h])) > 2
            and
            max(increase(sump_pump_runs_total[6h])) < 5
          for: 30m
          labels:
            severity: critical
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Rain in the last 6h but the sump pump barely ran"
            description: >-
              Measurable rain with almost no pump activity points at a dead pump, a
              stuck float, or a sensor that has frozen at a fixed reading. This is
              the failure that a runtime alert cannot see.

        # Dry-weather backstop for a sensor stuck at zero. One 48h window in the
        # archive was this quiet, so expect roughly monthly.
        - alert: SumpPumpIdleTooLong
          expr: |
            max(increase(sump_pump_runs_total[24h])) < 10
          for: 1h
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Sump pump has run fewer than 10 times in 24 hours"
            description: >-
              Normal even in dry weather, but only just - this was true for a single
              24 window across the whole archive. Worth confirming the pit is
              actually dry rather than the sensor being stuck.

        # absent(sump_pump_running) cannot see this failure: the exporters stay up
        # and keep publishing 0 with no device behind them, so the series is never
        # absent. The bridge reconciles the meter's config on a timer instead, and
        # a reconcile succeeding means the meter answered - that is the signal.
        #
        # Deliberately not based on webhook arrival rate. The meter only sends on
        # change, so an idle pump legitimately goes quiet for long stretches, and
        # any attempt to force a steady heartbeat throttles the events that make
        # a twelve second run measurable.
        - alert: SumpPumpNotReporting
          expr: |
            max(shelly_webhook_configured) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            dashboard_url: "https://grafana.local.lab/d/sump-pump/sump-pump"
            summary: "Sump pump power meter has been unreachable for 10 minutes"
            description: >-
              Every other sump pump alert reads healthy when the feed is dead, so
              absence needs its own alert. Readings may still be arriving for now,
              but nothing is maintaining the device config, so the next reboot
              would stop them silently instead of self-healing.
