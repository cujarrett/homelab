apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-entra
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  entra-workload-identity.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Entra Identities",
          "description": "Apis holding an Entra app registration. Identity only - it grants nothing on its own.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(platform_managed_ready{kind=\"EntraApplication\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Roles Offered",
          "description": "App roles declared across all Apis. A role can exist and be held by nobody.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(platform_managed_ready{kind=\"EntraAppRole\"}) or vector(0)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Grants In Force",
          "description": "Role assignments actually granting a caller something.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(platform_managed_ready{kind=\"EntraRoleAssignment\"}) or vector(0)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Entra Objects Not Ready",
          "description": "Anything Entra that is not Ready. A grant is red for its first ~30s by design while the role replicates to its service principal - sustained red is real.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(platform_managed_ready{kind=~\"EntraApplication|EntraServicePrincipal|EntraFederatedCredential|EntraAppRole|EntraRoleAssignment\"} == 0) or vector(0)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "id": 4
        },
        {
          "type": "timeseries",
          "title": "Entra Object Readiness",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Ready state per Entra object. Dips at creation are the replication lag; a flat zero is a real failure.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stepAfter": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "platform_managed_ready{kind=~\"EntraApplication|EntraServicePrincipal|EntraFederatedCredential|EntraAppRole|EntraRoleAssignment\"}",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{kind}} \u00b7 {{name}}"
            }
          ],
          "id": 5
        },
        {
          "type": "timeseries",
          "title": "Time To Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "How long each Entra object took to become Ready. RoleAssignment is expected to be the slow one.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "points",
                "pointSize": 7,
                "lineWidth": 0,
                "fillOpacity": 0,
                "showPoints": "always"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "platform_managed_time_to_ready_seconds_instance{kind=~\"EntraApplication|EntraServicePrincipal|EntraFederatedCredential|EntraAppRole|EntraRoleAssignment\"}",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{kind}} \u00b7 {{name}}"
            }
          ],
          "id": 6
        },
        {
          "type": "timeseries",
          "title": "Role Checks By Outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Decisions made by app code reading the roles claim, not by the mesh. Refused is not an error - it is a caller that holds a valid identity and not this role.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "allowed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "refused"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (outcome) (rate(demo_api_entra_decisions_total[5m]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{outcome}}"
            }
          ],
          "id": 7
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "platform",
        "entra"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Entra Workload Identity",
      "uid": "entra-workload-identity",
      "version": 1,
      "weekStart": ""
    }
