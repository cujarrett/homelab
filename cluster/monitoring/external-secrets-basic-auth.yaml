# One ExternalSecret per namespace since Traefik's basicAuth middleware reads
# a Secret in its own namespace. Without this a rebuilt cluster loses these
# creds. Value is an htpasswd line - htpasswd -nbB admin '<password>'.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: prometheus-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: homelab/cluster
        property: prometheus_basic_auth_htpasswd
