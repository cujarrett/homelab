# The three admin UIs with no authentication of their own — Longhorn, Prometheus
# and Hubble — sit behind a Traefik basicAuth middleware. Those middlewares read a
# Secret in their own namespace, so there is one ExternalSecret per namespace even
# though all three read different properties of the same AWS secret.
#
# Without these the credentials exist only in the cluster and a password manager,
# and a rebuilt cluster comes back with the middlewares pointing at Secrets that
# do not exist. Properties live on the existing homelab/cluster secret, so this
# adds no AWS cost.
#
# Value format is an htpasswd line, which is what Traefik's basicAuth expects:
#   htpasswd -nbB admin '<password>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: prometheus-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: homelab/cluster
        property: prometheus_basic_auth_htpasswd
