apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: github
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: github
      interval: 5m
      rules:
        # A bot opening PRs in the last 30 days is how a repo using Renovate is spotted.
        # Repos left out on purpose
        # - homelab: Renovate merges with ignoreTests, so there is no check to require
        # - homelab-workspaces: no CI runs on its PRs
        # - js-to-go, learning-kubernetes: learning repos with no CI
        - alert: RenovateRepoCannotAutoMerge
          expr: |
            (
              github_exporter_repo_allow_auto_merge{repo!~"homelab|homelab-workspaces|js-to-go|learning-kubernetes"} == 0
              or
              github_exporter_repo_required_checks{repo!~"homelab|homelab-workspaces|js-to-go|learning-kubernetes"} == 0
            )
            and on (repo)
            sum by (repo) (github_exporter_pr_opened{author="bot", window="30d"}) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.repo }} gets bot PRs but GitHub cannot auto-merge them"
            description: |-
              Run both, if the repo's CI job is named test (else swap in its name).
              gh api -X PATCH repos/cujarrett/{{ $labels.repo }} -F allow_auto_merge=true
              echo '{"required_status_checks":{"strict":false,"contexts":["test"]},"enforce_admins":false,"required_pull_request_reviews":null,"restrictions":null}' | gh api -X PUT repos/cujarrett/{{ $labels.repo }}/branches/main/protection --input -
              Without both, Renovate merges hours late, or without waiting on CI.
        # The alerts above and below read settings gauges that go missing, not zero, when the token loses access.
        - alert: GitHubExporterCannotSeeSettings
          expr: count(github_exporter_repo_settings_visible == 0) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "github-exporter cannot read settings for {{ $value }} repos"
            description: >-
              The exporter's fine-grained token needs Administration read on all
              repositories. Until it has it, alerts on auto-merge and Dependabot alerts
              stay silent for those repos.
        # Renovate's security fast path reads Dependabot alerts. With them off, a fix waits the full release age.
        - alert: RenovateRepoVulnerabilityAlertsOff
          expr: |
            github_exporter_repo_vulnerability_alerts == 0
            and on (repo)
            sum by (repo) (github_exporter_pr_opened{author="bot", window="30d"}) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.repo }} gets Renovate PRs but has Dependabot alerts off"
            description: >-
              Run gh api -X PUT repos/cujarrett/{{ $labels.repo }}/vulnerability-alerts.
              Without alerts, Renovate cannot fast-track security fixes in this repo.
        # An errored update never becomes a PR, so it is invisible everywhere except the dashboard issue.
        - alert: RenovateUpdateErrored
          expr: github_exporter_renovate_errored > 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.repo }} has {{ $value }} Renovate update that keeps failing"
            description: >-
              Open the repo's Dependency Dashboard issue and the Mend log it links to find
              why the branch fails to build. Renovate retries each run, so 6h means it
              is not clearing on its own.
        # Blocked means a required check failed or never reported.
        # A check renamed in CI but not in branch protection never reports, so the PR waits forever.
        - alert: AutoMergeBlocked
          expr: github_exporter_pr_open_blocked > 0
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.repo }} has {{ $value }} PR with auto-merge armed that GitHub will not merge"
            description: >-
              Open the PR's checks. A failed check needs a fix or a re-run. A required
              check stuck at "Expected" means branch protection names a job the workflow
              no longer has, so update the required checks to match.
        # The newest finished run on main decides it, so a passing re-run clears the alert.
        # Covers scheduled checks too, such as platform-connections-demo's hourly pin-check.
        - alert: WorkflowFailingOnMain
          expr: github_exporter_workflow_latest_failed == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.repo }}'s {{ $labels.workflow }} workflow is failing on main"
            description: >-
              Open the repo's Actions tab and read the latest {{ $labels.workflow }} run.
              For pin-check, repin the failing blocks in spa/src/app/cases.ts at the
              current homelab commit, since the page explains code main no longer runs.
        # GitHub never 401s a valid token, so one is enough to alert on.
        - alert: LaunchpadGitHubTokenRejected
          expr: increase(launchpad_github_auth_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GitHub is rejecting launchpad-api's token"
            description: >-
              The homelab-workspaces-launchpad token expired or was revoked, so Launchpad
              cannot list workspaces or create sandboxes. Regenerate it on GitHub and run
              ./scripts/github-token-rotate/github-token-rotate.sh.
