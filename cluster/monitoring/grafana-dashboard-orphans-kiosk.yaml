apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-orphans-kiosk
  namespace: monitoring
  annotations:
    grafana_folder: Kiosk
  labels:
    grafana_dashboard: "1"
data:
  orphans-kiosk.json: |-
    {
      "title": "Orphans - Kiosk",
      "uid": "orphans-kiosk",
      "editable": true,
      "graphTooltip": 0,
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": { "hidden": true },
      "refresh": "5m",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 5},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center", "text": {"titleSize": 16, "valueSize": 80}},
          "fieldConfig": {"defaults": {"displayName": "Released PVs", "unit": "short", "decimals": 0, "noValue": "0", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}},
          "targets": [{"expr": "sum(kube_persistentvolume_status_phase{phase=\"Released\"}) or vector(0)", "legendFormat": "Released PVs", "refId": "A", "instant": true}]
        },
        {
          "id": 2, "type": "stat", "title": "",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 5},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center", "text": {"titleSize": 16, "valueSize": 80}},
          "fieldConfig": {"defaults": {"displayName": "Failed PVs", "unit": "short", "decimals": 0, "noValue": "0", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"expr": "sum(kube_persistentvolume_status_phase{phase=\"Failed\"}) or vector(0)", "legendFormat": "Failed PVs", "refId": "A", "instant": true}]
        },
        {
          "id": 3, "type": "stat", "title": "",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 5},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center", "text": {"titleSize": 16, "valueSize": 80}},
          "fieldConfig": {"defaults": {"displayName": "Terminating namespaces", "unit": "short", "decimals": 0, "noValue": "0", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"expr": "sum(kube_namespace_status_phase{phase=\"Terminating\"}) or vector(0)", "legendFormat": "Terminating namespaces", "refId": "A", "instant": true}]
        },
        {
          "id": 4, "type": "stat", "title": "",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 5},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "justifyMode": "center", "text": {"titleSize": 16, "valueSize": 80}},
          "fieldConfig": {"defaults": {"displayName": "Failed pods", "unit": "short", "decimals": 0, "noValue": "0", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)", "legendFormat": "Failed pods", "refId": "A", "instant": true}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Container restarts / hr",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 1, "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 15, "lineInterpolation": "smooth", "showPoints": "never"}}, "overrides": [{"matcher": {"id": "byName", "options": "restarts/hr"}, "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": null, "showLegend": false}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "legendFormat": "restarts/hr", "refId": "A"}]
        }
      ]
    }
