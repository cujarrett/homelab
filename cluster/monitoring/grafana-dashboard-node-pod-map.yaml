        { "id": 9, "type": "bargauge", "title": "ctrl-1  ·  Pods by Memory",
          "description": "Each bar = one pod. Bar length = memory working set. Color = saturation (green → red).",
          "gridPos": { "x": 0, "y": 14, "w": 6, "h": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 67108864 },
                { "color": "orange", "value": 268435456 },
                { "color": "red", "value": 536870912 }
              ]},
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "options": {
