apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-pod-map
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-pod-map.json: |-
    {
      "title": "Node Pod Map",
      "uid": "node-pod-map",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "refresh": "30s",
      "schemaVersion": 38,
      "version": 1,
      "links": [],
      "panels": [

        { "id": 1, "type": "stat", "title": "ctrl-1", "gridPos": { "x": 0, "y": 0, "w": 6, "h": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [] },
          "targets": [
            { "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=\"192.168.10.100:9100\",mode=\"idle\"}[2m])) * 100)", "legendFormat": "CPU", "refId": "A", "instant": true },
            { "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"192.168.10.100:9100\"} / node_memory_MemTotal_bytes{instance=\"192.168.10.100:9100\"}) * 100", "legendFormat": "Mem", "refId": "B", "instant": true },
            { "expr": "count(kube_pod_info{node=\"ctrl-1\"})", "legendFormat": "Pods", "refId": "C", "instant": true }
          ]
        },

        { "id": 2, "type": "stat", "title": "work-1", "gridPos": { "x": 6, "y": 0, "w": 6, "h": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Pods" }, "properties": [{ "id": "unit", "value": "short" }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 15 }, { "color": "red", "value": 25 }] } }] }
          ] },
          "targets": [
            { "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=\"192.168.10.101:9100\",mode=\"idle\"}[2m])) * 100)", "legendFormat": "CPU", "refId": "A", "instant": true },
            { "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"192.168.10.101:9100\"} / node_memory_MemTotal_bytes{instance=\"192.168.10.101:9100\"}) * 100", "legendFormat": "Mem", "refId": "B", "instant": true },
            { "expr": "count(kube_pod_info{node=\"work-1\"})", "legendFormat": "Pods", "refId": "C", "instant": true }
          ]
        },

        { "id": 3, "type": "stat", "title": "work-2", "gridPos": { "x": 12, "y": 0, "w": 6, "h": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Pods" }, "properties": [{ "id": "unit", "value": "short" }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 15 }, { "color": "red", "value": 25 }] } }] }
          ] },
          "targets": [
            { "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=\"192.168.10.102:9100\",mode=\"idle\"}[2m])) * 100)", "legendFormat": "CPU", "refId": "A", "instant": true },
            { "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"192.168.10.102:9100\"} / node_memory_MemTotal_bytes{instance=\"192.168.10.102:9100\"}) * 100", "legendFormat": "Mem", "refId": "B", "instant": true },
            { "expr": "count(kube_pod_info{node=\"work-2\"})", "legendFormat": "Pods", "refId": "C", "instant": true }
          ]
        },

        { "id": 4, "type": "stat", "title": "work-3", "gridPos": { "x": 18, "y": 0, "w": 6, "h": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Pods" }, "properties": [{ "id": "unit", "value": "short" }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 15 }, { "color": "red", "value": 25 }] } }] }
          ] },
          "targets": [
            { "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=\"192.168.10.103:9100\",mode=\"idle\"}[2m])) * 100)", "legendFormat": "CPU", "refId": "A", "instant": true },
            { "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"192.168.10.103:9100\"} / node_memory_MemTotal_bytes{instance=\"192.168.10.103:9100\"}) * 100", "legendFormat": "Mem", "refId": "B", "instant": true },
            { "expr": "count(kube_pod_info{node=\"work-3\"})", "legendFormat": "Pods", "refId": "C", "instant": true }
          ]
        },

        { "id": 5, "type": "bargauge", "title": "ctrl-1  ·  Pods by CPU",
          "description": "Each bar = one pod. Bar length = CPU usage. Color = saturation (green → red).",
          "gridPos": { "x": 0, "y": 3, "w": 6, "h": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.05 },
                { "color": "orange", "value": 0.15 },
                { "color": "red", "value": 0.4 }
              ]},
              "unit": "short", "decimals": 3,
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10, "minVizWidth": 0,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true, "valueMode": "color"
          },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sort_desc(sum by(pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\"}[5m]) and on(pod) kube_pod_info{node=\"ctrl-1\"}))",
              "legendFormat": "{{pod}}", "refId": "A", "instant": true }
          ]
        },

        { "id": 6, "type": "bargauge", "title": "work-1  ·  Pods by CPU",
          "description": "Each bar = one pod. Bar length = CPU usage. Color = saturation (green → red).",
