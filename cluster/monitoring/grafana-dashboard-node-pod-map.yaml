        { "id": 13, "type": "timeseries", "title": "Network Traffic — bytes/s per node",
          "description": "Total inbound + outbound network throughput per node. Color = node.",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "lineWidth": 2, "fillOpacity": 12, "lineInterpolation": "smooth", "spanNulls": false },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(node_network_receive_bytes_total{instance=\"192.168.10.100:9100\",device!=\"lo\"}[2m])) + sum(rate(node_network_transmit_bytes_total{instance=\"192.168.10.100:9100\",device!=\"lo\"}[2m]))",
              "legendFormat": "ctrl-1", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "prometheus" },
