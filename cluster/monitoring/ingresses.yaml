apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: local-lab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - grafana.local.lab
      secretName: grafana-tls-cert
  rules:
    - host: grafana.local.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "monitoring-prometheus-basic-auth@kubernetescrd"
    cert-manager.io/cluster-issuer: local-lab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - prometheus.local.lab
      secretName: prometheus-tls-cert
  rules:
    - host: prometheus.local.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
---
# --- basicAuth Middleware ---
# No native authentication, so the control sits at the proxy. Credentials live in
# the hand-created `prometheus-basic-auth` Secret (key `users`, bcrypt htpasswd line) - never in Git.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: prometheus-basic-auth
    # Strip the Authorization header once Traefik has checked it. Without this
    # Traefik forwards the credential on to a backend that has no use for it.
    removeHeader: true
