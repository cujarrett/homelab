apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system}
  hostnames: [grafana.local.lab]
  rules:
    - backendRefs:
        - {name: monitoring-grafana, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system}
  hostnames: [prometheus.local.lab]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: prometheus-basic-auth}
      backendRefs:
        - {name: monitoring-kube-prometheus-prometheus, port: 9090}
---
# --- basicAuth Middleware ---
# No native authentication, so the control sits at the proxy. Credentials live in
# `prometheus-basic-auth` (key `users`, bcrypt htpasswd line), rendered by External Secrets.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: prometheus-basic-auth
    # Strip the Authorization header once Traefik has checked it. Without this
    # Traefik forwards the credential on to a backend that has no use for it.
    removeHeader: true
