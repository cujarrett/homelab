# Label the linkerd namespace so trust-manager knows where to write the trust bundle ConfigMap.
# Linkerd's Helm chart creates the namespace, but the label must be present for the Bundle
# target namespaceSelector to match. ArgoCD will merge this with the Helm-created namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
  labels:
    linkerd.io/is-control-plane: "true"
---
# ClusterIssuer backed by the trust anchor Secret in the cert-manager namespace.
# cert-manager uses this to sign the identity issuer certificate below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-identity-issuer
spec:
  ca:
    secretName: linkerd-trust-anchor
---
# Short-lived identity issuer certificate. cert-manager rotates this automatically every ~48h.
# Linkerd uses this to issue workload certificates to all proxies in the mesh.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
spec:
  issuerRef:
    name: linkerd-identity-issuer
    kind: ClusterIssuer
  secretName: linkerd-identity-issuer
  isCA: true
  commonName: identity.linkerd.cluster.local
  duration: 48h0m0s
  renewBefore: 25h0m0s
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
---
# Trust bundle — trust-manager reads both Secrets and writes a ConfigMap into the linkerd
# namespace. The two-source setup allows old and new trust anchors to coexist during rotation
# so all proxies can be restarted without dropping connections.
#
# Bootstrap note: after the first ArgoCD sync, copy the current trust anchor to the
# linkerd-previous-anchor Secret (one-time manual step):
#
#   kubectl get secret -n cert-manager linkerd-trust-anchor -o yaml \
#     | sed -e s/linkerd-trust-anchor/linkerd-previous-anchor/ \
#     | grep -Ev '^\s*(resourceVersion|uid):' \
#     | kubectl apply -f -
#
# The Bundle will be stuck until both Secrets exist.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: linkerd-identity-trust-roots
spec:
  sources:
    - secret:
        name: "linkerd-trust-anchor"
        key: "tls.crt"
    - secret:
        name: "linkerd-previous-anchor"
        key: "tls.crt"
  target:
    configMap:
      key: "ca-bundle.crt"
    namespaceSelector:
      matchLabels:
        linkerd.io/is-control-plane: "true"
