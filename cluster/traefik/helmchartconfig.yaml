apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
      metrics:
        port: 9100
        expose:
          default: true
        protocol: TCP
    service:
      type: ClusterIP
    deployment:
      kind: DaemonSet
      # Sidecar-inject Traefik's own pods only (NOT the kube-system namespace — that would
      # also catch Cilium's hostNetwork DaemonSets, which must never get a sidecar, plus
      # CoreDNS/metrics-server for no benefit). Once meshed, Traefik auto-upgrades to real
      # mTLS when calling other meshed backends, giving it a verifiable SPIFFE identity that
      # can be named in an AuthorizationPolicy ALLOW — the prerequisite for enforce: true on
      # any XApi that still has its own direct Ingress (my-vinyl-api, sump-pump-bridge).
      # Calls to unmeshed destinations (WordPress, cloudflared) are unaffected — Istio only
      # attempts mTLS when both sides are known-meshed, and permissive mode still accepts
      # plaintext from unmeshed peers either way. Enrollment only; not enforcement.
      podAnnotations:
        sidecar.istio.io/inject: "true"
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
