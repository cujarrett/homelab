apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
      metrics:
        port: 9100
        expose:
          default: true
        protocol: TCP
    service:
      type: ClusterIP
    deployment:
      kind: DaemonSet
      # Mesh only Traefik's own pods, not all of kube-system (would also sidecar hostNetwork DaemonSets).
      # Gives Traefik a verifiable identity for AuthorizationPolicy - prerequisite for enforce: true on apps with a direct Ingress.
      podAnnotations:
        sidecar.istio.io/inject: "true"
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
