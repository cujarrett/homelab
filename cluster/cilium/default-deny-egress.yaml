apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress-tenants
spec:
  # Deny world egress for all tenant pods. Platform namespaces are excluded —
  # they need unrestricted egress to pull images, reach cloud APIs, etc.
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - cilium-system
          - spire-server
          - argocd
          - cert-manager
          - monitoring
          - longhorn-system
          - adguard
          - cloudflare
          - nats
          - crossplane-system
          - platform-exporter
          - blog
          - demo-certs
  egressDeny:
    - toEntities:
        - world
