apiVersion: v1
kind: Namespace
metadata:
  name: node-updates
  labels:
    # hostPath mounts fail the baseline profile, even read-only.
    # The pod itself runs as nobody with every capability dropped.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    istio-injection: disabled
