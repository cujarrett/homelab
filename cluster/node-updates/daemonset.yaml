# Reports each node's unattended-upgrades state as Prometheus metrics, so a node
# that stops patching itself shows on the Security dashboard instead of failing quietly.
# Unprivileged: apt-get -s runs as nobody against read-only copies of the host's apt files.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-updates
  namespace: node-updates
spec:
  selector:
    matchLabels:
      app: node-updates
  template:
    metadata:
      labels:
        app: node-updates
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apt-check
          # Same Debian release as the nodes, so apt reads their package lists the same way.
          image: debian:trixie-slim
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              while true; do
                # Simulation only. Every path apt would write points at the pod's emptyDir.
                pending=$(apt-get -s -o Debug::NoLocking=1 \
                  -o Dir::State::status=/host/var/lib/dpkg/status \
                  -o Dir::State::Lists=/host/var/lib/apt/lists \
                  -o Dir::Etc::sourcelist=/host/etc/apt/sources.list \
                  -o Dir::Etc::sourceparts=/host/etc/apt/sources.list.d \
                  -o Dir::Cache=/tmp/apt -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache= \
                  -o Dir::State::extended_states=/tmp/apt/extended_states -o Dir::Log=/tmp/apt \
                  upgrade 2>/dev/null | grep -c '^Inst .*-security')
                reboot=0; [ -f /host/run/reboot-required ] && reboot=1
                stamp=$(stat -c %Y /host/var/lib/apt/periodic/unattended-upgrades-stamp 2>/dev/null || echo 0)
                {
                  echo "# TYPE node_security_updates_pending gauge"
                  echo "node_security_updates_pending{node=\"$NODE\"} $pending"
                  echo "# TYPE node_reboot_required gauge"
                  echo "node_reboot_required{node=\"$NODE\"} $reboot"
                  echo "# TYPE node_unattended_upgrades_last_run_timestamp_seconds gauge"
                  echo "node_unattended_upgrades_last_run_timestamp_seconds{node=\"$NODE\"} $stamp"
                } > /www/metrics.tmp
                mv /www/metrics.tmp /www/metrics
                sleep 900
              done
          volumeMounts:
            - { name: www, mountPath: /www }
            - { name: tmp, mountPath: /tmp }
            - { name: dpkg, mountPath: /host/var/lib/dpkg, readOnly: true }
            - { name: apt-state, mountPath: /host/var/lib/apt, readOnly: true }
            - { name: apt-etc, mountPath: /host/etc/apt, readOnly: true }
            - { name: run, mountPath: /host/run, readOnly: true }
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: metrics
          image: busybox:1.38
          securityContext: *locked
          command: ["httpd", "-f", "-p", "9101", "-h", "/www"]
          ports:
            - name: metrics
              containerPort: 9101
          volumeMounts:
            - { name: www, mountPath: /www, readOnly: true }
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
      volumes:
        - { name: www, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: dpkg, hostPath: { path: /var/lib/dpkg, type: Directory } }
        - { name: apt-state, hostPath: { path: /var/lib/apt, type: Directory } }
        - { name: apt-etc, hostPath: { path: /etc/apt, type: Directory } }
        # reboot-required lives here. Host sockets in /run stay root-only, so nobody cannot use them.
        - { name: run, hostPath: { path: /run, type: Directory } }
