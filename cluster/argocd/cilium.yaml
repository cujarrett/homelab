apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: cluster
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.5
      helm:
        releaseName: cilium
        values: |
          # kube-proxy replacement via eBPF — required for toFQDNs DNS-aware egress policy.
          kubeProxyReplacement: true
          k8sServiceHost: 192.168.10.100
          k8sServicePort: 6443
          ipam:
            mode: kubernetes
          operator:
            # Single control plane node.
            replicas: 1
          bpf:
            masquerade: true
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
            metrics:
              enableOpenMetrics: true
              enabled:
                - dns:query;ignoreAAAA
                - "drop:sourceContext=namespace;destinationContext=namespace"
                - tcp
                - "flow:sourceContext=namespace;destinationContext=namespace"
                - port-distribution
                - icmp
                - httpV2
          # Mutual auth via SPIRE — Cilium integrates with the cluster's existing SPIRE deployment.
          authentication:
            mutual:
              spire:
                enabled: true
                install:
                  enabled: false
                adminSocketPath: /run/spire/sockets/admin.sock
                agentSocketPath: /run/spire/sockets/spire-agent/spire-agent.sock
                connectionTimeout: 30s
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
