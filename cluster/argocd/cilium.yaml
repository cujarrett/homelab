apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: cluster
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.6
      helm:
        releaseName: cilium
        values: |
          # kube-proxy replacement via eBPF — required for toFQDNs DNS-aware egress policy.
          kubeProxyReplacement: true
          k8sServiceHost: 192.168.10.100
          k8sServicePort: 6443
          # Istio interop — allow Istio's CNI plugin to co-exist in the CNI config dir
          # instead of Cilium claiming it exclusively. See docs/platform-connections.md.
          cni:
            exclusive: false
          # Keep socket-level LB in the host namespace only, so pod-level socketLB does not
          # bypass an injected Istio sidecar.
          socketLB:
            hostNamespaceOnly: true
          ipam:
            mode: kubernetes
          operator:
            # Single control plane node.
            replicas: 1
          bpf:
            masquerade: true
          encryption:
            enabled: true
            type: wireguard
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
            metrics:
              enableOpenMetrics: true
              enabled:
                - dns:query;ignoreAAAA
                - "drop:sourceContext=namespace;destinationContext=namespace"
                - tcp
                - "flow:sourceContext=namespace;destinationContext=namespace"
                - port-distribution
                - icmp
                - httpV2
          # Mutual auth DISABLED — Istio owns mTLS now.
          # Cilium is demoted to CNI plumbing; connection policy/mutual auth belongs to Istio.
          # SPIRE keeps running (Istio may use SPIFFE identity later); Cilium simply stops consuming it.
          # NOTE: the chart's validate.yaml requires spire.enabled to match authentication.enabled —
          # both must be false together, so the SPIRE integration block below is disabled too.
          authentication:
            enabled: false
            mutual:
              spire:
                enabled: false
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
