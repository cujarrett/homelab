# One environment per open PR in each subgraph repo. It runs all of graph-test with
# the PR's subgraph swapped in. Closing the PR deletes it.
# See https://github.com/cujarrett/homelab/issues/66
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: graph-pr
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - subgraph: records
                - subgraph: reviews
          - pullRequest:
              # One GitHub call per repo per minute. GitHub allows 5,000 an hour.
              requeueAfterSeconds: 60
              github:
                owner: cujarrett
                repo: "storefront-{{ .subgraph }}"
                tokenRef:
                  secretName: graph-pr-github
                  key: token
            # The generator lists fork PRs too. Only PRs from these authors get an environment.
            selector:
              matchExpressions:
                - key: author
                  operator: In
                  values: [cujarrett]
  template:
    metadata:
      # Kyverno requires the Application and its namespace to share a name.
      name: "graph-pr-{{ .subgraph }}-{{ .number }}"
      # Argo notifications posts a GitHub deployment to the PR from these.
      annotations:
        notifications.argoproj.io/subscribe.on-pr-env-ready.github: ""
        pr-env.platform.local.lab/repo: "https://github.com/cujarrett/storefront-{{ .subgraph }}"
        pr-env.platform.local.lab/head-sha: "{{ .head_sha }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: graph-pr
      source:
        repoURL: https://github.com/cujarrett/homelab.git
        targetRevision: main
        path: platform/federated-graph/pr-chart
        helm:
          valuesObject:
            subgraph: "{{ .subgraph }}"
            # CI tags PR builds pr-<number>-<commit>.
            # Kargo only watches sha- tags, so PR builds never reach test.
            image: "ghcr.io/cujarrett/storefront-{{ .subgraph }}:pr-{{ .number }}-{{ .head_sha }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "graph-pr-{{ .subgraph }}-{{ .number }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
