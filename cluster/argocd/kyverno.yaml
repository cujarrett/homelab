# Kyverno - admission validation for platform XRs. Exists for the two checks CEL
# can't do, since both must read an object other than the one being admitted -
# does the app a consumes entry names exist, and is this egress host denied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.0
    helm:
      releaseName: kyverno
      values: |
        # kyverno-api.labels/.annotations default to {}, which Kubernetes drops on write,
        # so desired says "empty map present" and live says "absent" forever - neither
        # ignoreDifferences nor a reinstall closes that gap. Real values fix it.
        kyverno-api:
          labels:
            platform.local.lab/managed-by: argocd
          annotations:
            platform.local.lab/chart: kyverno
        # Four Raspberry Pis, and only the admission controller is on the hot path.
        # One replica each: a second would need leader election for no gain here, and
        # the chart defaults to three for the admission controller.
        admissionController:
          replicas: 1
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
        backgroundController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
        # Nothing here generates or cleans up resources, so both are off. Turning one on
        # later is a values change, not a reinstall.
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      # The chart's migration Job carries a plain helm.sh/hook ArgoCD doesn't translate,
      # so it never leaves the resource tree and gets flagged for pruning every compare.
      # Prune=false stops that; nothing else in this vendor chart is ever removed.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
