apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: cluster
  sources:
    # Kept to the two values the live release already carries, so the rendered
    # manifests match what's applied today and adoption has nothing to churn.
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0
      helm:
        releaseName: longhorn
        values: |
          defaultSettings:
            defaultReplicaCount: 2
            storageMinimalAvailablePercentage: 10
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
