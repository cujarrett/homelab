apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: cluster
  sources:
    # Only the two non-default values the release actually needs - selfHeal is on,
    # so anything else added here fights the values already applied to the cluster.
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        values: |
          defaultSettings:
            defaultReplicaCount: 2
            storageMinimalAvailablePercentage: 10
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
