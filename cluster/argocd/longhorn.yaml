apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: cluster
  sources:
    # Only the non-default values the release actually needs - selfHeal is on,
    # so anything else added here fights the values already applied to the cluster.
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        releaseName: longhorn
        values: |
          defaultSettings:
            defaultReplicaCount: 2
            storageMinimalAvailablePercentage: 10
            # At 0, volumes stay on the old engine after a chart upgrade,
            # and each node keeps a second instance manager running for them.
            concurrentAutomaticEngineUpgradePerNodeLimit: 1
          # Measured 190-230Mi steady, 420Mi peak.
          # No limit, because an OOM-killed manager stalls every volume operation on that node.
          longhornManager:
            resources:
              requests:
                memory: 256Mi
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
