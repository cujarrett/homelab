apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd
  namespace: argocd
spec:
  project: cluster
  sources:
    # Linkerd CRDs — must be applied before the control plane
    - repoURL: https://helm.linkerd.io/edge
      chart: linkerd-crds
      targetRevision: 2026.6.2
      helm:
        releaseName: linkerd-crds
    # Linkerd control plane — reads identity issuer Secret from cert-manager
    - repoURL: https://helm.linkerd.io/edge
      chart: linkerd-control-plane
      targetRevision: 2026.6.2
      helm:
        releaseName: linkerd-control-plane
        values: |
          # Use cert-manager-managed certificates instead of Linkerd's built-in CA.
          # The linkerd-identity-issuer Secret must exist before this chart installs.
          identity:
            externalCA: true
            issuer:
              scheme: kubernetes.io/tls
          proxy:
            resources:
              cpu:
                limit: "100m"
                request: "10m"
              memory:
                limit: "64Mi"
                request: "10Mi"
    # Linkerd namespace label + cert-manager Certificate + trust Bundle resources
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/linkerd
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
