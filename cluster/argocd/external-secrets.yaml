# External Secrets Operator — syncs credentials from AWS Secrets Manager into Kubernetes
# Secrets. Only grafana-admin-secret uses it; docs/external-secrets.md explains why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        # Creates the metrics Service and ServiceMonitor. The release label is what
        # kube-prometheus-stack's serviceMonitorSelector matches on.
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: monitoring
        # Four Raspberry Pis — the controller idles well under these, and the webhook and
        # cert-controller only wake on admission and cert rotation respectively.
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
