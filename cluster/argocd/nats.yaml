apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
spec:
  project: cluster
  sources:
    - repoURL: https://nats-io.github.io/k8s/helm/charts/
      chart: nats
      targetRevision: 2.14.2
      helm:
        releaseName: nats
        values: |
          config:
            cluster:
              enabled: true
              # 3 replicas - one per worker node (work-1, work-2, work-3)
              replicas: 3
            jetstream:
              enabled: true
              fileStore:
                enabled: true
                pvc:
                  size: 5Gi
                  storageClassName: longhorn
          promExporter:
            enabled: true
            container:
              merge:
                resources:
                  limits:
                    cpu: "50m"
                    memory: "64Mi"
          container:
            merge:
              resources:
                limits:
                  cpu: "200m"
                  memory: "256Mi"
                requests:
                  cpu: "50m"
                  memory: "64Mi"
          reloader:
            container:
              merge:
                resources:
                  limits:
                    cpu: "50m"
                    memory: "64Mi"
          # Pin pods to worker nodes, keep control plane clean
          podTemplate:
            merge:
              spec: {}
          natsBox:
            container:
              merge:
                resources:
                  limits:
                    cpu: "50m"
                    memory: "32Mi"
            podTemplate:
              merge:
                spec: {}
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/nats
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  ignoreDifferences:
    # Kubernetes adds status.phase to volumeClaimTemplates at runtime.
    # The Helm chart doesn't include it, causing a perpetual OutOfSync loop.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
