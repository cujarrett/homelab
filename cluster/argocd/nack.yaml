apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nack
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    chart: nack
    targetRevision: 0.35.0
    helm:
      releaseName: nack
      # The chart ships streamtemplates.jetstream.nats.io with its only version
      # marked served=false, which wedges the garbage collector - discovery
      # advertises the type, the API server refuses to serve it, and every
      # namespace in the cluster then hangs in Terminating. Skipping chart CRDs
      # lets that one stay deleted. The five CRDs actually in use are already
      # installed, so a nack upgrade now needs its CRDs applied by hand from
      # the chart's crds/crds.yml.
      skipCrds: true
      values: |
        jetstream:
          nats:
            # Points the NACK controller at the in-cluster NATS service.
            # NACK reconciles Stream and Consumer CRDs against this server.
            url: nats://nats.nats.svc.cluster.local:4222
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"

  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
