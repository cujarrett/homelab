apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://charts.crossplane.io/stable
      chart: crossplane
      targetRevision: 2.4.0
      helm:
        releaseName: crossplane
        values: |
          args:
            - --enable-realtime-compositions
          metrics:
            enabled: true
          # Sized to the 7 day p95. The chart default of 256Mi undercounts it by
          # more than half, so the scheduler stacked it with the providers.
          resourcesCrossplane:
            requests:
              memory: 640Mi
            limits:
              memory: 1Gi
          rbacManager: {}
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/crossplane
      # The IAM policy documents beside the manifests are for the aws cli. ArgoCD
      # reads any .json as a manifest and fails the whole comparison on them.
      directory:
        exclude: "*.json"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  ignoreDifferences:
    # `just test-e2e` scales worker-nodes-idle to 1 for the run and back to 0 after.
    # Without this selfHeal reverts the scale-up mid-run and the RDS/ElastiCache
    # resources never reconcile.
    - group: pkg.crossplane.io
      kind: DeploymentRuntimeConfig
      name: worker-nodes-idle
      jsonPointers:
        - /spec/deploymentTemplate/spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
