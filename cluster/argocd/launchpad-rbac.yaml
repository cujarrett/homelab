apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: launchpad-rbac
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://github.com/cujarrett/homelab.git
    targetRevision: main
    path: cluster/launchpad
  destination:
    server: https://kubernetes.default.svc
    namespace: launchpad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
