apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire
    targetRevision: 0.29.0
    helm:
      releaseName: spire
      values: |
        global:
          spire:
            trustDomain: homelab.local
            clusterName: homelab
            namespaces:
              create: true
            persistence:
              storageClass: longhorn-retain

        spire-server:
          replicaCount: 1
          controllerManager:
            enabled: false

        spire-agent:
          logLevel: DEBUG

        spire-controller-manager:
          enabled: false

        spiffe-csi-driver:
          enabled: false

        spiffe-oidc-discovery-provider:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      namespace: spire-server
      jqPathExpressions:
        # Kubernetes strips chart-generated annotations from volumeClaimTemplates after creation
        - .spec.volumeClaimTemplates[]?.metadata.annotations
        # Kubernetes adds volumeMode: Filesystem default; chart omits it, causing a false diff
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        # Kubernetes adds status.phase to volumeClaimTemplates; not part of desired state
        - .spec.volumeClaimTemplates[]?.status
