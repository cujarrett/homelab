apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire
    targetRevision: 0.29.0
    helm:
      releaseName: spire
      values: |
        global:
          spire:
            trustDomain: homelab.local
            clusterName: homelab
            namespaces:
              create: true
            persistence:
              storageClass: longhorn-retain

        spire-server:
          replicaCount: 1
          # Controller manager provisions the ClusterSPIFFEID CRD and watches pods,
          # auto-creating SPIRE registration entries (replaces the by-hand entry step).
          controllerManager:
            enabled: true

        spire-agent:
          logLevel: DEBUG

        # CSI driver mounts each pod's SVID (cert + key) as files via a volume.
        # Required before any workload can consume its identity for AWS credential exchange.
        spiffe-csi-driver:
          enabled: true

        spiffe-oidc-discovery-provider:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      namespace: spire-server
      jqPathExpressions:
        # Kubernetes strips apiVersion/kind from volumeClaimTemplates after creation; chart includes them
        - .spec.volumeClaimTemplates
