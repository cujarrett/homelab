apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire
    targetRevision: 0.29.0
    helm:
      releaseName: spire
      values: |
        global:
          spire:
            trustDomain: homelab.local
            clusterName: homelab
            namespaces:
              create: true
            persistence:
              storageClass: longhorn-retain

        spire-server:
          # HA requires a shared datastore; single replica is sufficient for homelab.
          replicaCount: 1
          # 1 year — avoids frequent CA rotation with no automated rotation tooling in place.
          caTTL: 8760h
          caSubject:
            country: US
            organization: Homelab
            commonName: homelab-spire
          # Prefer worker nodes — ctrl-1 runs AdGuard (DNS) and the kiosk display.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          # Watches pods and issues each a SPIFFE ID from its namespace + service account.
          controllerManager:
            enabled: true
            identities:
              clusterSPIFFEIDs:
                # By default the chart IDs every pod; we only want platform pods.
                default:
                  enabled: false
                # Issue an ID to Api and Spa pods (label set by their compositions).
                homelab-workloads:
                  spiffeIDTemplate: spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}
                  podSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - xapi
                          - xspa

        spire-agent:
          logLevel: INFO

        # CSI driver mounts each pod's SVID (cert + key) as files via a volume.
        # Required before any workload can consume its identity for AWS credential exchange.
        spiffe-csi-driver:
          enabled: true

        # Not needed — AWS trust uses RolesAnywhere (cert-based), not OIDC federation.
        spiffe-oidc-discovery-provider:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: spire-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      namespace: spire-server
      jqPathExpressions:
        # Kubernetes strips apiVersion/kind from volumeClaimTemplates after creation; chart includes them
        - .spec.volumeClaimTemplates
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: spire-server-spire-controller-manager-webhook
      jqPathExpressions:
        # SPIRE controller-manager owns this webhook after startup — injects caBundle and
        # reorders entries. Ignore the whole array to avoid permanent ordering drift.
        - .webhooks
