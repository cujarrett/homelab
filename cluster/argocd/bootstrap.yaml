# App-of-apps root. Applies cluster/argocd/ without recursing, so every
# Application and ApplicationSet manifest here is picked up and nothing else is.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/cujarrett/homelab.git
    targetRevision: main
    path: cluster/argocd
    directory:
      recurse: false
      exclude: "bootstrap.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
