# Istio service mesh - sidecar mode. See docs/platform-connections.md.
# Three charts, ordered by sync-wave: base (CRDs) -> istiod + cni.
# istio-cni chains onto flannel's conflist.
---
# istio-base - CRDs + cluster RBAC. Must apply before istiod/cni.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cluster
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.4
    helm:
      releaseName: istio-base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod patches its validating webhook at runtime - injects the CA (caBundle) and flips
  # failurePolicy Ignore->Fail once healthy. Ignore both so ArgoCD doesn't show perpetual
  # drift or revert them on selfHeal.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
        - '.webhooks[].failurePolicy'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
# istiod - control plane, sidecar mode. Pinned to ctrl-1, next to the apiserver.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.4
    helm:
      releaseName: istiod
      values: |
        # Use the istio-cni DaemonSet instead of injecting a NET_ADMIN init container into
        # every pod. Without this istiod still injects istio-init even though the CNI is
        # installed, and that init container is what fails Pod Security Admission.
        cni:
          enabled: true
        # Pin the control plane to ctrl-1 - istiod sits next to the apiserver it watches.
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        # One fixed replica - no HPA on a 4-node Pi cluster.
        autoscaleEnabled: false
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # Same caBundle drift as istio-base (istiod patches its own validating webhook).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
        - '.webhooks[].failurePolicy'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
# istio-cni - installs the CNI plugin (DaemonSet, all nodes) that wires sidecar
# traffic redirection at pod creation instead of a NET_ADMIN init container.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cluster
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.4
    helm:
      releaseName: istio-cni
      values: |
        # k3s keeps its CNI config and plugin binaries under /var/lib/rancher, not the
        # /etc/cni/net.d and /opt/cni/bin the chart defaults to. data/cni is the only
        # directory k3s searches for plugins - data/current/bin holds its own symlinks and
        # is not searched, so a binary installed there is invisible and every pod on the
        # node fails to get a sandbox.
        chained: true
        cniBinDir: /var/lib/rancher/k3s/data/cni
        cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
