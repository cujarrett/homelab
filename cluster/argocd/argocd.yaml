# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.4.2
    helm:
      releaseName: argocd
      values: |
        global: {}
        dex:
          enabled: false
        controller:
          extraArgs:
            - --status-processors=5
            - --operation-processors=5
          resources:
            # Request is set well under the limit because the controller idles near 1Gi
            # and only approaches the ceiling during a full re-sync of every app.
            requests:
              memory: 1.5Gi
            limits:
              memory: 2.5Gi
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        repoServer:
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
        server:
          extraArgs:
            # ArgoCD's server has built-in TLS. --insecure disables it so ArgoCD listens on plain HTTP internally. That's correct here because Traefik is handling TLS termination - HTTPS hits Traefik, which strips TLS and proxies plain HTTP to ArgoCD. If you didn't set --insecure, you'd get a double-TLS situation and the ingress would break.
            - --insecure
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
        applicationSet:
          resources:
            limits:
              memory: 512Mi
        notifications:
          resources:
            limits:
              memory: 128Mi
        redis:
          resources:
            limits:
              memory: 64Mi
        configs:
          params:
            server.insecure: "true"
            application.namespaces: "*"
          cm:
            # Self-heal runs off watches, so this timer only governs how fast a new Git
            # commit is noticed. Launchpad pushes its own refresh annotations for the
            # paths that need to be instant. Jitter spreads the apps across the window
            # instead of diffing all of them on the same tick.
            timeout.reconciliation: 60s
            timeout.reconciliation.jitter: 30s
            controller.diff.server.side: "true"
            resource.customizations.health.networking.k8s.io_Ingress: |
              hs = {}
              hs.status = "Healthy"
              return hs
            resource.customizations.ignoreDifferences.core_PersistentVolumeClaim: |
              jsonPointers:
              - /spec/volumeName
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
