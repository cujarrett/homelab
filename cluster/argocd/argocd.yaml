# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.1.0
    helm:
      releaseName: argocd
      values: |
        global: {}
        dex:
          enabled: false
        controller:
          extraArgs:
            - --status-processors=5
            - --operation-processors=5
          resources:
            limits:
              memory: 2.5Gi
        repoServer:
          resources:
            limits:
              memory: 512Mi
        server:
          extraArgs:
            # ArgoCD's server has built-in TLS. --insecure disables it so ArgoCD listens on plain HTTP internally. That's correct here because Traefik is handling TLS termination — HTTPS hits Traefik, which strips TLS and proxies plain HTTP to ArgoCD. If you didn't set --insecure, you'd get a double-TLS situation and the ingress would break.
            - --insecure
          resources:
            limits:
              memory: 256Mi
        applicationSet:
          resources:
            limits:
              memory: 512Mi
        notifications:
          resources:
            limits:
              memory: 128Mi
        redis:
          resources:
            limits:
              memory: 64Mi
        configs:
          params:
            server.insecure: "true"
            application.namespaces: "*"
          cm:
            timeout.reconciliation: 10s
            timeout.reconciliation.jitter: 0s
            controller.diff.server.side: "true"
            resource.customizations.health.networking.k8s.io_Ingress: |
              hs = {}
              hs.status = "Healthy"
              return hs
            resource.customizations.ignoreDifferences.core_PersistentVolumeClaim: |
              jsonPointers:
              - /spec/volumeName
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
