apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-exporter
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://github.com/cujarrett/homelab.git
    targetRevision: main
    path: cluster/platform-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
