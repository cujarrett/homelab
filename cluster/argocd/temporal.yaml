# Temporal server and UI, plus the Postgres, route and namespace in cluster/temporal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
spec:
  project: cluster
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.7.0
      helm:
        releaseName: temporal
        values: |
          server:
            replicaCount: 1
            nodeSelector:
              node-role.kubernetes.io/worker: worker
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            config:
              logLevel: info
              persistence:
                # Fixed for the life of the cluster. Changing it means a new database.
                # 64 is plenty for a homelab's workflow volume.
                numHistoryShards: 64
                datastores:
                  default:
                    sql:
                      createDatabase: true
                      manageSchema: true
                      pluginName: postgres12
                      driverName: postgres12
                      databaseName: temporal
                      connectAddr: temporal-postgres.temporal.svc.cluster.local:5432
                      connectProtocol: tcp
                      user: temporal
                      existingSecret: temporal-postgres
                      secretKey: password
                      maxConns: 10
                      maxIdleConns: 10
                  visibility:
                    sql:
                      createDatabase: true
                      manageSchema: true
                      pluginName: postgres12
                      driverName: postgres12
                      databaseName: temporal_visibility
                      connectAddr: temporal-postgres.temporal.svc.cluster.local:5432
                      connectProtocol: tcp
                      user: temporal
                      existingSecret: temporal-postgres
                      secretKey: password
                      maxConns: 5
                      maxIdleConns: 5
              # temporal-controller creates every namespace, so the chart creates none.
              namespaces:
                create: false
              # Every call needs an Entra token. Its roles claim decides which namespaces the caller may use.
              # Role values look like Temporal.<namespace>.<role>, such as Temporal.foo.write.
              # Temporal's own worker service calls the internal frontend, which skips this.
              authorization:
                jwtKeyProvider:
                  keySourceURIs:
                    - https://login.microsoftonline.com/7f4c1900-e63c-456b-ab5f-898189b24ec4/discovery/v2.0/keys
                  refreshInterval: 1h
                # Microsoft signs every tenant's tokens with the same keys, and Temporal never checks the issuer.
                # The audience is the Temporal app's client ID. Only this tenant can issue tokens for it.
                audience: aaa9a694-3d1e-40d7-9f9e-8db46c54fbdd
                permissionsClaimName: roles
                permissionsRegex: '^Temporal\.(?P<namespace>.+)\.(?P<role>[a-z]+)$'
                authorizer: default
                claimMapper: default
            frontend:
              # The only Temporal service in the mesh, so callers' tokens cross the network encrypted.
              # Its calls to the other services and Postgres skip the sidecar and stay inside the namespace.
              podLabels:
                sidecar.istio.io/inject: "true"
              podAnnotations:
                traffic.sidecar.istio.io/excludeInboundPorts: "6933"
                traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6933,6934,6935,6936,6939,7234,7235,7236"
              containerSecurityContext: &restricted
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
            history:
              containerSecurityContext: *restricted
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1Gi}
            matching:
              containerSecurityContext: *restricted
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
            # Temporal's own worker service calls this instead of the meshed frontend.
            internal-frontend:
              enabled: true
              containerSecurityContext: *restricted
              resources:
                requests: {cpu: 25m, memory: 96Mi}
                limits: {memory: 384Mi}
            worker:
              containerSecurityContext: *restricted
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 256Mi}
          # Nothing uses the toolbox pod. Run the temporal CLI from a laptop instead.
          admintools:
            enabled: false
          web:
            # Meshed so its calls to the frontend use mTLS. Traefik reaches it in plain text,
            # because web keeps the default permissive mode.
            podLabels:
              sidecar.istio.io/inject: "true"
            # Chart 1.7.0 ships UI 2.54.1, which carries a critical echo advisory. 2.57.0 scans clean.
            # Delete this override once the chart's own UI tag reaches 2.57.0, or it pins an older UI.
            image:
              tag: 2.57.0
            # Sign in through Entra. The UI sends the signed-in user's token to Temporal.
            additionalEnv:
              - name: TEMPORAL_AUTH_ENABLED
                value: "true"
              - name: TEMPORAL_AUTH_PROVIDER_URL
                value: https://login.microsoftonline.com/7f4c1900-e63c-456b-ab5f-898189b24ec4/v2.0
              - name: TEMPORAL_AUTH_CLIENT_ID
                value: aaa9a694-3d1e-40d7-9f9e-8db46c54fbdd
              - name: TEMPORAL_AUTH_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: temporal-ui-entra
                    key: attribute.value
              - name: TEMPORAL_AUTH_CALLBACK_URL
                value: https://temporal.local.lab/auth/sso/callback
              # The last scope makes the access token one Temporal accepts, carrying the user's roles.
              # It names the app by client ID, because Entra refuses an app asking for itself by its api:// URI.
              # .default grants the app's own Temporal.Use scope, listed in cluster/temporal/entra.yaml.
              - name: TEMPORAL_AUTH_SCOPES
                value: openid,profile,email,aaa9a694-3d1e-40d7-9f9e-8db46c54fbdd/.default
            replicaCount: 1
            nodeSelector:
              node-role.kubernetes.io/worker: worker
            securityContext:
              runAsNonRoot: true
              # The image names its user rather than numbering it, so the kubelet can't check runAsNonRoot without this.
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext: *restricted
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
          schema:
            # Helm hooks become ArgoCD PreSync hooks, which run before Postgres exists and never finish.
            # As an ArgoCD Sync hook, the job runs after Postgres (sync wave -1) is healthy.
            useHelmHooks: false
            jobAnnotations:
              argocd.argoproj.io/hook: Sync
              # Deleted once it succeeds, so Trivy stops reporting CVEs in an image nothing runs.
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext: *restricted
    - repoURL: https://github.com/cujarrett/homelab.git
      targetRevision: main
      path: cluster/temporal
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  ignoreDifferences:
    # Kubernetes adds status.phase to volumeClaimTemplates at runtime.
    # The manifest doesn't include it, causing a perpetual OutOfSync loop.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
