# Applies node sysctls directly against the host /proc, so a value survives a node
# rebuild without anyone re-running the old by-hand runbook step.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctls
  namespace: node-sysctls
spec:
  selector:
    matchLabels:
      app: node-sysctls
  template:
    metadata:
      labels:
        app: node-sysctls
    spec:
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: sysctl
          image: busybox:1.38
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              echo 8192 > /host-proc/sys/fs/inotify/max_user_instances
              echo 524288 > /host-proc/sys/fs/inotify/max_user_watches
              sleep infinity
          volumeMounts:
            - name: host-proc
              mountPath: /host-proc
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
