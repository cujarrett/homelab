# Sets GOMEMLIMIT for the k3s server on ctrl-1, so the API server collects garbage
# before its heap doubles instead of holding ~2x its live data.
# - Drop-in: the k3s installer rewrites k3s.service and k3s.service.env on every upgrade, never k3s.service.d/
# - Timing: takes effect at the next daemon-reload and k3s restart. An upgrade does both
# - No restart from here: it would restart the control plane this pod depends on
# - 4608MiB: live heap ~1.8GB plus runtime overhead passed 3GiB, and GC took over half of k3s CPU
# - Integer only: Go rejects a fractional GOMEMLIMIT like 4.5GiB
# Also reserves memory outside pods, so the scheduler never counts it as free.
# - 6Gi: k3s ~4.6Gi, containerd ~0.5Gi, kiosk Chromium ~0.65Gi, plus the OS
# - config.yaml.d: k3s reads it on start, and the installer never rewrites it
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-env
  namespace: node-sysctls
spec:
  selector:
    matchLabels:
      app: k3s-env
  template:
    metadata:
      labels:
        app: k3s-env
    spec:
      nodeSelector:
        kubernetes.io/hostname: ctrl-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: env
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              set -e
              printf '[Service]\nEnvironment=GOMEMLIMIT=4608MiB\n' > /host/k3s.service.d/gomemlimit.conf
              printf 'kubelet-arg:\n  - system-reserved=memory=6Gi\n' > /host/k3s-config.d/reserved.yaml
              sleep infinity
          volumeMounts:
            - name: k3s-dropin
              mountPath: /host/k3s.service.d
            - name: k3s-config
              mountPath: /host/k3s-config.d
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: k3s-dropin
          hostPath:
            path: /etc/systemd/system/k3s.service.d
            type: DirectoryOrCreate
        - name: k3s-config
          hostPath:
            path: /etc/rancher/k3s/config.yaml.d
            type: DirectoryOrCreate
