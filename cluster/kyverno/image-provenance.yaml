# Checks that our own images were built by the shared build workflow (SLSA Build L3).
# Tracking issue https://github.com/cujarrett/homelab/issues/58
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: image-provenance
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Image provenance
    policies.kyverno.io/description: >-
      An image built by this account runs only if the shared build workflow
      on homelab main built it from main of the image's own repo. PR
      environments also run images built from a pull request.
spec:
  validationActions: [Deny]
  # An image that can't be checked doesn't run.
  failurePolicy: Fail
  # Kyverno swaps container tags for digests. It leaves image volumes alone.
  # PR routers mount their PR image by tag, so this digest check is off.
  # The last rule still needs a digest outside graph-pr-* namespaces.
  validationConfigurations:
    verifyDigest: false
  # Each check calls the registry, so it can take a while.
  webhookConfiguration:
    timeoutSeconds: 30
  # Check pods only. Pods are what run.
  # Without this, every Crossplane write to a Deployment runs the check too.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/cujarrett/*"
  # Image volumes get the same check as containers.
  images:
    - name: volumes
      expression: "object.spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)"
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              # The signing certificate names the shared workflow as its signer.
              subject: https://github.com/cujarrett/homelab/.github/workflows/build-image.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  variables:
    # An image must come from the repo with the same name.
    # List here: images from a repo that builds more than one.
    # A prefix match is unsafe. Repo my-vinyl could then pass as my-vinyl-api.
    - name: repoFor
      expression: >-
        {
          "platform-connections-demo-api": "platform-connections-demo",
          "platform-connections-demo-downstream": "platform-connections-demo",
          "platform-connections-demo-spa": "platform-connections-demo",
          "platform-graph-demo-backend": "platform-graph-demo",
          "platform-graph-demo-spa": "platform-graph-demo",
          "rover": "homelab",
          "sump-pump-bridge": "sump-pump",
          "sump-pump-consumer": "sump-pump"
        }
    # graph-pr-* namespaces may run PR builds. Everywhere else needs a main build.
    - name: prBuildsAllowed
      expression: "request.namespace.startsWith('graph-pr-')"
  validations:
    # One signature check per image. && skips the rest when it fails.
    # ghcr.io has no port, so the first colon starts the tag.
    - expression: >-
        (images.containers + (has(images.initContainers) ? images.initContainers : []) + (has(images.volumes) ? images.volumes : [])).all(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.github]) > 0
          && cel.bind(name, image.split("@")[0].split(":")[0].replace("ghcr.io/cujarrett/", ""),
             cel.bind(workflow, extractPayload(image, attestations.slsa).predicate.buildDefinition.externalParameters.workflow,
               workflow.repository == "https://github.com/cujarrett/" + (name in variables.repoFor ? variables.repoFor[name] : name)
               && (workflow.ref == "refs/heads/main" || (variables.prBuildsAllowed && workflow.ref.startsWith("refs/pull/"))))))
      message: image was not built by the homelab build-image workflow from main of its own repo
    - expression: "variables.prBuildsAllowed || !has(images.volumes) || images.volumes.all(image, image.contains('@sha256:'))"
      message: an image volume outside a PR environment must name a digest
