# launchpad-api's internet-facing GitHub token can commit to homelab-workspaces.
# These limit what that commit can do to namespaces and to other workspaces.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-workspace-rbac
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform workspace RBAC
    policies.kyverno.io/description: >-
      A workspace synced from homelab-workspaces keeps its namespace labelled, owns only
      its own namespace, and deploys only into it.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    # Every other platform policy selects on this label, so a workspace commit that
    # relabels its namespace would switch them all off. Guest namespaces are left
    # out because launchpad-api renders them without the label.
    - name: workspace-namespaces-stay-labelled
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - github-exporter
                - graph-test
                - graph-prod
                - js-pollock
                - kentjarrett-com
                - launchpad
                - mattjarrett-com
                - mattjarrett-dev
                - my-vinyl
                - platform-connections-demo
                - platform-graph-demo
                - sump-pump
            subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          Namespace {{ request.object.metadata.name }} must keep the label
          platform.local.lab/workloads set to "true".
        pattern:
          metadata:
            labels:
              platform.local.lab/workloads: "true"

    # ArgoCD checks project destinations only for namespaced kinds, so a workspace commit
    # could adopt a cluster namespace such as longhorn-system and then prune it.
    # Adoption rewrites the tracking annotation.
    # Workspace namespaces carry the workloads label. Guest namespaces are made by launchpad-api.
    - name: only-workspace-namespaces-change-owner
      match:
        any:
          - resources:
              kinds:
                - Namespace
            subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          Namespace {{ request.object.metadata.name }} is not a workspace namespace, so no
          other ArgoCD application may take it over.
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.annotations.\"argocd.argoproj.io/tracking-id\" || '' }}"
                operator: NotEquals
                value: "{{ request.oldObject.metadata.annotations.\"argocd.argoproj.io/tracking-id\" || '' }}"
              - key: "{{ request.oldObject.metadata.labels.\"platform.local.lab/workloads\" || '' }}"
                operator: NotEquals
                value: "true"
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: "guest-*"

    # The AppProject allows every workspace namespace to every workspace, and a manifest
    # that sets metadata.namespace overrides the Application's destination.
    # The tracking annotation names the Application, which is the workspace directory.
    - name: workspaces-stay-in-their-namespace
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/*/*
                - ConfigMap
                - Service
              # Mirrors the workloads AppProject destinations in
              # cluster/argocd/projects.yaml.
              namespaces:
                - github-exporter
                - graph-test
                - graph-prod
                - js-pollock
                - kentjarrett-com
                - launchpad
                - mattjarrett-com
                - mattjarrett-dev
                - my-vinyl
                - platform-connections-demo
                - platform-graph-demo
                - sump-pump
                - "guest-*"
            subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          {{ request.object.kind }} {{ request.object.metadata.name }} is synced into
          {{ request.namespace }} by another workspace. A workspace can only deploy into
          the namespace named after its directory.
        deny:
          conditions:
            any:
              - key: "{{ split(request.object.metadata.annotations.\"argocd.argoproj.io/tracking-id\" || '', ':')[0] }}"
                operator: NotEquals
                value: "{{ request.namespace }}"

    # Owning a Namespace means pruning it, and everything in it, when the file goes.
    - name: workspaces-own-only-their-namespace
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - github-exporter
                - graph-test
                - graph-prod
                - js-pollock
                - kentjarrett-com
                - launchpad
                - mattjarrett-com
                - mattjarrett-dev
                - my-vinyl
                - platform-connections-demo
                - platform-graph-demo
                - sump-pump
                - "guest-*"
            subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          Namespace {{ request.object.metadata.name }} can only be synced by the workspace
          directory of the same name.
        deny:
          conditions:
            any:
              - key: "{{ split(request.object.metadata.annotations.\"argocd.argoproj.io/tracking-id\" || '', ':')[0] }}"
                operator: NotEquals
                value: "{{ request.object.metadata.name }}"
