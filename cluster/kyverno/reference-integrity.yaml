# An app naming another app that does not exist renders fine, reports Synced, and
# enforces nothing. Catching that means reading an object other than the one being
# admitted, which a CEL rule on the XRD cannot do.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-reference-integrity
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform reference integrity
    policies.kyverno.io/description: >-
      Every app named in consumes or apiProxies must be an Api that exists, deployed
      into the namespace the reference claims.
spec:
  # Enforce. This matches every Api and Spa, so a wrong rule rejects every XR update.
  # It only moved once every workspace PolicyReport passed.
  validationFailureAction: Enforce
  background: false
  rules:
    - name: consumes-names-a-real-api
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Api
                - platform.local.lab/v1alpha1/Spa
      context:
        # Apis are namespaced, so the key is namespace and name together. A
        # reference names both because it may cross namespaces.
        - name: apis
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/apis
            method: GET
            jmesPath: "items[].join('/', [metadata.namespace, metadata.name])"
        # A FederatedGraph router is a callable app too. Its Service is <name>-router.
        - name: routers
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/federatedgraphs
            method: GET
            jmesPath: "items[].join('/', [metadata.namespace, join('', [metadata.name, '-router'])])"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        # element is out of scope in a message, so the report names the candidates
        # rather than the offender.
        message: >-
          consumes names an app that is not an Api or a graph router on this platform.
          Existing: {{ apis }} {{ routers }}
        foreach:
          - list: "request.object.spec.parameters.consumes[?app]"
            deny:
              conditions:
                all:
                  - key: "{{ element.namespace }}/{{ element.app }}"
                    operator: AnyNotIn
                    value: "{{ apis }}"
                  - key: "{{ element.namespace }}/{{ element.app }}"
                    operator: AnyNotIn
                    value: "{{ routers }}"

    - name: apiproxies-names-a-real-api
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Spa
      context:
        - name: apis
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/apis
            method: GET
            jmesPath: "items[].join('/', [metadata.namespace, metadata.name])"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: >-
          apiProxies names an app that is not an Api on this platform. Existing: {{ apis }}
        foreach:
          # namespace is optional on an apiProxies entry and defaults to the Spa's own.
          - list: "request.object.spec.parameters.apiProxies[?app]"
            deny:
              conditions:
                all:
                  - key: "{{ element.namespace || request.object.metadata.namespace }}/{{ element.app }}"
                    operator: AnyNotIn
                    value: "{{ apis }}"

    - name: apiproxies-stays-in-own-namespace
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Spa
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          apiProxies can only reach an Api in this Spa's own namespace, and a host
          cannot name an in-cluster address. A public Spa proxying another namespace's
          Api would publish it to the internet.
        foreach:
          - list: "request.object.spec.parameters.apiProxies[?app]"
            deny:
              conditions:
                all:
                  - key: "{{ element.namespace || '' }}"
                    operator: NotEquals
                    value: ""
                  - key: "{{ element.namespace || '' }}"
                    operator: NotEquals
                    value: "{{ request.object.metadata.namespace }}"
          # The host form is taken verbatim, so an in-cluster name there reaches the same Api.
          - list: "request.object.spec.parameters.apiProxies[?host]"
            deny:
              conditions:
                any:
                  - key: "{{ ends_with(element.host, '.svc') }}"
                    operator: Equals
                    value: true
                  - key: "{{ ends_with(element.host, '.cluster.local') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.host, '.svc.') }}"
                    operator: Equals
                    value: true

    - name: configfrom-names-a-real-configmap
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Api
      context:
        # Scoped to the XR's own namespace, which is the only place configFrom can
        # name. Secrets are deliberately not checked here - that would mean granting
        # Kyverno secret reads across the cluster to catch a failure the kubelet
        # already reports as FailedMount on the pod.
        - name: configmaps
          apiCall:
            urlPath: /api/v1/namespaces/{{ request.object.metadata.namespace }}/configmaps
            method: GET
            jmesPath: "items[].metadata.name"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: >-
          configFrom names a ConfigMap that does not exist in this namespace.
          Existing: {{ configmaps }}
        foreach:
          - list: "request.object.spec.parameters.configFrom"
            deny:
              conditions:
                all:
                  - key: "{{ element }}"
                    operator: AnyNotIn
                    value: "{{ configmaps }}"
---
# The apis lookup above runs in every Kyverno controller, and the chart binds each
# to "view". Crossplane aggregates platform kinds into its own view role, so nothing
# grants the read. Without it the admission controller denies every Api and Spa that
# names an app, and the background and reports controllers log a violation per scan.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:platform-apis
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["platform.local.lab"]
    resources: ["apis", "federatedgraphs"]
    verbs: ["get", "list"]
