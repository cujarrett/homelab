# The graph image policy checks only storefront-* images, so any other image would
# skip it. In the graph lanes nothing else may run or publish a schema.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-graph-image-allowlist
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform graph image allow list
    policies.kyverno.io/description: >-
      A graph lane runs only its subgraphs, its router and the mesh proxy, and a
      subgraph publishes its schema only from its own signed image. A PR
      environment also runs the schema composer and its PR's image.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apollographql.com]
        apiVersions: [v1alpha2]
        operations: [CREATE, UPDATE]
        resources: [subgraphs]
  # Runs in graph-test, graph-prod and every graph-pr- namespace.
  # A namespace selector can't match a prefix, so CEL does it.
  matchConditions:
    - name: graph-lane
      expression: "namespaceObject.metadata.name in ['graph-test', 'graph-prod'] || namespaceObject.metadata.name.startsWith('graph-pr-')"
  variables:
    - name: containers
      expression: >-
        object.spec.?containers.orValue([]) +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    # A PR router reads every subgraph's schema from its image.
    - name: volumeImages
      expression: "object.spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)"
    # A pr-<number>-<commit> tag is a PR build.
    # platform-graph-api-digest refuses tags outside PR namespaces.
    - name: subgraph
      expression: >-
        r'ghcr\.io/cujarrett/storefront-[a-z0-9-]+(@sha256:[a-f0-9]{64}|:pr-[0-9]+-[0-9a-f]{40}(@sha256:[a-f0-9]{64})?)'
  validations:
    - expression: >-
        object.kind != 'Pod' ||
        variables.containers.all(c, c.image.matches('^(' + variables.subgraph + r'|ghcr\.io/cujarrett/apollo-router-arm64:[0-9.]+(@sha256:[a-f0-9]{64})?|ghcr\.io/cujarrett/rover:[0-9a-z.-]+(@sha256:[a-f0-9]{64})?|registry\.istio\.io/release/proxyv2:[0-9.]+(-distroless)?)$'))
      message: >-
        Only a storefront-* subgraph, the router, the schema composer and the
        Istio proxy may run in a graph lane.
    - expression: >-
        object.kind != 'Pod' ||
        variables.volumeImages.all(i, i.matches('^' + variables.subgraph + '$'))
      message: Only a storefront-* subgraph image may be mounted in a graph lane.
    - expression: >-
        object.kind != 'Subgraph' ||
        object.spec.?schema.?ociImage.?reference.orValue('none').matches(r'^ghcr\.io/cujarrett/storefront-.*@sha256:.*$')
      message: a subgraph publishes its schema only from a storefront-* image pinned by digest
