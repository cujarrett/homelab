# The schema a subgraph publishes is read from its image, so an unsigned image
# could publish a schema without its pod ever running. Both places the image
# appears must have provenance from the shared build workflow, built from main
# of that subgraph's own repo.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: platform-graph-image-signatures
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform graph image signatures
    policies.kyverno.io/description: >-
      A subgraph image runs in a graph lane, or has its schema published,
      only if the shared build workflow built that exact digest from main of
      the subgraph's own repo.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # Each check calls the registry, so it can take a while.
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [graph-test, graph-prod]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apollographql.com]
        apiVersions: [v1alpha2]
        operations: [CREATE, UPDATE]
        resources: [subgraphs]
  matchImageReferences:
    - glob: "ghcr.io/cujarrett/storefront-*"
  # The operator reads this field directly, so it is an image reference too.
  images:
    - name: subgraphSchema
      expression: "has(object.spec) && has(object.spec.schema) && has(object.spec.schema.ociImage) ? [object.spec.schema.ociImage.reference] : []"
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/cujarrett/homelab/.github/workflows/build-image.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  # Every expression runs against every matched kind, so each one applies only
  # where its image list exists.
  # Main is protected, so a build from main means the commit was reviewed.
  # ghcr.io has no port, so the first colon starts the tag.
  validations:
    - expression: >-
        !has(images.containers) ||
        images.containers.all(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.github]) > 0
          && cel.bind(workflow, extractPayload(image, attestations.slsa).predicate.buildDefinition.externalParameters.workflow,
               workflow.repository == "https://github.com/cujarrett/" + image.split("@")[0].split(":")[0].replace("ghcr.io/cujarrett/", "")
               && workflow.ref == "refs/heads/main"))
      message: pod image was not built by the shared build workflow from main of its subgraph repo
    - expression: >-
        !has(images.subgraphSchema) ||
        images.subgraphSchema.all(image,
          verifyAttestationSignatures(image, attestations.slsa, [attestors.github]) > 0
          && cel.bind(workflow, extractPayload(image, attestations.slsa).predicate.buildDefinition.externalParameters.workflow,
               workflow.repository == "https://github.com/cujarrett/" + image.split("@")[0].split(":")[0].replace("ghcr.io/cujarrett/", "")
               && workflow.ref == "refs/heads/main"))
      message: subgraph schema image was not built by the shared build workflow from main of its subgraph repo
---
# The policy stays not ready until the reports controller can read every kind it matches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:platform-subgraphs
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["apollographql.com"]
    resources: ["subgraphs"]
    verbs: ["get", "list", "watch"]
