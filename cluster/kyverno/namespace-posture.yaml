# managedNamespaceMetadata only labels a namespace ArgoCD creates itself, so a
# namespace.yaml in the repo silently opts out of it. This is the backstop for
# anything applied outside render-check.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-namespace-posture
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform namespace posture
    policies.kyverno.io/description: >-
      Every platform workload namespace is meshed.
spec:
  # Enforce. A rejected namespace blocks every workload in its directory, so this
  # only moved once every workspace PolicyReport passed.
  validationFailureAction: Enforce
  background: false
  rules:
    # The sidecar is the only egress control on Api and Spa pods.
    # An absent label leaves pods unmeshed by accident.
    - name: namespace-is-meshed
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  platform.local.lab/workloads: "true"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: >-
          Namespace {{ request.object.metadata.name }} does not set istio-injection to enabled.
          Its pods would run with no egress control.
        pattern:
          metadata:
            labels:
              istio-injection: enabled
