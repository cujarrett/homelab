# RDS and ElastiCache bill by the hour, so a forgotten one runs all month.
# Temporal Cloud has no spend cap, and one namespace can run up about $2,000 a day.
# Only the e2e suite may ask for them, and it deletes them every run.
# To let another namespace use them, add it to every list.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-public-cloud-backends
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform public-cloud backends
    policies.kyverno.io/description: >-
      Only approved namespaces may ask for a public-cloud Sql, cache or workflow space.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    # Sql and Cache hold the backend in the same field.
    # Cache: one committed by itself never passes through the Api rule below.
    - name: public-cloud-backend-allowlist
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Sql
                - platform.local.lab/v1alpha1/Cache
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          A public-cloud {{ request.object.kind }} is turned off. Use backend private-cloud,
          or ask the platform team to allow it.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.parameters.backend || 'private-cloud' }}"
                operator: Equals
                value: public-cloud
              - key: "{{ request.namespace }}"
                operator: AnyNotIn
                value:
                  - platform-e2e
    - name: public-cloud-cache-allowlist
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Api
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          A public-cloud cache is turned off. Use cache backend private-cloud,
          or ask the platform team to allow it.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.parameters.cache.backend || 'private-cloud' }}"
                operator: Equals
                value: public-cloud
              - key: "{{ request.namespace }}"
                operator: AnyNotIn
                value:
                  - platform-e2e
    - name: public-cloud-workflow-space-allowlist
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/WorkflowSpace
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          A public-cloud WorkflowSpace is turned off. Use backend private-cloud,
          or ask the platform team to allow it.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.parameters.backend || 'private-cloud' }}"
                operator: Equals
                value: public-cloud
              - key: "{{ request.namespace }}"
                operator: AnyNotIn
                value:
                  - platform-e2e
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-public-cloud-backends
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform public-cloud backends
    policies.kyverno.io/description: >-
      Only approved namespaces may ask for a public-cloud Sql, cache or workflow space.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.local.lab]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [sqls, caches, workflowspaces, apis]
  variables:
    # To let another namespace use them, add it here.
    - name: allowed
      expression: "object.metadata.namespace in ['platform-e2e']"
  validations:
    # Sql, Cache and WorkflowSpace hold the backend in the same field.
    # Cache: one committed by itself never passes through the Api check below.
    - expression: >-
        object.kind == 'Api' || variables.allowed ||
        object.spec.?parameters.?backend.orValue('private-cloud') != 'public-cloud'
      messageExpression: "'A public-cloud ' + object.kind + ' is turned off. Use backend private-cloud, or ask the platform team to allow it.'"
      message: A public-cloud backend is turned off. Use backend private-cloud, or ask the platform team to allow it.
    # An Api asks for a cache through its own field.
    - expression: >-
        object.kind != 'Api' || variables.allowed ||
        object.spec.?parameters.?cache.?backend.orValue('private-cloud') != 'public-cloud'
      message: >-
        A public-cloud cache is turned off. Use cache backend private-cloud,
        or ask the platform team to allow it.
