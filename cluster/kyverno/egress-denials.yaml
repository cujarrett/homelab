# Third-party egress is declared, not approved - anyone may reach a new host by saying
# so. This is the other half: a host listed here is refused everywhere, so a takedown
# is one pull request. Adding a host stops new declarations only - existing ones keep
# working until swept, since Kyverno only runs at admission.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-egress-denials
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform egress denials
    policies.kyverno.io/description: >-
      Hosts no workload may declare. Empty by design; add one only to shut a
      destination off across the whole platform.
spec:
  # Audit until the reports are seen to be correct. A wrong Enforce policy matching
  # every Api and Spa rejects every XR update, which is worse than the silent failure
  # it exists to catch. Flip to Enforce once the PolicyReports look right.
  validationFailureAction: Audit
  background: false
  rules:
    - name: host-is-not-denied
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Api
                - platform.local.lab/v1alpha1/Spa
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        # The message cannot name the offending host - foreach entries take no message
        # of their own, and element is out of scope here.
        message: >-
          A host declared in consumes or apiProxies is on the platform egress denial
          list. Remove the declaration, or open a pull request against
          cluster/kyverno/egress-denials.yaml if the block is wrong.
        foreach:
          - list: "request.object.spec.parameters.consumes[?host]"
            deny:
              conditions:
                all:
                  - key: "{{ element.host }}"
                    operator: AnyIn
                    value: []  # add a host here to shut it off platform-wide
          - list: "request.object.spec.parameters.apiProxies[?host]"
            deny:
              conditions:
                all:
                  - key: "{{ element.host }}"
                    operator: AnyIn
                    value: []  # add a host here to shut it off platform-wide
