# Two namespaces serving one host race for the "/" route.
# The shared Gateway takes routes from every namespace.
# Every XR host becomes an HTTPRoute, so one HTTPRoute lookup also covers hosts no XR
# holds, such as blog and oidc.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-host-ownership
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform host ownership
    policies.kyverno.io/description: >-
      One namespace owns each host. An Spa, Api, Wordpress or FederatedGraph is denied
      when an HTTPRoute in another namespace already serves the same host.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: host-belongs-to-one-namespace
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Spa
                - platform.local.lab/v1alpha1/Api
                - platform.local.lab/v1alpha1/Wordpress
                - platform.local.lab/v1alpha1/FederatedGraph
      # Namespaces other than this XR's own that serve the same host. Skipping the
      # XR's own namespace lets an update of an existing host pass.
      context:
        - name: otherOwners
          apiCall:
            urlPath: /apis/gateway.networking.k8s.io/v1/httproutes
            method: GET
            jmesPath: "items[?contains(spec.hostnames || `[]`, '{{ request.object.spec.parameters.host }}') && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
          - key: "{{ request.object.spec.parameters.host || '' }}"
            operator: NotEquals
            value: ""
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: false
        message: >-
          host {{ request.object.spec.parameters.host }} is already used by another namespace.
          Pick a different host.
        deny:
          conditions:
            all:
              - key: "{{ length(otherOwners) }}"
                operator: GreaterThan
                value: 0
---
# The chart binds each Kyverno controller to "view", which holds no Gateway API kinds.
# Without this read the lookup above fails and every XR with a host is denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:httproutes
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
