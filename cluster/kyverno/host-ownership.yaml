# Two namespaces serving one host race for the "/" route.
# The shared Gateway takes routes from every namespace.
# Every XR host becomes an HTTPRoute, so one HTTPRoute lookup also covers hosts no XR
# holds, such as blog and oidc.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-host-ownership
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform host ownership
    policies.kyverno.io/description: >-
      One namespace owns each host. An Spa, Api, Wordpress or FederatedGraph is denied
      when an HTTPRoute in another namespace already serves the same host.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.local.lab]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [spas, apis, wordpresses, federatedgraphs]
  matchConditions:
    - name: has-host
      expression: "object.spec.?parameters.?host.orValue('') != ''"
  variables:
    - name: host
      expression: "object.spec.parameters.host"
    # Namespaces other than this XR's own that serve the same host.
    # Skipping the XR's own namespace lets an update of an existing host pass.
    - name: otherOwners
      expression: >-
        resource.List("gateway.networking.k8s.io/v1", "httproutes", "").items.orValue([])
        .filter(r, r.metadata.namespace != object.metadata.namespace
          && variables.host in r.spec.?hostnames.orValue([]))
        .map(r, r.metadata.namespace)
  validations:
    - expression: "size(variables.otherOwners) == 0"
      messageExpression: "'host ' + variables.host + ' is already used by another namespace. Pick a different host.'"
      message: The host is already used by another namespace. Pick a different host.
---
# The chart binds each Kyverno controller to "view", which holds no Gateway API kinds.
# Without this read the lookup above fails and every XR with a host is denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:httproutes
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
