# Two namespaces serving one host lets the second pass an HTTP-01 challenge for a
# host the first already serves, take its private key through secretsFrom, and race
# it for the "/" route. Seeing other namespaces' XRs needs a lookup a CEL rule
# on the XRD cannot do.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-host-ownership
  annotations:
    # Kyverno's CRDs have to exist before this can apply.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Platform host ownership
    policies.kyverno.io/description: >-
      One namespace owns each host. An Spa, Api, Wordpress or FederatedGraph is denied
      when an XR of any of those kinds in another namespace already sets the same host.
spec:
  # Enforce. It only denies a host held by another namespace, and no two
  # namespaces share one today.
  validationFailureAction: Enforce
  background: false
  rules:
    - name: host-belongs-to-one-namespace
      match:
        any:
          - resources:
              kinds:
                - platform.local.lab/v1alpha1/Spa
                - platform.local.lab/v1alpha1/Api
                - platform.local.lab/v1alpha1/Wordpress
                - platform.local.lab/v1alpha1/FederatedGraph
      # Each list holds the namespaces, other than this XR's own, that set the same host.
      # A same-namespace XR is skipped so an update of an existing host passes.
      # ingressOwners also catches hosts no XR holds, such as blog and oidc.
      context:
        - name: spaOwners
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/spas
            method: GET
            jmesPath: "items[?spec.parameters.host == '{{ request.object.spec.parameters.host }}' && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
        - name: apiOwners
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/apis
            method: GET
            jmesPath: "items[?spec.parameters.host == '{{ request.object.spec.parameters.host }}' && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
        - name: wordpressOwners
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/wordpresses
            method: GET
            jmesPath: "items[?spec.parameters.host == '{{ request.object.spec.parameters.host }}' && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
        - name: graphOwners
          apiCall:
            urlPath: /apis/platform.local.lab/v1alpha1/federatedgraphs
            method: GET
            jmesPath: "items[?spec.parameters.host == '{{ request.object.spec.parameters.host }}' && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
        - name: ingressOwners
          apiCall:
            urlPath: /apis/networking.k8s.io/v1/ingresses
            method: GET
            jmesPath: "items[?spec.rules[?host == '{{ request.object.spec.parameters.host }}'] && metadata.namespace != '{{ request.object.metadata.namespace }}'].metadata.namespace"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
          - key: "{{ request.object.spec.parameters.host || '' }}"
            operator: NotEquals
            value: ""
      # Kyverno defaults both of these on write. Stated here so the repo matches
      # what the API server stores, otherwise ArgoCD sits permanently OutOfSync.
      skipBackgroundRequests: true
      validate:
        message: >-
          host {{ request.object.spec.parameters.host }} is already used by another namespace.
          Pick a different host.
        deny:
          conditions:
            any:
              - key: "{{ length(spaOwners) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(apiOwners) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(wordpressOwners) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(graphOwners) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(ingressOwners) }}"
                operator: GreaterThan
                value: 0
---
# The lookups above run in the admission controller, and the chart binds it to "view".
# Crossplane aggregates platform kinds into its own view role, so nothing grants the
# read. Without it the admission controller denies every XR that sets a host.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:platform-hosts
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["platform.local.lab"]
    resources: ["spas", "apis", "wordpresses", "federatedgraphs"]
    verbs: ["get", "list"]
