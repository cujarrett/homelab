      type: string
    - jsonPath: .spec.retention
      name: Retention
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TemporalNamespace is the Schema for the temporalnamespaces API
        properties:
