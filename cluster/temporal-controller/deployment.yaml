apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-controller
  namespace: temporal-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-controller
  template:
    metadata:
      labels:
        app: temporal-controller
    spec:
      serviceAccountName: temporal-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # temporal-controller's CI replaces this with each main build's sha tag.
          image: ghcr.io/cujarrett/temporal-controller:sha-5c868c379f185b8ef2dd9b2aad1369792d88ef22
          args:
            - --temporal-address=temporal-frontend.temporal.svc.cluster.local:7233
            - --health-probe-bind-address=:8081
            - --leader-elect
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The SPIRE agent's socket, for the JWT-SVID the controller trades for an Entra token.
            - name: spiffe
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
