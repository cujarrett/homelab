# The one Entra app registration that stands for Temporal. Its app ID URI is the audience
# Temporal checks, and every Workflow's app role hangs off it.
# owners is crossplane-entra's service principal, or it can create this but never update or delete it.
# Once it exists, copy its object ID and its service principal's object ID into the
# aws-platform-config EnvironmentConfig as temporalEntraAppObjectId and temporalEntraSpObjectId.
apiVersion: applications.azuread.m.upbound.io/v1beta1
kind: Application
metadata:
  name: temporal-entra
  namespace: temporal
spec:
  forProvider:
    displayName: platform-temporal
    api:
      # v2 tokens, issued by login.microsoftonline.com/<tenant>/v2.0, which is what Temporal validates.
      requestedAccessTokenVersion: 2
      # The UI asks for this scope to get an access token for Temporal on the user's behalf.
      # Entra hands out such a token only for a scope the app exposes.
      oauth2PermissionScope:
        - id: 69f122f8-d249-4bce-8629-976a105be4b5
          value: Temporal.Use
          type: User
          enabled: true
          adminConsentDisplayName: Use Temporal
          adminConsentDescription: Lets the Temporal UI call Temporal as the signed-in user.
          userConsentDisplayName: Use Temporal
          userConsentDescription: Lets the Temporal UI call Temporal as you.
    identifierUris:
      - api://7f4c1900-e63c-456b-ab5f-898189b24ec4/platform-temporal
    # The UI signs in as this app and asks for a token for this app.
    # Entra allows that only through the .default scope.
    # .default gives only the permissions listed here, so Temporal.Use is listed.
    requiredResourceAccess:
      - resourceAppId: aaa9a694-3d1e-40d7-9f9e-8db46c54fbdd
        resourceAccess:
          - id: 69f122f8-d249-4bce-8629-976a105be4b5
            type: Scope
    # The Temporal UI signs people in through this app, and gets back a token for it.
    web:
      redirectUris:
        - https://temporal.local.lab/auth/sso/callback
    owners:
      - 57f4959a-6c64-4a71-b66e-d9255c4e6b5e
---
# Role assignments target the service principal, not the app registration.
apiVersion: serviceprincipals.azuread.m.upbound.io/v1beta1
kind: Principal
metadata:
  name: temporal-entra
  namespace: temporal
spec:
  forProvider:
    clientIdRef:
      name: temporal-entra
    # Entra gives a token only to people and apps holding one of its roles.
    appRoleAssignmentRequired: true
    owners:
      - 57f4959a-6c64-4a71-b66e-d9255c4e6b5e
---
# The Temporal UI's client secret. The UI is not SPIFFE-aware, so it cannot use a federated credential.
# Crossplane writes it to the temporal-ui-entra Secret and renews it a month before it expires.
apiVersion: applications.azuread.m.upbound.io/v1beta1
kind: Password
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  forProvider:
    applicationIdRef:
      name: temporal-entra
    displayName: temporal-ui
    endDateRelative: 8760h
  writeConnectionSecretToRef:
    name: temporal-ui-entra
---
# Lets Matt use every Temporal namespace from the UI.
apiVersion: app.azuread.m.upbound.io/v1beta1
kind: RoleAssignment
metadata:
  name: temporal-ui-admin-matt
  namespace: temporal
spec:
  forProvider:
    # Temporal.temporal-system.admin, defined in cluster/temporal-controller/entra.yaml.
    appRoleId: cf5f035a-0cd7-4fb0-bcd5-31652af1bb5f
    principalObjectId: c685712a-a11c-40a0-9972-c250f7eac347
    resourceObjectIdRef:
      name: temporal-entra
