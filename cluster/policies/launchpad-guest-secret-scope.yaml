# Enforces the practical blast radius of the launchpad-api-guest-secret-creator
# ClusterRole (homelab-workspaces/launchpad/rbac.yaml), which grants `create` on
# Secrets cluster-wide because RBAC alone cannot scope `create` by namespace
# prefix or resourceName. This policy is the real boundary: launchpad-api's
# ServiceAccount may only create Secrets in guest-* namespaces, named
# demo{1-5}-tls or demo{1-5}-api-tls — the fixed set copyDemoTLSSecrets in
# guest.go ever creates.
#
# matchConditions scopes this policy to exactly one ServiceAccount — every other
# principal's Secret creates (Crossplane, cert-manager, etc.) are unaffected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: launchpad-guest-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-launchpad-api-service-account
      expression: >-
        request.userInfo.username == "system:serviceaccount:launchpad:launchpad-api"
  validations:
    - expression: request.namespace.startsWith("guest-")
      message: "launchpad-api may only create Secrets in guest-* namespaces"
    - expression: object.metadata.name.matches("^demo[1-5]-(api-)?tls$")
      message: "launchpad-api may only create Secrets named demo{1-5}-tls or demo{1-5}-api-tls"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: launchpad-guest-secret-scope-binding
spec:
  policyName: launchpad-guest-secret-scope
  validationActions: ["Deny"]
