# longhorn-manager carries an httpGet readiness probe on 9502, and the chart's own
# NetworkPolicy admits only named Longhorn pods. kube-router matches on address alone, so
# without this the probe is dropped and every longhorn-manager reports NotReady. Policies
# are additive, so this grants the one rule the chart's policy is missing rather than
# replacing it - it survives a chart upgrade untouched.
#
# The source is the cni0 bridge on each node, which is the first address of that node's pod
# CIDR, not the node's LAN address. Re-check these if a node is ever rebuilt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-kubelet-probe
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.3.1/32
        - ipBlock:
            cidr: 10.42.5.1/32
      ports:
        - protocol: TCP
          port: 9502
