apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-delete
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  # Two copies, one fewer than longhorn-retain.
  # This data is deleted with its owner, and each copy adds seconds to creating and attaching the volume.
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fromBackup: ""
