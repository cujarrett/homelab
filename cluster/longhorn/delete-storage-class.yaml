apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-delete
  annotations:
    # StorageClass parameters cannot change in place, so a sync deletes and recreates it.
    # Volumes that already exist keep the settings they were made with.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  # Two copies, one fewer than longhorn-retain.
  # This data is deleted with its owner, and each copy adds seconds to creating and attaching the volume.
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fromBackup: ""
