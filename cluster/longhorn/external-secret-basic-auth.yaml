# Credentials for the Longhorn UI basicAuth middleware — see
# cluster/monitoring/external-secrets-basic-auth.yaml for why these exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: longhorn-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: homelab/cluster
        property: longhorn_basic_auth_htpasswd
