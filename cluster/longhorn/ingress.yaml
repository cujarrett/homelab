apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "longhorn-system-longhorn-basic-auth@kubernetescrd"
    cert-manager.io/cluster-issuer: local-lab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - longhorn.local.lab
      secretName: longhorn-tls-cert
  rules:
    - host: longhorn.local.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
---
# --- basicAuth Middleware ---
# Longhorn has no native authentication, so the control has to sit at the proxy.
# Credentials live in the hand-created `longhorn-basic-auth` Secret in this namespace
# (key `users`, bcrypt htpasswd line) — never in Git, same as the tunnel token.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: longhorn-basic-auth
    # Strip the Authorization header once Traefik has checked it. Without this
    # Traefik forwards the credential on to a backend that has no use for it.
    removeHeader: true
