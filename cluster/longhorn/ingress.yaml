apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  # The API server's defaults are written out.
  # This app uses ServerSideApply, and ArgoCD's server-side diff then leaves defaults
  # out of the predicted state, so the route shows OutOfSync forever.
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: traefik-gateway, namespace: kube-system}
  hostnames: [longhorn.local.lab]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: longhorn-basic-auth}
      backendRefs:
        - {group: "", kind: Service, name: longhorn-frontend, port: 80, weight: 1}
---
# --- basicAuth Middleware ---
# No native authentication, so the control sits at the proxy. Credentials live in
# `longhorn-basic-auth` (key `users`, bcrypt htpasswd line), rendered by External Secrets.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: longhorn-basic-auth
    # Strip the Authorization header once Traefik has checked it. Without this
    # Traefik forwards the credential on to a backend that has no use for it.
    removeHeader: true
