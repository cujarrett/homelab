apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:compose-wordpress
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets", "services", "persistentvolumeclaims", "namespaces", "configmaps", "serviceaccounts"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares", "ingressroutes"]
    verbs: ["*"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["*"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "servicemonitors/status"]
    verbs: ["*"]
  - apiGroups: ["jetstream.nats.io"]
    resources: ["streams", "consumers", "streams/status", "consumers/status"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "httproutes/status"]
    verbs: ["*"]
---
# Istio mesh resources composed by XConnection and (mesh baseline) XApi/XSpa.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:compose-mesh
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "authorizationpolicies/status", "peerauthentications", "peerauthentications/status"]
    verbs: ["*"]
  - apiGroups: ["networking.istio.io"]
    resources: ["serviceentries", "serviceentries/status", "sidecars", "sidecars/status"]
    verbs: ["*"]
