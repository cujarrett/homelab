# The managed resource types the compositions create. Each provider ships every type
# in its service, twice, and each active type is a CRD the API server holds in memory.
# A composition that adds a new provider type must list it here, or that type has no CRD.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: default
spec:
  activate:
    - applications.applications.azuread.m.upbound.io
    - approles.applications.azuread.m.upbound.io
    - federatedidentitycredentials.applications.azuread.m.upbound.io
    - permissiongrants.serviceprincipaldelegated.azuread.m.upbound.io
    - principals.serviceprincipals.azuread.m.upbound.io
    - roleassignments.app.azuread.m.upbound.io
    - buckets.s3.aws.m.upbound.io
    - instances.rds.aws.m.upbound.io
    - replicationgroups.elasticache.aws.m.upbound.io
    - roles.iam.aws.m.upbound.io
    - secrets.secretsmanager.aws.m.upbound.io
    - secretversions.secretsmanager.aws.m.upbound.io
    - tables.dynamodb.aws.m.upbound.io
    - usergroups.elasticache.aws.m.upbound.io
    - users.elasticache.aws.m.upbound.io
