apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: worker-nodes
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # Keep provider/function runtimes off the control-plane node (ctrl-1) - they
          # are memory-heavy (provider-aws-s3 + family-aws alone ~830Mi) and ctrl-1 needs
          # headroom for istiod and fleet-wide sidecars (platform-connections plan).
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          containers:
            - name: package-runtime
              # Providers request nothing by default while each holds 270-740Mi, so the
              # scheduler counts them as free and stacks them on one node. No limit - a
              # provider that briefly exceeds this should be scheduled honestly, not killed.
              resources:
                requests:
                  memory: 256Mi

---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: worker-nodes-idle
spec:
  deploymentTemplate:
    spec:
      # Providers only the platform e2e suite exercises. They hold ~600Mi between runs
      # for zero managed resources, so the controller is scaled to nothing while the
      # CRDs stay installed and the compositions still render. Scale to 1 before
      # `just test-e2e`, back to 0 after.
      replicas: 0
      selector: {}
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          containers:
            - name: package-runtime
              resources:
                requests:
                  memory: 256Mi

---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.3.0
  runtimeConfigRef:
    name: worker-nodes
