apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: worker-nodes
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # Keep provider/function runtimes off the control-plane node (ctrl-1) — they
          # are memory-heavy (provider-aws-s3 + family-aws alone ~830Mi) and ctrl-1 needs
          # headroom for istiod and fleet-wide sidecars (platform-connections plan).
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          containers:
            - name: package-runtime

---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.3.0
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.12.0
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.8.2
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-family-aws
spec:
  package: xpkg.upbound.io/upbound/provider-family-aws:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-elasticache
spec:
  package: xpkg.upbound.io/upbound/provider-aws-elasticache:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-iam
spec:
  package: xpkg.upbound.io/upbound/provider-aws-iam:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-rds
spec:
  package: xpkg.upbound.io/upbound/provider-aws-rds:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-dynamodb
spec:
  package: xpkg.upbound.io/upbound/provider-aws-dynamodb:v2.6.1
  runtimeConfigRef:
    name: worker-nodes
