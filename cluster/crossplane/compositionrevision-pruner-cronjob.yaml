apiVersion: v1
kind: ServiceAccount
metadata:
  name: compositionrevision-pruner
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compositionrevision-pruner
rules:
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositionrevisions"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compositionrevision-pruner
subjects:
  - kind: ServiceAccount
    name: compositionrevision-pruner
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: compositionrevision-pruner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compositionrevision-pruner-script
  namespace: crossplane-system
data:
  prune.sh: |
    #!/bin/sh
    set -eu
    comps=$(kubectl get compositionrevision -o jsonpath='{.items[*].metadata.labels.crossplane\.io/composition-name}' | tr ' ' '\n' | sort -u)
    for comp in $comps; do
      count=$(kubectl get compositionrevision -l crossplane.io/composition-name="$comp" --no-headers | wc -l | tr -d ' ')
      delete=$((count - 3))
      if [ "$delete" -gt 0 ]; then
        kubectl get compositionrevision -l crossplane.io/composition-name="$comp" \
          --no-headers --sort-by='.spec.revision' | awk '{print $1}' | head -n "$delete" \
          | xargs -r kubectl delete compositionrevision
      fi
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compositionrevision-pruner
  namespace: crossplane-system
spec:
  schedule: "0 8 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: compositionrevision-pruner
          restartPolicy: OnFailure
          containers:
            - name: prune
              image: alpine/kubectl:1.36.4
              command: ["sh", "/scripts/prune.sh"]
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: compositionrevision-pruner-script
