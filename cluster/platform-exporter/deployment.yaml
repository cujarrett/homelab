apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-exporter
  namespace: platform-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-exporter
  template:
    metadata:
      labels:
        app: platform-exporter
    spec:
      serviceAccountName: platform-exporter
      # runAsUser overrides the image's own USER, which is a name (USER app) - the
      # kubelet will not honour runAsNonRoot for a name it cannot resolve.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-exporter
          image: ghcr.io/cujarrett/platform-exporter:sha-80829cfcdf51bc494bd38fd80bbee2339fd74ec1@sha256:b7980b425f1302d9df6929fd1997d7e01d7fcb0c81ba78a6fee56f4f41cf3a14
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-exporter
  namespace: platform-exporter
  labels:
    app: platform-exporter
spec:
  selector:
    app: platform-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
